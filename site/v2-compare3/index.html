<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디자인 비교 · 세 가지</title>
<style>
  :root { --bg: #1B1F23; --bar: #23282D; --line: #39414A; --text: #ECEEF0; --dim: #B5BDC5; --accent: #A9BEFF; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 16px; background: var(--bar); border-bottom: 1px solid var(--line); }
  header b { font-size: 15px; }
  header span { font-size: 12px; color: var(--dim); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; margin-left: auto; flex-wrap: wrap; }
  .seg button { background: none; border: 0; color: var(--dim); padding: 7px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .seg button.on { background: rgba(169,190,255,.15); color: #fff; font-weight: 700; }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  main { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px; height: calc(100vh - 54px); }
  main.one { grid-template-columns: 1fr; }
  .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .pane h2 { margin: 0; padding: 7px 12px; font-size: 13px; background: var(--bar); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
  .pane h2 a { color: var(--dim); font-weight: 400; font-size: 12px; white-space: nowrap; }
  .frame { flex: 1; position: relative; overflow: hidden; background: #fff; }
  .frame iframe { position: absolute; top: 0; left: 0; width: 1440px; border: 0; transform-origin: 0 0; }
  .hide { display: none !important; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } .pane { height: 80vh; } }
</style>
</head>
<body>
<header>
  <b>디자인 비교 — 세 가지</b>
  <span>모두 샘플 데이터로 열리고 실제 장부에는 저장되지 않아요. 1440px 화면을 칸 너비에 맞게 줄여 보여줍니다. 크게 보려면 칸 하나만 고르거나 새 창으로 여세요.</span>
  <div class="seg" role="group" aria-label="보기 선택">
    <button data-mode="all" class="on">셋 나란히</button>
    <button data-mode="p-orig">원본</button>
    <button data-mode="p-a">A · ui-ux-pro-max</button>
    <button data-mode="p-b">B · frontend-design</button>
  </div>
</header>
<main id="m">
  <section class="pane" id="p-orig"><h2>원본 <a href="../v2-preview/" target="_blank" rel="noopener">새 창으로 열기</a></h2>
    <div class="frame"><iframe src="../v2-preview/" title="원본 화면"></iframe></div></section>
  <section class="pane" id="p-a"><h2>A · ui-ux-pro-max <a href="../v2-design/" target="_blank" rel="noopener">새 창으로 열기</a></h2>
    <div class="frame"><iframe src="../v2-design/" title="샘플 A 화면"></iframe></div></section>
  <section class="pane" id="p-b"><h2>B · frontend-design <a href="../v2-fd/" target="_blank" rel="noopener">새 창으로 열기</a></h2>
    <div class="frame"><iframe src="../v2-fd/" title="샘플 B 화면"></iframe></div></section>
</main>
<script>
  function fit() {
    document.querySelectorAll('.frame').forEach(function (f) {
      if (!f.clientWidth) return;
      var r = f.clientWidth / 1440, i = f.querySelector('iframe');
      i.style.transform = 'scale(' + r + ')';
      i.style.height = (f.clientHeight / r) + 'px';
    });
  }
  document.querySelectorAll('.seg button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.seg button').forEach(function (x) { x.classList.toggle('on', x === b); });
      var mode = b.getAttribute('data-mode');
      ['p-orig', 'p-a', 'p-b'].forEach(function (id) { document.getElementById(id).classList.toggle('hide', mode !== 'all' && mode !== id); });
      document.getElementById('m').classList.toggle('one', mode !== 'all');
      fit();
    });
  });
  window.addEventListener('resize', fit); fit();
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRT_ 재고관리</title>
<style>
  .ivs-root {
    background: var(--bg); color: var(--text); min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif;
    padding: 20px; border-radius: 14px; position: relative; box-sizing: border-box;
  }
  .ivs-root * { box-sizing: border-box; }
  .ivs-viewgate { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  body { background: #0A0E16; margin: 0; }
  .ivs-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .ivs-title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ivs-title { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .ivs-subtitle { color: var(--text-dim); font-size: 12.5px; margin: 4px 0 0; }
  .ivs-share-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--accent-2);
    background: rgba(69,214,184,0.1); border: 1px solid rgba(69,214,184,0.3); padding: 2px 8px; border-radius: 999px; }
  .ivs-saving { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-dim); }
  .ivs-title-edit { color: var(--text-dim); }
  .ivs-lock-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 2px 8px; border-radius: 999px; }
  .ivs-lock-chip.locked { color: #FF8B84; background: rgba(240,100,92,0.1); border: 1px solid rgba(240,100,92,0.3); }
  .ivs-lock-chip.unlocked { color: var(--accent-2); background: rgba(69,214,184,0.1); border: 1px solid rgba(69,214,184,0.3); }
  .ivs-settings-divider { height: 1px; background: var(--border); margin: 2px 0; }

  .ivs-master-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); padding: 0 16px; }
  .ivs-input-auto { background: var(--surface-2); color: var(--text-dim); cursor: default; }
  .ivs-master-form { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .ivs-master-form .ivs-input { flex: 1; min-width: 130px; }
  .ivs-master-list { border: 1px solid var(--border); border-radius: 8px; max-height: 240px; overflow-y: auto; }
  .ivs-master-row { display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .ivs-master-row:last-child { border-bottom: none; }

  .ivs-lock-screen { max-width: 340px; padding: 40px 28px 32px; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; }
  .ivs-lock-close { position: absolute; top: 12px; right: 12px; }
  .ivs-lock-icon { width: 52px; height: 52px; border-radius: 50%; background: rgba(227,153,61,0.12); color: var(--accent);
    display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
  .ivs-lock-title { margin: 0 0 6px; font-size: 17px; }
  .ivs-lock-input { width: 100%; text-align: center; letter-spacing: 6px; font-size: 15px; padding: 12px; }
  .ivs-lock-input::placeholder { letter-spacing: 4px; }
  .ivs-lock-submit { width: 100%; margin-top: 14px; justify-content: center; padding: 10px; }
  .ivs-header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .ivs-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); padding: 7px 12px; border-radius: 8px; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
  .ivs-btn:hover { border-color: #3A4658; }
  .ivs-btn:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 1px; }
  .ivs-btn-primary { background: var(--accent); border-color: var(--accent); color: #1A1206; font-weight: 600; }
  .ivs-btn-primary:hover { filter: brightness(1.08); }
  .ivs-btn-danger { background: rgba(240,100,92,0.12); border-color: rgba(240,100,92,0.4); color: #FF8B84; }
  .ivs-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .ivs-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .ivs-tab { background: none; border: none; color: var(--text-dim); padding: 9px 14px; font-size: 13.5px;
    cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .ivs-tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .ivs-tab.disabled { opacity: 0.4; cursor: default; }
  .ivs-tab.disabled:hover { color: var(--text-dim); }

  .ivs-loading { display: flex; align-items: center; gap: 8px; justify-content: center; padding: 60px 0; color: var(--text-dim); }
  .ivs-spin { animation: ivs-spin 0.8s linear infinite; }
  @keyframes ivs-spin { to { transform: rotate(360deg); } }

  .ivs-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 16px 22px; margin-bottom: 16px; }
  .ivs-card-label { font-size: 12px; color: var(--text-dim); margin-bottom: 22px; }
  .ivs-filtered-note { color: var(--accent-2); }

  .ivs-flow { display: flex; align-items: flex-start; overflow-x: auto; padding-bottom: 4px; }
  .ivs-flow-item { display: flex; flex-direction: column; align-items: center; min-width: 84px; flex: 1; position: relative; }
  .ivs-flow-node-wrap { display: flex; align-items: center; width: 100%; justify-content: center; position: relative; }
  .ivs-flow-node { width: 58px; height: 58px; border-radius: 50%; border: 2px solid var(--stage-color);
    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;
    font-family: inherit; font-variant-numeric: tabular-nums; color: var(--text); background: var(--surface-2);
    z-index: 1; flex-shrink: 0; cursor: pointer; padding: 0; transition: transform 0.1s ease; }
  .ivs-flow-node:hover { transform: scale(1.06); }
  .ivs-flow-node:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
  .ivs-flow-node.selected { background: var(--stage-color); color: #0A0E16; font-weight: 800; }
  .ivs-flow-node.bottleneck { box-shadow: 0 0 0 4px rgba(227,153,61,0.18); }
  .ivs-flow-hint { color: var(--text-dim); font-weight: 400; }
  .ivs-flow-line { position: absolute; left: 50%; top: 50%; width: calc(100% + 26px); height: 2px; transform: translateY(-50%);
    background: linear-gradient(90deg, var(--stage-color), var(--border));
    background-size: 200% 100%; animation: ivs-flow 3.5s linear infinite; z-index: 0; }
  @keyframes ivs-flow { from { background-position: 0% 0; } to { background-position: -200% 0; } }
  .ivs-flow-label { font-size: 11px; color: var(--text-dim); margin-top: 10px; text-align: center; line-height: 1.3; }
  .ivs-flow-bottleneck { font-size: 10px; color: var(--accent); font-weight: 700; margin-top: 2px; }

  .ivs-summary-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .ivs-summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .ivs-summary-card.accent { border-color: rgba(227,153,61,0.4); }
  .ivs-summary-label { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
  .ivs-summary-value { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ivs-summary-unit { font-size: 14px; color: var(--text-dim); font-weight: 500; }

  .ivs-filterbar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; }
  .ivs-search { position: relative; margin-bottom: 10px; }
  .ivs-search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-dim); }
  .ivs-search-input { width: 100%; padding-left: 32px; }
  .ivs-filter-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .ivs-daterange { display: flex; align-items: center; gap: 6px; }
  .ivs-tilde { color: var(--text-dim); }
  .ivs-spacer { flex: 1; }

  .ivs-input, .ivs-select { background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; padding: 7px 10px; font-size: 12.5px; }
  .ivs-input:focus, .ivs-select:focus { outline: 2px solid var(--accent-2); outline-offset: 0; border-color: transparent; }
  .ivs-select-full { width: 100%; }
  .ivs-checkbox-label { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-dim); cursor: pointer; white-space: nowrap; }

  .ivs-bulkbar { display: flex; align-items: center; gap: 10px; background: rgba(227,153,61,0.08);
    border: 1px solid rgba(227,153,61,0.3); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: 12.5px; }

  .ivs-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
  .ivs-table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 1100px; }
  .ivs-table th { text-align: left; color: var(--text-dim); font-weight: 600; font-size: 11.5px;
    padding: 10px 10px; border-bottom: 1px solid var(--border); background: var(--surface); white-space: nowrap; position: sticky; top: 0; }
  .ivs-table td { padding: 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .ivs-table tbody tr:hover { background: var(--surface-2); }
  .ivs-th-check, .ivs-th-actions { width: 34px; }
  .ivs-th-sort { background: none; border: none; color: inherit; font: inherit; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; padding: 0; }
  .ivs-th-sort.active { color: var(--text); }
  .ivs-arrow-up { transform: rotate(180deg); }
  .ivs-right { text-align: right; }
  .ivs-mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
  .ivs-dim { color: var(--text-dim); }
  .ivs-empty { text-align: center; color: var(--text-dim); padding: 32px 0 !important; white-space: normal; }
  @media (max-width: 900px) { .ivs-hide-sm { display: none; } }

  .ivs-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
  .ivs-badge-warn { border-color: rgba(227,153,61,0.5); color: var(--accent); background: rgba(227,153,61,0.12); margin-left: 4px; }

  .ivs-row-menu-cell { position: relative; }
  .ivs-icon-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 4px; border-radius: 6px; display: inline-flex; }
  .ivs-icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .ivs-menu { position: absolute; right: 6px; top: 32px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden; z-index: 20; min-width: 130px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .ivs-menu button { display: flex; align-items: center; gap: 7px; width: 100%; text-align: left; background: none;
    border: none; color: var(--text); font-size: 12.5px; padding: 8px 10px; cursor: pointer; }
  .ivs-menu button:hover { background: var(--bg); }
  .ivs-menu-danger { color: #FF8B84 !important; }

  .ivs-tablefoot { font-size: 11.5px; color: var(--text-dim); margin-top: 8px; }

  .ivs-overlay { position: fixed; inset: 0; background: rgba(4,6,10,0.6); backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .ivs-modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 480px; max-height: 88vh; display: flex; flex-direction: column; }
  .ivs-modal-sm { max-width: 380px; }
  .ivs-modal-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .ivs-modal-head h3 { margin: 0; font-size: 14.5px; }
  .ivs-modal-body { padding: 16px; overflow-y: auto; }
  .ivs-modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
  .ivs-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ivs-form-checks { grid-column: 1 / -1; display: flex; gap: 16px; margin-top: 2px; }
  .ivs-field { display: flex; flex-direction: column; gap: 5px; font-size: 11.5px; color: var(--text-dim); }
  .ivs-field input, .ivs-field select { width: 100%; }

  .ivs-stage-picker { display: flex; flex-wrap: wrap; gap: 6px; }
  .ivs-stage-pick { border: 1px solid var(--stage-color); color: var(--stage-color); background: transparent;
    padding: 6px 10px; border-radius: 999px; font-size: 12px; cursor: pointer; }
  .ivs-stage-pick.active { background: var(--stage-color); color: #10161F; font-weight: 700; }

  .ivs-confirm-body { display: flex; gap: 12px; align-items: flex-start; }
  .ivs-confirm-icon { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--surface-2); }
  .ivs-confirm-icon.danger { color: #FF8B84; background: rgba(240,100,92,0.12); }
  .ivs-confirm-title { margin: 0 0 4px; font-size: 14px; }

  .ivs-toast { position: fixed; bottom: 20px; right: 20px; background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); padding: 10px 14px; border-radius: 8px; font-size: 12.5px; display: flex; align-items: center; gap: 6px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index: 60; }
  .ivs-toast-success { border-color: rgba(52,211,153,0.4); color: #6EE7B7; }
  .ivs-toast-error { border-color: rgba(240,100,92,0.4); color: #FF8B84; }

  .ivs-move-diff { font-size: 12px; margin-top: 8px; padding: 6px 10px; border-radius: 7px; }
  .ivs-move-diff.loss { color: #FF8B84; background: rgba(240,100,92,0.1); }
  .ivs-move-diff.mix { color: var(--accent-2); background: rgba(69,214,184,0.1); }

  .ivs-prod-desc { color: var(--text-dim); font-size: 12.5px; line-height: 1.6; margin: 0 0 16px; }
  .ivs-prod-report-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 8px; }
  .ivs-prod-report-actions { display: flex; gap: 8px; align-items: center; }
  .ivs-summary-row-4 { grid-template-columns: repeat(4, 1fr); margin-bottom: 18px; }
  .ivs-summary-row-5 { grid-template-columns: repeat(5, 1fr); }
  .ivs-prod-listlabel { font-size: 12px; color: var(--text-dim); margin: 14px 0 6px; }
  .ivs-prod-list { max-height: 150px; overflow-y: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
  .ivs-prod-row { padding: 7px 12px; font-size: 12px; font-family: ui-monospace, "SF Mono", Menlo, monospace; border-bottom: 1px solid var(--border); }
  .ivs-prod-row:last-child { border-bottom: none; }
  .ivs-prod-empty { padding: 20px; text-align: center; color: var(--text-dim); font-size: 12.5px; }
  .ivs-prod-empty.center { padding: 34px 0; }
  .ivs-prod-tag { font-size: 10.5px; padding: 1px 6px; border-radius: 999px; margin-left: 6px; }
  .ivs-prod-tag.loss { background: rgba(240,100,92,0.14); color: #FF8B84; }
  .ivs-prod-tag.mix { background: rgba(69,214,184,0.14); color: var(--accent-2); }
  .ivs-prod-periodbar { display: flex; align-items: center; gap: 8px; margin: 18px 0 12px; flex-wrap: wrap; }
  .ivs-yield-table { min-width: 0; }
  .ivs-summary-sub { font-size: 10.5px; color: var(--text-dim); margin-top: 4px; }

  .ivs-dash-note { font-size: 11.5px; color: var(--text-dim); line-height: 1.6; margin: 0 0 16px; }
  .ivs-stage-breakdown { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-top: 16px; }
  .ivs-stage-breakdown-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .ivs-stage-breakdown-row:last-child { border-bottom: none; }
  .ivs-stage-breakdown-val { text-align: right; }
  .ivs-stage-breakdown-val span { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ivs-stage-breakdown-val small { display: block; font-size: 10px; color: var(--text-dim); }
  .ivs-final-badge { font-size: 10px; padding: 1px 6px; border-radius: 999px; background: rgba(52,211,153,0.14); color: #34D399; margin-left: 6px; }

  .ivs-collapse-head { width: 100%; display: flex; justify-content: space-between; align-items: center; background: none; border: none; color: var(--text); cursor: pointer; padding: 0; margin-bottom: 16px; }
  .ivs-collapse-chevron { transition: transform 0.15s ease; color: var(--text-dim); flex-shrink: 0; }
  .ivs-collapse-chevron.closed { transform: rotate(-90deg); }

  .ivs-rank-list { display: flex; flex-direction: column; gap: 16px; }
  .ivs-rank-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
  .ivs-rank-left { display: flex; align-items: center; gap: 6px; font-size: 12.5px; min-width: 0; }
  .ivs-rank-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .ivs-rank-label { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }
  .ivs-rank-count { color: var(--text-dim); white-space: nowrap; }
  .ivs-rank-right { min-width: 160px; }
  .ivs-rank-value { font-size: 13px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .ivs-rank-net { display: block; font-size: 10.5px; font-weight: 500; color: var(--text-dim); font-family: -apple-system, sans-serif; }
  .ivs-rank-bar-track { height: 5px; border-radius: 999px; background: var(--bg); margin-top: 5px; overflow: hidden; }
  .ivs-rank-bar-fill { height: 100%; border-radius: 999px; }

  .ivs-comingsoon { padding: 60px 0; text-align: center; color: var(--text-dim); }
  @media print { .ivs-tabs, .ivs-header-actions, .ivs-prod-report-actions { display: none; } }

  .ivs-card-head-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
  .ivs-agg-list { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .ivs-agg-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 8px; }
  .ivs-agg-row:last-child { border-bottom: none; }
  .ivs-agg-name { font-size: 13px; font-weight: 600; }
  .ivs-agg-pair { display: flex; gap: 28px; }
  .ivs-agg-stat { text-align: right; }
  .ivs-agg-stat span { display: block; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .ivs-agg-stat small { font-size: 10.5px; color: var(--text-dim); }

  @media (max-width: 900px) {
    .ivs-summary-row-4, .ivs-summary-row-5 { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 640px) {
    .ivs-summary-row { grid-template-columns: 1fr; }
    .ivs-form-grid { grid-template-columns: 1fr; }
    .ivs-summary-row-4, .ivs-summary-row-5 { grid-template-columns: 1fr; }
  }
</style>
</head>

<div id="ivs-app-root"></div>
<script>

// ---------- 팀 공유 데이터: Firebase Realtime Database에 실시간으로 읽고 써요 ----------
// (2안) 1안(GitHub Pages + data.json)과 달리, 이건 브라우저가 Firebase와 직접 통신해요.
// 그래서 누가 입력하면 "Claude에게 파일 전달 → 재배포" 절차 없이, 열려있는 모든 화면에 곧바로(1초 이내) 반영돼요.
// SDK/CDN 없이 Firebase의 표준 REST API + Server-Sent Events만 써요 (둘 다 순수 브라우저 표준 기능).
//   - 읽기: GET {DB_BASE}/inventory.json
//   - 쓰기: PUT {DB_BASE}/inventory.json (매번 전체 데이터를 통째로 씀 — 단순하고 안전)
//   - 실시간 구독: EventSource로 스트림을 열어두면 누가 바꿀 때마다 "put" 이벤트가 즉시 옴
const DB_BASE = "https://drt-stock-status-default-rtdb.firebaseio.com";
const DATA_PATH = "/inventory.json";
const FALLBACK_DATA = {
  lots: [], moves: [],
  settings: { ...DEFAULT_SETTINGS }, master: { ...DEFAULT_MASTER },
};
function normalizeLive(data) {
  if (!data || typeof data !== "object") return { ...FALLBACK_DATA };
  return {
    lots: Array.isArray(data.lots) ? data.lots : [],
    moves: Array.isArray(data.moves) ? data.moves : [],
    settings: { ...DEFAULT_SETTINGS, ...(data.settings || {}) },
    master: { ...DEFAULT_MASTER, ...(data.master || {}) },
  };
}
async function fetchLive() {
  try {
    const res = await fetch(DB_BASE + DATA_PATH, { cache: "no-store" });
    if (!res.ok) throw new Error(`fetch failed: ${res.status}`);
    return normalizeLive(await res.json());
  } catch (e) {
    return null;
  }
}
async function writeLive(fullObj) {
  const res = await fetch(DB_BASE + DATA_PATH, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(fullObj),
  });
  if (!res.ok) throw new Error(`write failed: ${res.status}`);
  return true;
}
// 실시간 구독: onData는 전체 데이터가 바뀔 때마다 호출돼요. onStatus는 연결 상태 표시용.
function subscribeLive(onData, onStatus) {
  let es;
  try {
    es = new EventSource(DB_BASE + DATA_PATH);
  } catch (e) {
    onStatus?.("error");
    return () => {};
  }
  es.addEventListener("put", (e) => {
    try {
      const payload = JSON.parse(e.data); // { path: "/...", data: ... }
      if (payload.path === "/") onData(normalizeLive(payload.data));
      // 하위 경로만 바뀐 patch/put은 우리가 항상 루트를 통째로 쓰기 때문에 사실상 안 옴 — 무시해도 안전.
    } catch (err) {}
  });
  es.onopen = () => onStatus?.("connected");
  es.onerror = () => onStatus?.("reconnecting"); // EventSource가 알아서 재연결을 시도해요
  return () => es.close();
}
// bootstrap()이 첫 fetch를 마친 뒤 실제 값으로 덮어써요 (렌더 전에 반드시 채워짐).
let LIVE_DATA = FALLBACK_DATA;

// ---------- 유틸 ----------
const fmtKg = (n) => (n == null ? "-" : `${Number(n).toLocaleString("ko-KR")} Kg`);
const fmtTon = (kg) =>
  (kg / 1000).toLocaleString("ko-KR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const weekLabel = (dateStr) => {
  if (!dateStr) return "-";
  const d = new Date(`${dateStr}T00:00:00`);
  const week = Math.ceil(d.getDate() / 7);
  return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${week}주차`;
};
const uid = () => `lot-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
const sumBy = (arr, key) => arr.reduce((s, x) => s + (Number(x[key]) || 0), 0);
const pad2 = (n) => String(n).padStart(2, "0");
const csvEscape = (v) => {
  const s = v == null ? "" : String(v);
  return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
};

// 대시보드 "월마감 스냅샷": 선택한 연/월/일로 기준일을 계산해요.
// 일까지 고르면 그 날짜, 월만 고르면 그 달 말일, 연도만 고르면 그 해 12/31.
function computeAsOfDate(year, month, day) {
  if (month !== "all" && day !== "all") return `${year}-${pad2(Number(month))}-${pad2(Number(day))}`;
  if (month !== "all") {
    const lastDay = new Date(Number(year), Number(month), 0).getDate();
    return `${year}-${pad2(Number(month))}-${pad2(lastDay)}`;
  }
  return `${year}-12-31`;
}

// 공정이동 이력을 거슬러 올라가, 기준일 시점에 이 로트가 어떤 단계에 얼마나 있었는지 재구성해요.
function reconstructLotState(lot, lotMoves, asOfDate) {
  if (lot.receivedDate > asOfDate) return null; // 그 시점엔 아직 입고 전
  const sorted = [...lotMoves].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  const applicable = sorted.filter((m) => m.date <= asOfDate);
  if (applicable.length > 0) {
    const last = applicable[applicable.length - 1];
    return { stage: last.toStage, qtyKg: last.outputQty };
  }
  if (sorted.length > 0) {
    const first = sorted[0];
    return { stage: first.fromStage, qtyKg: first.inputQty }; // 아직 첫 이동 전이면 이동 전 상태
  }
  return { stage: lot.stage, qtyKg: lot.qtyKg }; // 이동 이력이 없으면 입고 이후 그대로라고 가정
}

// ---------- 파일 내려받기 (일반 웹사이트라서 브라우저 다운로드를 바로 써요) ----------
function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const emptyForm = {
  code: CATEGORIES[0].code, name: "", categoryId: CATEGORIES[0].id, vendor: VENDORS[0].name,
  shipLoc: VENDORS[0].loc, lotNo: "", receivedDate: new Date().toISOString().slice(0, 10),
  stage: "raw_in", qtyKg: "", waterKg: "", excludeKg: "", tolling: false, carriedOver: false,
};

const ROOT_VARS = {
  "--bg": "#0A0E16", "--surface": "#10161F",
  "--surface-2": "#171F2C", "--border": "#232C3B", "--text": "#E7ECF3",
  "--text-dim": "#8B96A8", "--accent": "#E3993D", "--accent-2": "#45D6B8",
  "--danger": "#F0645C", "--radius": "10px",
};

function InventorySystem() {
  const [activeTab, setActiveTab] = useState("inventory"); // 'inventory' | 'production' | 'tolling' | 'dashboard'
  // 부트스트랩(bootstrap())이 렌더 전에 Firebase에서 한 번 읽어온 값으로 시작해요. 그 뒤로는
  // 실시간 구독(subscribeLive)이 변경분을 계속 밀어줘요 — 별도의 "로컬 저장" 개념이 아예 없어요.
  const [lots, setLots] = useState(() => LIVE_DATA.lots);
  const [moves, setMoves] = useState(() => LIVE_DATA.moves); // 공정이동(단계 이동) 이력 — 생산 탭에서 분석용으로 사용
  const [saving, setSaving] = useState(false);
  const [toast, setToast] = useState(null);

  const [filters, setFilters] = useState({
    search: "", dateFrom: "", dateTo: "", year: "all",
    tollingOnly: false, stage: "all", category: "all",
  });
  const [sort, setSort] = useState({ key: "receivedDate", dir: "desc" });
  const [selected, setSelected] = useState(() => new Set());
  const [openMenuId, setOpenMenuId] = useState(null);

  const [formModal, setFormModal] = useState(null); // { mode: 'add'|'edit', values }
  const [moveModal, setMoveModal] = useState(null); // lot
  const [deleteTarget, setDeleteTarget] = useState(null); // lot | 'bulk'
  const [resetConfirm, setResetConfirm] = useState(false);
  const [clearMovesConfirm, setClearMovesConfirm] = useState(false);
  const [settings, setSettingsState] = useState(() => LIVE_DATA.settings);
  const [settingsModalOpen, setSettingsModalOpen] = useState(false);
  const [master, setMaster] = useState(() => LIVE_DATA.master); // 거래처 · 품목코드 등록 정보
  const [masterModalOpen, setMasterModalOpen] = useState(false);
  const [unlocked, setUnlocked] = useState(false); // 세션에서만 유지 (보안을 위해 저장하지 않음)
  const [viewUnlocked, setViewUnlocked] = useState(false); // 세션에서만 유지
  const canEdit = !settings.editPin || unlocked;
  // 보기 잠금 — 걸려있으면 이 PIN을 맞히기 전까지는 화면 전체가 잠금 화면 하나만 보여요 (재고 데이터 자체가 안 보임).
  // 편집 잠금(editPin)과는 별개예요: 팀원에게는 이 보기 PIN만 알려주면 되고, 편집 PIN은 관리자만 알면 돼요.
  const viewGateEnabled = !!settings.viewPin;

  const [liveStatus, setLiveStatus] = useState("connecting"); // "connecting" | "connected" | "reconnecting"

  // ---------- 실시간 구독: 누군가 Firebase에 쓰면 1초 안에 모두에게 반영돼요 ----------
  useEffect(() => {
    const unsubscribe = subscribeLive((data) => {
      setLots(data.lots);
      setMoves(data.moves);
      setSettingsState(data.settings);
      setMaster(data.master);
    }, setLiveStatus);
    return unsubscribe;
  }, []);

  const showToast = useCallback((msg, type = "info") => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 2600);
  }, []);

  // 수동 새로고침 — 평소엔 실시간 구독이 알아서 반영하지만, 혹시 연결이 끊겼다 싶을 때 안전판으로 둬요.
  const manualRefresh = useCallback(async () => {
    const data = await fetchLive();
    if (!data) { showToast("새로고침에 실패했어요. 네트워크를 확인해주세요.", "error"); return; }
    setLots(data.lots);
    setMoves(data.moves);
    setSettingsState(data.settings);
    setMaster(data.master);
    showToast("최신 데이터로 새로고침했어요.", "success");
  }, [showToast]);

  // 모든 쓰기는 lots/moves/settings/master 네 조각을 통째로 합쳐서 Firebase에 한 번에 PUT해요.
  // (부분만 따로 쓰면, 같은 동작 안에서 두 조각을 연달아 쓸 때 옛 값으로 덮어쓰는 경합이 생길 수 있어서
  //  항상 "지금 이 순간의 완성된 전체 값"을 명시적으로 만들어서 써요.)
  const writeAll = useCallback(async (next) => {
    setSaving(true);
    try {
      await writeLive(next);
    } catch (e) {
      showToast("저장에 실패했어요. 네트워크를 확인해주세요.", "error");
    } finally {
      setSaving(false);
    }
  }, [showToast]);

  const persist = useCallback(async (nextLots) => {
    if (!canEdit) return;
    setLots(nextLots);
    await writeAll({ lots: nextLots, moves, settings, master });
  }, [canEdit, moves, settings, master, writeAll]);

  const persistMoves = useCallback(async (nextMoves) => {
    if (!canEdit) return;
    setMoves(nextMoves);
    await writeAll({ lots, moves: nextMoves, settings, master });
  }, [canEdit, lots, settings, master, writeAll]);

  const persistMaster = useCallback(async (nextMaster, msg) => {
    if (!canEdit) return;
    setMaster(nextMaster);
    await writeAll({ lots, moves, settings, master: nextMaster });
    if (msg) showToast(msg, "success");
  }, [canEdit, lots, moves, settings, writeAll, showToast]);

  const persistSettings = useCallback(async (nextSettings) => {
    setSettingsState(nextSettings);
    await writeAll({ lots, moves, settings: nextSettings, master });
    showToast("설정을 저장했어요.", "success");
  }, [lots, moves, master, writeAll, showToast]);

  // ---------- CRUD ----------
  const handleSaveForm = async (values) => {
    const qtyKg = Number(values.qtyKg);
    if (!values.code || !values.lotNo || !qtyKg) {
      showToast("품목코드 · 로트번호 · 수량은 필수예요.", "error");
      return;
    }
    const payload = {
      ...values,
      qtyKg,
      waterKg: values.waterKg === "" ? null : Number(values.waterKg),
      excludeKg: values.excludeKg === "" ? null : Number(values.excludeKg),
    };
    if (formModal.mode === "add") {
      const newLot = { ...payload, id: uid(), lastMove: null };
      await persist([newLot, ...lots]);
      showToast("새 로트를 추가했어요.", "success");
    } else {
      await persist(lots.map((l) => (l.id === payload.id ? { ...l, ...payload } : l)));
      showToast("로트 정보를 수정했어요.", "success");
    }
    setFormModal(null);
  };

  const handleDelete = async () => {
    if (deleteTarget === "bulk") {
      await persist(lots.filter((l) => !selected.has(l.id)));
      showToast(`${selected.size}건을 삭제했어요.`, "success");
      setSelected(new Set());
    } else if (deleteTarget) {
      await persist(lots.filter((l) => l.id !== deleteTarget.id));
      showToast("로트를 삭제했어요.", "success");
    }
    setDeleteTarget(null);
  };

  // lots와 moves를 동시에 바꿀 때는 반드시 한 번의 writeAll로 합쳐서 써요 — persist()와 persistMoves()를
  // 따로 연달아 부르면 두 번째 호출이 첫 번째가 바꾼 lots를 못 본 채로 옛 값을 덮어쓸 수 있어요.
  const handleMoveStage = async (lot, targetStage, outputQty) => {
    if (!canEdit) return;
    const today = new Date().toISOString().slice(0, 10);
    const inputQty = lot.qtyKg;
    const diff = outputQty - inputQty;
    const nextLots = lots.map((l) => (l.id === lot.id ? { ...l, stage: targetStage, qtyKg: outputQty, lastMove: today } : l));
    const nextMoves = [
      {
        id: `move-${Date.now()}`, date: today, code: lot.code, name: lot.name, lotNo: lot.lotNo, lotId: lot.id,
        fromStage: lot.stage, toStage: targetStage, inputQty, outputQty,
        lossQty: diff < 0 ? -diff : 0, mixQty: diff > 0 ? diff : 0,
      },
      ...moves,
    ];
    setLots(nextLots);
    setMoves(nextMoves);
    await writeAll({ lots: nextLots, moves: nextMoves, settings, master });
    showToast(`${lot.lotNo} → "${stageByKey[targetStage].label}"로 이동했어요.`, "success");
    setMoveModal(null);
  };

  // "초기화"는 지금 팀 전체가 실시간으로 보고 있는 데이터 자체를 비우는 거예요 — 되돌릴 수 없어요.
  const handleReset = async () => {
    if (!canEdit) return;
    setLots([]);
    setMoves([]);
    await writeAll({ lots: [], moves: [], settings, master });
    setSelected(new Set());
    showToast("전체 데이터를 초기화했어요.", "success");
    setResetConfirm(false);
  };

  // 공정이동 이력만 따로 비우기 — 로트(재고현황) 자체와는 별개의 기록이라, 로트를 지워도 여기 남아있던 옛 이동 기록이
  // "생산" 탭 통계에 계속 잡히는 걸 헷갈려하는 경우가 있어서 이력만 초기화할 수 있게 했어요.
  const handleClearMoves = async () => {
    await persistMoves([]);
    showToast("공정이동 이력을 모두 지웠어요.", "success");
    setClearMovesConfirm(false);
  };

  // ---------- 필터/정렬 ----------
  const years = useMemo(() => {
    const s = new Set(lots.map((l) => l.receivedDate?.slice(0, 4)).filter(Boolean));
    return Array.from(s).sort().reverse();
  }, [lots]);

  const filtered = useMemo(() => {
    const words = filters.search.trim().toLowerCase().split(/\s+/).filter(Boolean);
    let rows = lots.filter((l) => {
      if (words.length) {
        const hay = [l.code, l.name, categoryById[l.categoryId]?.label, l.vendor, l.shipLoc, l.lotNo]
          .join(" ").toLowerCase();
        if (!words.every((w) => hay.includes(w))) return false;
      }
      if (filters.dateFrom && l.receivedDate < filters.dateFrom) return false;
      if (filters.dateTo && l.receivedDate > filters.dateTo) return false;
      if (filters.year !== "all" && l.receivedDate?.slice(0, 4) !== filters.year) return false;
      if (filters.tollingOnly && !l.tolling) return false;
      if (filters.stage !== "all" && l.stage !== filters.stage) return false;
      if (filters.category !== "all" && l.categoryId !== filters.category) return false;
      return true;
    });
    rows.sort((a, b) => {
      const dir = sort.dir === "asc" ? 1 : -1;
      const av = a[sort.key], bv = b[sort.key];
      if (av == null) return 1;
      if (bv == null) return -1;
      return av > bv ? dir : av < bv ? -dir : 0;
    });
    return rows;
  }, [lots, filters, sort]);

  const resetFilters = () =>
    setFilters({ search: "", dateFrom: "", dateTo: "", year: "all", tollingOnly: false, stage: "all", category: "all" });

  const toggleSort = (key) =>
    setSort((s) => (s.key === key ? { key, dir: s.dir === "asc" ? "desc" : "asc" } : { key, dir: "asc" }));

  // ---------- 집계 (항상 전체 데이터 기준 — 표 필터와 무관한 개요) ----------
  const stageTotalsKg = useMemo(() => {
    const map = Object.fromEntries(STAGES.map((s) => [s.key, 0]));
    lots.forEach((l) => { map[l.stage] += l.qtyKg; });
    return map;
  }, [lots]);

  const bottleneckKey = useMemo(() => {
    let best = null, bestVal = -1;
    STAGES.forEach((s) => { if (stageTotalsKg[s.key] > bestVal) { bestVal = stageTotalsKg[s.key]; best = s.key; } });
    return bestVal > 0 ? best : null;
  }, [stageTotalsKg]);

  const totals = useMemo(() => {
    const totalIn = lots.reduce((sum, l) => sum + l.qtyKg, 0);
    const inProgress = lots.filter((l) => !FINAL_STAGE_KEYS.includes(l.stage)).reduce((s, l) => s + l.qtyKg, 0);
    const done = lots.filter((l) => FINAL_STAGE_KEYS.includes(l.stage)).reduce((s, l) => s + l.qtyKg, 0);
    return { totalIn, inProgress, done };
  }, [lots]);

  // ---------- CSV 내보내기 (원본의 엑셀 내보내기 자리) ----------
  const exportCsv = () => {
    const headers = ["품목코드", "품목명", "카테고리", "거래처", "출고지", "로트번호", "주차", "현재단계", "수량(Kg)", "물중량(Kg)", "제외무게(Kg)", "입고일", "최근이동", "톨링품", "이월"];
    const rows = filtered.map((l) => [
      l.code, l.name, categoryById[l.categoryId]?.label || "", l.vendor, l.shipLoc, l.lotNo, weekLabel(l.receivedDate),
      stageByKey[l.stage]?.label || "", l.qtyKg, l.waterKg ?? "", l.excludeKg ?? "", l.receivedDate, l.lastMove ?? "",
      l.tolling ? "Y" : "", l.carriedOver ? "Y" : "",
    ]);
    const csv = "﻿" + [headers, ...rows].map((r) => r.map(csvEscape).join(",")).join("\r\n");
    downloadFile(`재고현황_${new Date().toISOString().slice(0, 10)}.csv`, csv, "text/csv;charset=utf-8");
    showToast("CSV 파일로 내보냈어요.", "success");
  };


  const allVisibleSelected = filtered.length > 0 && filtered.every((l) => selected.has(l.id));
  const toggleSelectAll = () => {
    if (allVisibleSelected) setSelected(new Set());
    else setSelected(new Set(filtered.map((l) => l.id)));
  };
  const toggleSelectOne = (id) => {
    const next = new Set(selected);
    next.has(id) ? next.delete(id) : next.add(id);
    setSelected(next);
  };

  // 보기 잠금이 걸려있고 아직 안 풀렸으면, 재고 데이터는 전혀 렌더링하지 않고 PIN 입력 화면만 보여줘요.
  if (viewGateEnabled && !viewUnlocked) {
    return html`<${ViewGate} correctPin=${settings.viewPin} title=${settings.title} onUnlock=${() => setViewUnlocked(true)} />`;
  }

  return html`
    <div className="ivs-root" style=${ROOT_VARS}>
      <div className="ivs-header">
        <div>
          <div className="ivs-title-row">
            <h1 className="ivs-title">${settings.title}</h1>
            <button className="ivs-icon-btn ivs-title-edit" onClick=${() => setSettingsModalOpen(true)} title="설정 (이름 변경 · 편집 잠금)">
              <${SettingsIcon} size=${14} />
            </button>
            ${liveStatus === "connected"
              ? html`<span className="ivs-lock-chip unlocked"><${Check} size=${12} /> 실시간 연결됨</span>`
              : html`<span className="ivs-lock-chip locked"><${Loader2} size=${12} className="ivs-spin" /> ${liveStatus === "connecting" ? "연결 중…" : "재연결 중…"}</span>`}
            ${settings.editPin ? (canEdit
              ? html`<span className="ivs-lock-chip unlocked"><${Unlock} size=${12} /> 편집 가능</span>`
              : html`<span className="ivs-lock-chip locked"><${Lock} size=${12} /> 보기 전용</span>`)
              : null}
            ${saving ? html`<span className="ivs-saving"><${Loader2} size=${12} className="ivs-spin" /> 저장 중</span>` : null}
          </div>
          <p className="ivs-subtitle">${settings.subtitle}</p>
        </div>
        <div className="ivs-header-actions">
          <button className="ivs-btn" onClick=${manualRefresh} title="실시간 구독이 끊긴 것 같을 때 수동으로 최신 데이터를 다시 불러와요">
            <${RefreshCw} size=${14} /> 새로고침
          </button>
          ${canEdit ? html`
            <button className="ivs-btn" onClick=${() => setMasterModalOpen("vendors")} title="거래처 · 품목코드 등록">
              <${FileText} size=${14} /> 등록 관리
            </button>
            <button className="ivs-btn" onClick=${() => setResetConfirm(true)} title="전체 데이터 초기화 (모두에게 실시간 반영)">
              <${RotateCcw} size=${14} /> 초기화
            </button>
            <button className="ivs-btn ivs-btn-primary" onClick=${() => setFormModal({ mode: "add", values: { ...emptyForm } })}>
              <${Plus} size=${14} /> 새 로트 추가
            </button>
          ` : null}
        </div>
      </div>

      <div className="ivs-tabs">
        <button className=${`ivs-tab ${activeTab === "inventory" ? "active" : ""}`} onClick=${() => setActiveTab("inventory")}>재고현황</button>
        <button className=${`ivs-tab ${activeTab === "production" ? "active" : ""}`} onClick=${() => setActiveTab("production")}>생산</button>
        <button className=${`ivs-tab ${activeTab === "tolling" ? "active" : ""}`} onClick=${() => setActiveTab("tolling")}>톨링품재고현황</button>
        <button className=${`ivs-tab ${activeTab === "dashboard" ? "active" : ""}`} onClick=${() => setActiveTab("dashboard")}>대시보드</button>
      </div>

      ${activeTab === "inventory" ? html`
        <div className="ivs-card">
          <div className="ivs-card-label">
            공정 흐름 · 단계별 재공 수량 (톤 기준) <span className="ivs-flow-hint">· 단계를 클릭하면 아래 표가 그 단계로 필터돼요</span>
          </div>
          <div className="ivs-flow">
            ${STAGES.map((s, i) => html`
              <div className="ivs-flow-item" key=${s.key}>
                <div className="ivs-flow-node-wrap">
                  <button
                    type="button"
                    className=${`ivs-flow-node ${bottleneckKey === s.key ? "bottleneck" : ""} ${filters.stage === s.key ? "selected" : ""}`}
                    style=${{ "--stage-color": s.color }}
                    onClick=${() => setFilters((f) => ({ ...f, stage: f.stage === s.key ? "all" : s.key }))}
                    title=${`${s.label} 단계로 표 필터링`}
                  >
                    ${fmtTon(stageTotalsKg[s.key])}
                  </button>
                  ${i < STAGES.length - 1 ? html`<div className="ivs-flow-line" />` : null}
                </div>
                <div className="ivs-flow-label">${s.label}</div>
                ${bottleneckKey === s.key ? html`<div className="ivs-flow-bottleneck">병목</div>` : null}
              </div>
            `)}
          </div>
        </div>

        <div className="ivs-summary-row">
          <${SummaryCard} label="총 입고량" value=${fmtTon(totals.totalIn)} unit="톤" />
          <${SummaryCard} label="현재고 (재공 중, 최종단계 제외)" value=${fmtTon(totals.inProgress)} unit="톤" accent=${true} />
          <${SummaryCard} label="완료(출고) 합계" value=${fmtTon(totals.done)} unit="톤" />
        </div>

        <div className="ivs-filterbar">
          <div className="ivs-search">
            <${Search} size=${15} className="ivs-search-icon" />
            <input
              className="ivs-input ivs-search-input"
              placeholder="검색: 여러 단어 입력 시 모두 포함된 것만 (예: 양극스크랩 삼성)"
              value=${filters.search}
              onChange=${(e) => setFilters((f) => ({ ...f, search: e.target.value }))}
            />
          </div>
          <div className="ivs-filter-row">
            <div className="ivs-daterange">
              <input type="date" className="ivs-input" value=${filters.dateFrom}
                onChange=${(e) => setFilters((f) => ({ ...f, dateFrom: e.target.value }))} />
              <span className="ivs-tilde">~</span>
              <input type="date" className="ivs-input" value=${filters.dateTo}
                onChange=${(e) => setFilters((f) => ({ ...f, dateTo: e.target.value }))} />
            </div>
            <select className="ivs-select" value=${filters.year}
              onChange=${(e) => setFilters((f) => ({ ...f, year: e.target.value }))}>
              <option value="all">연도 전체</option>
              ${years.map((y) => html`<option key=${y} value=${y}>${y}년</option>`)}
            </select>
            <label className="ivs-checkbox-label">
              <input type="checkbox" checked=${filters.tollingOnly}
                onChange=${(e) => setFilters((f) => ({ ...f, tollingOnly: e.target.checked }))} />
              톨링품만 보기
            </label>
            <select className="ivs-select" value=${filters.stage}
              onChange=${(e) => setFilters((f) => ({ ...f, stage: e.target.value }))}>
              <option value="all">전체 단계</option>
              ${STAGES.map((s) => html`<option key=${s.key} value=${s.key}>${s.label}</option>`)}
            </select>
            <select className="ivs-select" value=${filters.category}
              onChange=${(e) => setFilters((f) => ({ ...f, category: e.target.value }))}>

                <th>거래처</th>
                <th>출고지</th>
                <th>로트번호</th>
                <th>주차</th>
                <th>현재단계</th>

                <${Th} label="입고일" sortKey="receivedDate" sort=${sort} onSort=${toggleSort} />

              ` : filtered.map((l) => {
                const cat = categoryById[l.categoryId];
                const stage = stageByKey[l.stage];
                return html`
                  <tr key=${l.id}>
                    <td>${canEdit ? html`<input type="checkbox" checked=${selected.has(l.id)} onChange=${() => toggleSelectOne(l.id)} />` : null}</td>
                    <td className="ivs-mono">${l.code}</td>
                    <td>${l.name}</td>
                    <td>${cat ? html`<span className="ivs-badge" style=${{ "--c": cat.color }}>${cat.label}</span>` : null}</td>
                    <td>${l.vendor}</td>
                    <td>${l.shipLoc}</td>
                    <td className="ivs-mono">
                      ${l.lotNo} ${l.carriedOver ? html`<span className="ivs-badge ivs-badge-warn">이월</span>` : null}
                    </td>
                    <td className="ivs-dim">${weekLabel(l.receivedDate)}</td>
                    <td><span className="ivs-badge" style=${{ "--c": stage.color }}>${stage.label}</span></td>
                    <td className="ivs-mono ivs-right">${fmtKg(l.qtyKg)}</td>
                    <td className="ivs-mono ivs-right ivs-hide-sm">${fmtKg(l.waterKg)}</td>
                    <td className="ivs-mono ivs-right ivs-hide-sm">${fmtKg(l.excludeKg)}</td>
                    <td className="ivs-mono">${l.receivedDate}</td>
                    <td className="ivs-dim ivs-hide-sm">${l.lastMove ?? "-"}</td>
                    <td className="ivs-row-menu-cell">
                      ${canEdit ? html`
                        <button className="ivs-icon-btn" onClick=${() => setOpenMenuId(openMenuId === l.id ? null : l.id)}>
                          <${MoreVertical} size=${15} />
                        </button>
                        ${openMenuId === l.id ? html`
                          <div className="ivs-menu" onMouseLeave=${() => setOpenMenuId(null)}>
                            <button onClick=${() => { setFormModal({ mode: "edit", values: { ...l, qtyKg: String(l.qtyKg), waterKg: l.waterKg ?? "", excludeKg: l.excludeKg ?? "" } }); setOpenMenuId(null); }}>
                              <${Pencil} size=${13} /> 수정
                            </button>
                            <button onClick=${() => { setMoveModal(l); setOpenMenuId(null); }}>
                              <${ArrowRightCircle} size=${13} /> 단계 이동
                            </button>
                            <button className="ivs-menu-danger" onClick=${() => { setDeleteTarget(l); setOpenMenuId(null); }}>
                              <${Trash2} size=${13} /> 삭제

                          </div>
                        ` : null}
                      ` : null}
                    </td>

                `;
              })}

        <div className="ivs-tablefoot">${filtered.length}건 표시 중 · 전체 ${lots.length}건</div>
      ` : activeTab === "production" ? html`<${ProductionTab} lots=${lots} moves=${moves} canEdit=${canEdit} onClearMoves=${() => setClearMovesConfirm(true)} />`
        : activeTab === "tolling" ? html`<${TollingTab} lots=${lots} />`
        : activeTab === "dashboard" ? html`<${DashboardTab} lots=${lots} moves=${moves} />`

      ${formModal ? html`
        <${LotFormModal}
          mode=${formModal.mode}
          initial=${formModal.values}
          master=${master}
          onCancel=${() => setFormModal(null)}
          onSave=${handleSaveForm}
          onOpenMaster=${(tab) => setMasterModalOpen(tab)}

      ${masterModalOpen ? html`

          onCancel=${() => setDeleteTarget(null)}
          onConfirm=${handleDelete}
        />
      ` : null}
      ${settingsModalOpen ? html`
        <${SettingsModal}
          settings=${settings}
          unlocked=${unlocked}
          onUnlock=${() => setUnlocked(true)}
          onSave=${(next) => { persistSettings(next); setSettingsModalOpen(false); }}
          onClose=${() => setSettingsModalOpen(false)}

      ${resetConfirm ? html`
        <${ConfirmModal}
          icon=${html`<${AlertTriangle} size=${18} />`}
          title="전체 데이터를 초기화할까요?"
          body="지금 팀 전체가 실시간으로 보고 있는 로트·공정이동 데이터가 모두 지워져요. 되돌릴 수 없어요."
          confirmLabel="초기화"
          danger=${true}
          onCancel=${() => setResetConfirm(false)}
          onConfirm=${handleReset}

      ${clearMovesConfirm ? html`
        <${ConfirmModal}
          icon=${html`<${AlertTriangle} size=${18} />`}
          title="공정이동 이력을 모두 지울까요?"
          body="재고현황의 로트 데이터는 그대로 남고, '생산' 탭 통계의 근거가 되는 이동 기록만 모두 지워져요. 되돌릴 수 없어요."
          confirmLabel="이력 삭제"
          danger=${true}
          onCancel=${() => setClearMovesConfirm(false)}
          onConfirm=${handleClearMoves}
        />
      ` : null}

      ${toast ? html`<div className=${`ivs-toast ivs-toast-${toast.type}`}>${toast.type === "success" ? html`<${Check} size=${14} />` : null}${toast.msg}</div>` : null}
    </div>
  `;
}

// 보기 잠금 화면 — 이 PIN을 맞히기 전엔 재고 데이터가 전혀 렌더링되지 않아요 (링크만 있는 사람이 내용을 못 봄).
function ViewGate({ correctPin, title, onUnlock }) {
  const [pin, setPin] = useState("");
  const [error, setError] = useState(false);
  const tryUnlock = () => {
    if (pin === correctPin) onUnlock();
    else setError(true);
  };
  return html`
    <div className="ivs-root ivs-viewgate" style=${ROOT_VARS}>
      <div className="ivs-modal ivs-modal-sm ivs-lock-screen">
        <div className="ivs-lock-icon"><${Lock} size=${22} /></div>
        <h3 className="ivs-lock-title">${title || "재고관리"}</h3>
        <p className="ivs-dim" style=${{ marginBottom: 16 }}>확인하려면 비밀번호를 입력하세요.</p>
        <input
          type="password" className="ivs-input ivs-lock-input"
          value=${pin} onChange=${(e) => { setPin(e.target.value); setError(false); }}
          placeholder="PIN" onKeyDown=${(e) => e.key === "Enter" && tryUnlock()}
          autoFocus
        />
        ${error ? html`<p className="ivs-move-diff loss" style=${{ marginTop: 8 }}>비밀번호가 맞지 않아요.</p>` : null}
        <button className="ivs-btn ivs-btn-primary ivs-lock-submit" onClick=${tryUnlock}>확인</button>
      </div>
    </div>
  `;
}

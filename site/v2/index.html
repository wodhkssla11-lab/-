// 막대(시간가동율) + 꺾은선(성능가동율)을 한 그림에 겹쳐 그려요.
function UtilTrend({ rows, target }) {
  const W = 100, H = 150, pad = 6;
  const n = rows.length;
  const bw = n > 0 ? (W - pad * 2) / n : 0;
  const y = (v) => H - (Math.max(0, Math.min(130, v || 0)) / 130) * H;
  const pts = rows.map((r, i) => (r.utilPerf == null ? null : [pad + bw * (i + 0.5), y(r.utilPerf)]));
  const segs = [];
  let cur = [];
  pts.forEach((pt) => { if (pt) cur.push(pt); else if (cur.length) { segs.push(cur); cur = []; } });
  if (cur.length) segs.push(cur);
  return html`
    <div className="ivs-trend">
      <svg viewBox=${`0 0 ${W} ${H}`} preserveAspectRatio="none" className="ivs-trend-svg">
        ${[50, 100].map((g) => html`<line key=${g} x1="0" x2=${W} y1=${y(g)} y2=${y(g)} className="ivs-trend-grid" />`)}
        <line x1="0" x2=${W} y1=${y(target)} y2=${y(target)} className="ivs-trend-target" />
        ${rows.map((r, i) => (r.utilTime == null ? null : html`
          <rect key=${r.date} x=${pad + bw * i + bw * 0.16} width=${bw * 0.68}
            y=${y(r.utilTime)} height=${Math.max(0.6, H - y(r.utilTime))}
            fill=${utilColor(r.utilTime, target)} opacity="0.85" />`))}
        ${segs.map((sg, i) => html`<polyline key=${i} className="ivs-trend-line"
          points=${sg.map(([x, yy]) => `${x},${yy}`).join(" ")} />`)}
      </svg>
      <div className="ivs-trend-x">
        ${rows.map((r, i) => html`<span key=${r.date} className=${n > 16 && i % 2 === 1 ? "hide" : ""}>${r.date.slice(8)}</span>`)}
      </div>
      <div className="ivs-legend" style=${{ marginTop: 10 }}>
        <span className="ivs-legend-row"><i className="ivs-legend-swatch" style=${{ background: "#22C55E" }}></i>시간가동율</span>
        <span className="ivs-legend-row"><i className="ivs-legend-swatch line"></i>성능가동율</span>
        <span className="ivs-legend-row"><i className="ivs-legend-swatch dash"></i>목표 ${target}%</span>
      </div>
    </div>`;
}

// ---------- 비가동 현황 ----------
function DownTab({ mes, runs, downs, canEdit, onSave, onDelete }) {
  const p = usePeriod("month");
  const today = new Date().toISOString().slice(0, 10);
  const [form, setForm] = useState(() => ({
    date: today, shift: "day", eqId: EQUIPMENT[0].id,
    major: DT_TREE[0].major, minor: DT_TREE[0].minors[0].name, detail: DT_TREE[0].minors[0].details[0],
    min: "", note: "",
  }));
  const [tab, setTab] = useState("major"); // 파레토를 어느 단계로 볼지

  const rows = useMemo(() => downs.filter((r) => r.date >= p.from && r.date <= p.to), [downs, p.from, p.to]);
  const recs = useMemo(() => recordsFor(p.from, p.to, mes, runs, downs), [p.from, p.to, mes, runs, downs]);
  const tot = useMemo(() => rollupDays(recs), [recs]);
  const totMin = rows.reduce((a, r) => a + (Number(r.min) || 0), 0);

  const byMajor = useMemo(() => groupDowns(rows, (r) => r.major), [rows]);
  const byMinor = useMemo(() => groupDowns(rows, (r) => `${r.major} · ${r.minor}`), [rows]);
  const byDetail = useMemo(() => groupDowns(rows, (r) => r.detail), [rows]);
  const byEq = useMemo(() => groupDowns(rows, (r) => r.eqId), [rows]);
  const pareto = tab === "major" ? byMajor : tab === "minor" ? byMinor : byDetail;

  // 설비 × 대분류 — 어느 설비가 어떤 이유로 서는지 한눈에
  const matrix = useMemo(() => {
    const majors = byMajor.map((m) => m.key);
    return {
      majors,
      rows: EQUIPMENT.map((e) => {
        const cells = majors.map((m) => rows.filter((r) => r.eqId === e.id && r.major === m).reduce((a, b) => a + (Number(b.min) || 0), 0));
        return { ...e, cells, total: cells.reduce((a, b) => a + b, 0) };
      }).filter((e) => e.total > 0),
      max: Math.max(1, ...EQUIPMENT.flatMap((e) => byMajor.map((m) => rows.filter((r) => r.eqId === e.id && r.major === m.key).reduce((a, b) => a + (Number(b.min) || 0), 0)))),
    };
  }, [rows, byMajor]);

  const setF = (k) => (e) => {

      const next = { ...f, [k]: v };

      if (k === "major") {
        const mi = dtMinors(v)[0];
        next.minor = mi ? mi.name : "";
        next.detail = mi && mi.details[0] ? mi.details[0] : "";
      }
      if (k === "minor") {
        const d = dtDetails(next.major, v)[0];
        next.detail = d || "";
      }
      return next;
    });
  };

  const minNum = Number(form.min);
  const canSubmit = canEdit && form.date && form.eqId && Number.isFinite(minNum) && minNum > 0;
  const submit = () => {
    if (!canSubmit) return;

        <${SummaryCard} label="최다 유형" value=${byMajor[0] ? byMajor[0].key : "-"}
          icon=${html`<${Icon} name="trending-up" size=${13} />`}
          sub=${byMajor[0] ? `${fmtMin(byMajor[0].min)} · 전체의 ${((byMajor[0].min / totMin) * 100).toFixed(0)}%` : "기록 없음"} />
        <${SummaryCard} label="최다 설비" value=${byEq[0] ? eqShort(byEq[0].key) : "-"}
          icon=${html`<${Icon} name="monitor" size=${13} />`}
          sub=${byEq[0] ? `${fmtMin(byEq[0].min)} · ${byEq[0].count}건` : "기록 없음"} />
      </div>

      ${canEdit ? html`
        <div className="ivs-card">
          <div className="ivs-card-head-row">
            <h2 className="ivs-section-title">비가동 등록</h2>
            <span className="ivs-section-hint">대분류를 고르면 그 아래 소분류·상세가 따라 바뀌어요</span>

// 파레토 — 막대는 각 항목의 시간, 접힌 선은 위에서부터 더해간 누적 비율이에요.
// "위 몇 개만 잡으면 전체의 몇 %가 해결되는지"를 보려고 씁니다.
function Pareto({ rows, total, colorOf }) {
  const max = Math.max(1, ...rows.map((r) => r.min));
  let acc = 0;
  const cum = rows.map((r) => { acc += r.min; return total > 0 ? (acc / total) * 100 : 0; });
  return html`
    <div className="ivs-pareto">
      ${rows.map((r, i) => html`
        <div className="ivs-pareto-row" key=${r.key}>
          <div className="ivs-pareto-name" title=${String(r.key)}>${eqShort(r.key) !== r.key && String(r.key).startsWith("EQ") ? eqName(r.key) : r.key}</div>
          <div className="ivs-pareto-track">
            <div className="ivs-pareto-fill" style=${{ width: `${(r.min / max) * 100}%`, background: colorOf(r.key) }}></div>
            <span className="ivs-pareto-cum" style=${{ left: `${Math.min(99, cum[i])}%` }} title=${`누적 ${cum[i].toFixed(0)}%`}></span>
          </div>
          <div className="ivs-pareto-val">
            <b>${fmtMin(r.min)}</b>
            <span className="ivs-rank-count">${r.count}건 · 누적 ${cum[i].toFixed(0)}%</span>
          </div>
        </div>`)}
    </div>`;
}

// 워딩 규칙: 서술어를 빼고 명사형으로 끝맺어요.
//   "기계가 고장나서 안 돌아갑니다" → "설비 결함으로 인한 가동 중단"
// 제목 규칙: 제목이 곧 결론(액션 타이틀). 제목만 넘겨봐도 상황이 읽혀야 해요.

// 한글 조사 — 앞말에 받침이 있으면 "이/을/은", 없으면 "가/를/는".
// 숫자·영문으로 끝나는 경우도 있어서 마지막 글자가 한글일 때만 받침을 따져요.
function josa(word, pair) {
  const [withBatchim, without] = pair;
  const t = String(word || "").trim();
  if (!t) return without;
  const ch = t.charCodeAt(t.length - 1);
  if (!(ch >= 0xAC00 && ch <= 0xD7A3)) return without;
  return (ch - 0xAC00) % 28 > 0 ? withBatchim : without;
}

function buildReport(kind, from, to, mes, runs, downs, lots, settings) {
  const isMonth = kind === "month";
  const target = Number(mes.targetUtil) || 90;
  const tr = mes.targetRates || { bm: 55, cu: 12, al: 10, cd: 5 };
  const recs = recordsFor(from, to, mes, runs, downs);
  const tot = rollupDays(recs);
  const days = dateRange(from, to).length;
  const pTo = addDaysStr(from, -1), pFrom = addDaysStr(pTo, -(days - 1));
  const prev = rollupDays(recordsFor(pFrom, pTo, mes, runs, downs));
  const dtRows = downs.filter((r) => r.date >= from && r.date <= to);
  const totMin = dtRows.reduce((a, r) => a + (Number(r.min) || 0), 0);
  const byMajor = groupDowns(dtRows, (r) => r.major);
  const byDetail = groupDowns(dtRows, (r) => r.detail);
  const byEq = groupDowns(dtRows, (r) => r.eqId);
  const weeks = groupWeeks(recs);
  const label = isMonth ? from.slice(0, 7) : `${from} ~ ${to}`;
  const org = (settings && settings.title) || "생산본부";

  const achieve = tot.achieve, utilAll = tot.utilAll, rateBm = tot.rate.bm;
  const dPt = (a, b) => (a == null || b == null ? null : a - b);
  const pp = (v) => (v == null ? "-" : `${v >= 0 ? "+" : "−"}${Math.abs(v).toFixed(1)}%p`);
  const okAch = achieve != null && achieve >= 100;
  const okUtil = utilAll != null && utilAll >= target;

  const crewRows = CREWS.map((c) => {
    const rs = runs.filter((r) => r.date >= from && r.date <= to && r.crew === c);
    const input = rs.reduce((a, r) => a + (Number(r.inputKg) || 0), 0);
    const workers = rs.reduce((a, r) => a + (Number(r.workers) || 0), 0);
    return { crew: c, input, workers, shifts: rs.length, perCap: workers > 0 ? input / workers : null };
  }).filter((r) => r.shifts > 0);

  const noPlan = tot.planKg === 0;
  const S = [];

  // ── 표지 ────────────────────────────────────────────────
  S.push({
    visual: { type: "cover",
      eyebrow: isMonth ? "MONTHLY PRODUCTION REVIEW" : "WEEKLY PRODUCTION REVIEW",
      title: `${isMonth ? "월간" : "주간"} 생산실적 보고`,
      subtitle: `${label}   ·   ${org}`,
      meta: [`투입 ${fmtTon(tot.inputKg)}톤`, `달성율 ${fmtPct(achieve)}`, `종합가동율 ${fmtPct(utilAll)}`, `작성 ${new Date().toISOString().slice(0, 10)}`] },
  });

  // ── 1. Executive Summary : 결론을 제목에 ────────────────
  const headline = noPlan
    ? `${label} 조업 계획 미수립 구간으로, 실적 평가 대상에서 제외`
    : okAch && okUtil
      ? `${label} 생산량 ${fmtTon(tot.inputKg)}톤으로 목표 ${achieve.toFixed(0)}% 달성,\n종합가동율 ${utilAll.toFixed(1)}%로 목표 수준 유지`
      : okAch
        ? `${label} 생산량 목표 ${achieve.toFixed(0)}% 달성하였으나,\n종합가동율 ${utilAll == null ? "-" : utilAll.toFixed(1)}%로 목표 ${target}% 미달`
        : `${label} 생산량 ${fmtTon(tot.inputKg)}톤으로 목표 대비 ${achieve == null ? "-" : achieve.toFixed(0)}% 수준,\n${byMajor[0] ? execTerm(byMajor[0].key) : "가동 저해 요인"}이 주요 제약`;

  const points = [];
  points.push({ label: "생산", color: okAch ? PT.green : PT.amber,
    text: noPlan ? "계획 미수립"
      : `계획 ${fmtTon(tot.planKg)}톤 대비 ${fmtTon(tot.inputKg)}톤 투입 · 달성율 ${fmtPct(achieve)} (직전 대비 ${pp(dPt(achieve, prev.achieve))})` });
  points.push({ label: "가동", color: okUtil ? PT.green : PT.amber,
    text: `시간가동율 ${fmtPct(tot.utilTime)} × 성능가동율 ${fmtPct(tot.utilPerf)} = 종합 ${fmtPct(utilAll)} · 목표 ${target}% 대비 ${pp(dPt(utilAll, target))}` });
  points.push({ label: byMajor[0] ? "제약" : "회수", color: byMajor[0] ? PT.red : PT.blue,
    text: byMajor[0]
      ? `${execTerm(byMajor[0].key)} ${fmtMin(byMajor[0].min)} 발생 · 총 정지시간의 ${((byMajor[0].min / totMin) * 100).toFixed(0)}% 점유`
      : `BM 회수율 ${fmtPct(rateBm)} · 목표 ${tr.bm}% 대비 ${pp(dPt(rateBm, tr.bm))}` });

  S.push({
    kicker: "요약", accent: okAch && okUtil ? PT.green : PT.red,
    title: headline,
    subtitle: "Executive Summary : Key Performance Indicators",
    points,
    visual: { type: "kpi", items: [
      { label: "투입량 (톤)", value: fmtTon(tot.inputKg), color: PT.text,
        delta: `계획 ${fmtTon(tot.planKg)}톤 대비 ${fmtPct(achieve)}`, deltaColor: okAch ? PT.green : PT.amber,
        deltaDir: okAch ? "up" : "down" },
      { label: "종합 가동율", value: utilAll == null ? "-" : utilAll.toFixed(1), unit: "%", color: okUtil ? PT.green : PT.red,
        delta: `목표 ${target}% 대비 ${pp(dPt(utilAll, target))}`, deltaColor: okUtil ? PT.green : PT.red,
        deltaDir: okUtil ? "up" : "down" },
      { label: "BM 회수율", value: rateBm == null ? "-" : rateBm.toFixed(1), unit: "%",
        color: rateBm != null && rateBm >= tr.bm ? PT.green : PT.amber,
        delta: `목표 ${tr.bm}% 대비 ${pp(dPt(rateBm, tr.bm))}`,
        deltaColor: rateBm != null && rateBm >= tr.bm ? PT.green : PT.amber,
        deltaDir: rateBm != null && rateBm >= tr.bm ? "up" : "down" },
      { label: "비가동 시간", value: (totMin / 60).toFixed(1), unit: "h", color: totMin > 0 ? PT.amber : PT.green,
        delta: `${dtRows.length}건 · 계획시간의 ${tot.planMin > 0 ? ((totMin / tot.planMin) * 100).toFixed(1) : "0.0"}%`,
        deltaColor: PT.dim, deltaDir: "flat" },
    ] },
  });

  // ── 2. 생산 실적 추이 (월간만) ──────────────────────────
  // 조업 계획이 있는 주만 그려요 — 계획이 아예 없는 주까지 넣으면 선이 바닥으로 떨어져서
  // "감소 추세"처럼 보이는데, 실제로는 그냥 조업일이 아닌 겁니다.
  const trendWeeks = weeks.filter((w) => w.planKg > 0);
  if (isMonth && trendWeeks.length >= 2) {
    const first = trendWeeks[0], last = trendWeeks[trendWeeks.length - 1];
    const peak = trendWeeks.reduce((a, w) => (w.inputKg > a.inputKg ? w : a), trendWeeks[0]);
    const rising = (last.inputKg || 0) >= (first.inputKg || 0);
    const anyInput = trendWeeks.some((w) => w.inputKg > 0);
    const title = !anyInput
      ? `기간 내 투입 실적 미기록,\n주차별 계획 ${fmtTon(first.planKg)} ~ ${fmtTon(last.planKg)}톤 편성`
      : last.inputKg >= peak.inputKg
        ? `주차 경과에 따라 투입량 상승,\n최종 주 ${fmtTon(last.inputKg)}톤으로 기간 내 최고 수준 도달`
        : rising
          ? `주차 경과에 따라 투입량 증가 추세,\n최고 ${peak.label} ${fmtTon(peak.inputKg)}톤 기록`
          : `주차 경과에 따라 투입량 감소,\n최종 주 ${fmtTon(last.inputKg)}톤으로 최고 대비 ${fmtTon(peak.inputKg - last.inputKg)}톤 하락`;
    S.push({
      kicker: "분석", accent: !anyInput ? PT.faint : rising ? PT.green : PT.red,
      title,
      subtitle: "Weekly Production Trend (단위: 톤)",
      visual: { type: "trend", color: !anyInput ? PT.faint : rising ? PT.green : PT.red,
        rows: trendWeeks.map((w) => ({ label: w.label, value: w.inputKg / 1000, text: (w.inputKg / 1000).toFixed(1) })) },
      banner: { kind: "insight", label: "Insight",
        text: `주 평균 ${fmtTon(tot.inputKg / Math.max(1, trendWeeks.length))}톤 투입 · 최고 ${fmtTon(peak.inputKg)}톤 / 최저 ${fmtTon(Math.min(...trendWeeks.map((w) => w.inputKg)))}톤 · 편차 ${fmtTon(peak.inputKg - Math.min(...trendWeeks.map((w) => w.inputKg)))}톤` },
    });
  }

  // ── 3. 계획 대비 달성 ───────────────────────────────────
  const perfRows = [
    { key: "계획 대비 달성율", v: achieve, t: 100 },
    { key: "시간 가동율", v: tot.utilTime, t: target },
    { key: "성능 가동율", v: tot.utilPerf, t: target },
    { key: "종합 가동율", v: utilAll, t: target },
  ];
  const worstPerf = perfRows.filter((r) => r.v != null).sort((a, b) => (a.v - a.t) - (b.v - b.t))[0];
  S.push({
    kicker: "문제", accent: worstPerf && worstPerf.v < worstPerf.t ? PT.red : PT.green,
    title: noPlan ? "조업 계획 미수립 구간으로 목표 대비 평가 미적용"
      : worstPerf && worstPerf.v < worstPerf.t
        ? `${worstPerf.key} ${worstPerf.v.toFixed(1)}%로 목표 ${worstPerf.t}% 대비 ${(worstPerf.t - worstPerf.v).toFixed(1)}%p 미달,\n${byMajor[0] ? execTerm(byMajor[0].key) : "가동 저해"}이 직접 원인`
        : "전 지표 목표 달성, 현 조업 조건 유지 필요",
    subtitle: "Target vs. Actual (단위: %)",
    visual: { type: "bars", mark: 100, markLabel: "목표 100%", axisMax: 120,
      rows: perfRows.map((r) => {
        const worst = worstPerf && r.key === worstPerf.key;
        const met = r.v != null && r.v >= r.t;
        return { label: r.key, value: r.v || 0, text: fmtPct(r.v),
          color: worst ? PT.red : met ? PT.green : PT.faint, strong: worst };
      }) },
    banner: worstPerf && worstPerf.v < worstPerf.t ? { kind: "action", label: "Action Required",
      text: byMajor[0]
        ? `${execTerm(byMajor[0].key)} ${fmtMin(byMajor[0].min)} 해소 시 시간가동율 ${((totMin > 0 && tot.planMin > 0) ? (byMajor[0].min / tot.planMin * 100).toFixed(1) : "0.0")}%p 회복 가능`
        : `계획 대비 ${fmtTon(tot.planKg - tot.inputKg)}톤 미달분 차기 기간 만회 필요` } : null,
  });

  // ── 4. 가동 저해 요인 (Pareto) ──────────────────────────
  const top2 = byMajor.slice(0, 2).reduce((a, m) => a + m.min, 0);
  S.push({
    kicker: "분석", accent: PT.red,
    title: byMajor.length === 0
      ? "기간 내 비가동 발생 없음, 안정 조업 유지"
      : `${execTerm(byMajor[0].key)}${josa(execTerm(byMajor[0].key), ["이", "가"])} 총 정지시간의 ${((byMajor[0].min / totMin) * 100).toFixed(0)}% 점유,\n상위 2개 요인 집중 관리 시 ${((top2 / totMin) * 100).toFixed(0)}% 개선 가능`,
    subtitle: "Downtime Pareto by Root Cause",
    visual: { type: "bars",
      rows: byMajor.slice(0, 6).map((m, i) => ({
        label: execTerm(m.key), value: m.min, text: `${fmtMin(m.min)} · ${m.count}건`,
        color: i === 0 ? PT.red : i === 1 ? PT.amber : PT.faint, strong: i === 0,
      })) },
    banner: byMajor.length > 0 ? { kind: "insight", label: "Insight",
      text: `최다 정지 설비 ${byEq[0] ? eqName(byEq[0].key) : "-"} ${byEq[0] ? fmtMin(byEq[0].min) : ""} · 최빈 상세원인 ${byDetail[0] ? `${byDetail[0].key} ${byDetail[0].count}건` : "-"}` } : null,
  });

  // ── 5. 회수 구조 (월간만) ───────────────────────────────
  if (isMonth) {
    const under = OUTPUT_KINDS.filter((k) => tot.rate[k.key] != null && tot.rate[k.key] < tr[k.key]);
    S.push({
      kicker: "분석", accent: under.length ? PT.amber : PT.green,
      title: tot.inputKg === 0 ? "투입 실적 없음, 회수율 산출 불가"
        : under.length === 0
          ? `전 품목 회수율 목표 달성,\n투입 ${fmtTon(tot.inputKg)}톤 대비 ${fmtTon(tot.outKg)}톤 회수 (수율 ${fmtPct(tot.yieldPct)})`
          : `${under.map((k) => k.label).join(" · ")} 회수율 목표 미달,\n총 수율 ${fmtPct(tot.yieldPct)} 수준`,
      subtitle: "Recovery Rate vs. Target (단위: %)",
      visual: { type: "bars", mark: tr.bm, markLabel: `BM 목표 ${tr.bm}%`,
        rows: OUTPUT_KINDS.map((k) => {
          const v = tot.rate[k.key];
          const met = v != null && v >= tr[k.key];
          const worst = under[0] && k.key === under[0].key;
          return { label: `${k.label} (목표 ${tr[k.key]}%)`, value: v || 0,
            text: `${fmtPct(v)} · ${fmtTon(tot.out[k.key])}톤`,
            color: worst ? PT.red : met ? PT.green : PT.faint, strong: worst };
        }) },
    });
  }

  // ── 6. 교대조별 생산성 (실적 있을 때만) ─────────────────
  if (crewRows.length > 1) {
    const sorted = [...crewRows].sort((a, b) => (b.perCap || 0) - (a.perCap || 0));
    const best = sorted[0], worst = sorted[sorted.length - 1];
    const gap = (best.perCap || 0) - (worst.perCap || 0);
    S.push({
      kicker: "분석", accent: gap > (best.perCap || 1) * 0.15 ? PT.amber : PT.green,
      title: `${best.crew}조 인당 생산성 ${Math.round(best.perCap || 0).toLocaleString("ko-KR")}kg로 최고 수준,\n최저 ${worst.crew}조 대비 편차 ${Math.round(gap).toLocaleString("ko-KR")}kg`,
      subtitle: "Productivity per Head by Shift Crew",
      visual: { type: "bars",
        rows: sorted.map((c, i) => ({
          label: `${c.crew}조 · ${c.shifts}교대`, value: c.perCap || 0,
          text: `${Math.round(c.perCap || 0).toLocaleString("ko-KR")} kg/인`,
          color: i === 0 ? PT.green : i === sorted.length - 1 ? PT.red : PT.faint,
          strong: i === 0 || i === sorted.length - 1,
        })) },
      banner: { kind: "insight", label: "Insight",
        text: `조별 편차 축소를 위한 ${worst.crew}조 대상 표준작업 재교육 및 우수사례 수평전개 필요` },
    });
  }

  // ── 7. 현안 과제 및 대응 방안 ───────────────────────────
  const issueSrc = byMajor.slice(0, 3);
  const cards = issueSrc.map((m, i) => {
    const meta = dtMeta(m.key);
    const share = totMin > 0 ? (m.min / totMin) * 100 : 0;
    const eqTop = groupDowns(dtRows.filter((r) => r.major === m.key), (r) => r.eqId)[0];
    return {
      title: execTerm(m.key), icon: meta.icon, color: meta.color,
      badge: i === 0 ? "긴급 (High Priority)" : i === 1 ? "모니터링 (Medium)" : "관리 (Low)",
      rows: [
        { k: "현상", v: `${fmtMin(m.min)} 정지 · ${m.count}건 발생 (정지시간 비중 ${share.toFixed(0)}%)` },
        { k: "원인", v: meta.cause + (eqTop ? ` · 주 발생 설비 ${eqShort(eqTop.key)}` : "") },
        { k: "대응", v: meta.action[0] },
      ],
    };
  });
  if (cards.length > 0) {
    S.push({
      kicker: "대안", accent: PT.red,
      title: `상위 ${cards.length}개 요인에 대한 대응 방안 수립,\n${cards[0].title} 우선 조치로 정지시간 ${fmtMin(byMajor[0].min * 0.4)} 절감 목표`,
      subtitle: "Key Issues & Action Plans",
      visual: { type: "issues", cards },
    });
  }

  // ── 8. 실행계획 ─────────────────────────────────────────
  const nextFrom = addDaysStr(to, 1);
  const nextTo = isMonth ? monthDateList(ymShift(from.slice(0, 7), 1)).slice(-1)[0] : addDaysStr(nextFrom, 6);
  const nextPlan = rollupDays(recordsFor(nextFrom, nextTo, mes, runs, downs));
  const planRows = issueSrc.slice(0, 3).map((m, i) => {
    const meta = dtMeta(m.key);
    return { title: meta.action[0], detail: `${execTerm(m.key)} 대응 · 목표 정지시간 ${fmtMin(m.min * 0.6)} 이내`,
      owner: i === 0 ? "설비팀" : i === 1 ? "생산팀" : "공무팀", due: i === 0 ? "즉시" : isMonth ? "차월 중" : "차주 중", color: meta.color };
  });
  planRows.push({ title: `차기 기간 계획 ${fmtTon(nextPlan.planKg)}톤 확정 및 원료 확보`,
    detail: `${nextFrom} ~ ${nextTo} · 조업 ${nextPlan.opDays}일`, owner: "생산팀", due: "착수 전", color: PT.blue });
  S.push({
    kicker: "실행계획", accent: PT.blue,
    title: `차기 기간 ${fmtTon(nextPlan.planKg)}톤 계획 대비 ${planRows.length}건 실행 과제 확정,\n즉시 착수 1건 포함`,
    subtitle: `Action Plan (${nextFrom} ~ ${nextTo})`,
    visual: { type: "plan", rows: planRows },
  });

  // ── 9. 결론 및 요청사항 ─────────────────────────────────
  S.push({
    kicker: "결론", accent: okAch && okUtil ? PT.green : PT.red,
    title: okAch && okUtil
      ? `현 조업 조건 유지 시 차기 ${fmtTon(nextPlan.planKg)}톤 달성 가능,\n추가 자원 투입 불요`
      : `${byMajor[0] ? execTerm(byMajor[0].key) : "가동 저해 요인"} 해소가 최우선 과제,\n정비 예산 및 예비품 확보 승인 요청`,
    subtitle: "Conclusion & Request to Management",
    points: [
      { label: "결론", color: okAch && okUtil ? PT.green : PT.amber,
        text: noPlan ? "평가 대상 구간 아님"
          : `${label} 달성율 ${fmtPct(achieve)} · 종합가동율 ${fmtPct(utilAll)} · 차기 목표 ${fmtTon(nextPlan.planKg)}톤` },
      { label: "요청 1", color: PT.red,
        text: byMajor[0] ? `${execTerm(byMajor[0].key)} 대응 예비품 및 정비 예산 반영` : "현 정비 주기 유지" },
      { label: "요청 2", color: PT.blue,
        text: `차기 기간 원료 ${fmtTon(nextPlan.planKg)}톤 입고 일정 사전 확정` },
    ],
    visual: { type: "kpi", items: [
      { label: "기간 달성율", value: achieve == null ? "-" : achieve.toFixed(1), unit: "%",
        color: okAch ? PT.green : PT.red, delta: label, deltaColor: PT.dim, deltaDir: "flat" },
      { label: "종합 가동율", value: utilAll == null ? "-" : utilAll.toFixed(1), unit: "%",
        color: okUtil ? PT.green : PT.red, delta: `목표 ${target}%`, deltaColor: PT.dim, deltaDir: "flat" },
      { label: "차기 계획", value: fmtTon(nextPlan.planKg), unit: "톤",
        color: PT.text, delta: `조업 ${nextPlan.opDays}일`, deltaColor: PT.dim, deltaDir: "flat" },
      { label: "실행 과제", value: String(planRows.length), unit: "건",
        color: PT.blue, delta: "즉시 착수 1건 포함", deltaColor: PT.dim, deltaDir: "flat" },
    ] },
  });

  // ── 10. 별첨 : 상세 데이터 ──────────────────────────────
  const src = isMonth ? weeks : recs.filter((r) => r.planMin > 0);
  S.push({
    kicker: "별첨", accent: PT.faint,
    title: "별첨 : 기간 상세 실적",
    subtitle: "Appendix : Detailed Records",
    visual: { type: "table",
      head: ["구분", "계획(톤)", "투입(톤)", "달성율", "비가동", "시간가동율", "성능가동율", "종합가동율"],
      colRatio: [0.22, 0.11, 0.11, 0.11, 0.12, 0.11, 0.11, 0.11],
      rows: src.slice(0, 13).map((r) => [
        isMonth ? r.label : `${r.date.slice(5)} (${r.dow})`,
        fmtTon(r.planKg), fmtTon(r.inputKg), fmtPct(r.achieve),
        r.dtMin > 0 ? fmtMin(r.dtMin) : "-", fmtPct(r.utilTime), fmtPct(r.utilPerf), fmtPct(r.utilAll),
      ]),
      note: `합계 · 조업 ${tot.opDays}일 · 계획 ${fmtTon(tot.planKg)}톤 / 투입 ${fmtTon(tot.inputKg)}톤 · 비가동 ${fmtMin(tot.dtMin)}` },
  });

  // 장수 맞추기 — 주간 5장(표지 제외), 월간 10장 이내.
  const cover = S[0];
  const rest = S.slice(1);
  let keep;
  if (isMonth) {
    keep = rest.slice(0, 9); // 표지까지 합쳐 10장
  } else {
    // 주간은 다섯 장. 여섯 단계(배경·문제·분석·대안·실행계획·결론)를 다 거치되,
    // 실행계획은 결론 장표의 요청사항으로 흡수해요.
    const pick = (k) => rest.find((x) => x.kicker === k);
    keep = [pick("요약"), pick("문제"), pick("분석"), pick("대안") || pick("실행계획"), pick("결론")].filter(Boolean);
  }
  return { label, kind, from, to, tot, prev, slides: [cover, ...keep] };
}

function ReportTab({ mes, runs, downs, lots, settings }) {
  const today = new Date().toISOString().slice(0, 10);
  const [kind, setKind] = useState("week"); // "week" | "month"
  const [anchor, setAnchor] = useState(today);
  const from = kind === "week" ? mondayOf(anchor) : `${anchor.slice(0, 7)}-01`;
  const to = kind === "week" ? addDaysStr(mondayOf(anchor), 6) : monthDateList(anchor.slice(0, 7)).slice(-1)[0];
  const rep = useMemo(() => buildReport(kind, from, to, mes, runs, downs, lots, settings),
    [kind, from, to, mes, runs, downs, lots, settings]);
  const [busy, setBusy] = useState(false);

  const download = () => {
    setBusy(true);
    try {
      const slides = rep.slides.map((s) => ({ ...s, footer: `${settings.title || "DRT"} · ${rep.label}` }));
      downloadPptx(`${kind === "week" ? "주간" : "월간"}생산보고_${rep.label.replace(/[ ~]/g, "")}.pptx`, slides);
    } finally { setBusy(false); }
  };

  const stages = ["배경", "문제", "분석", "대안", "실행계획", "결론"];
  const covered = { 요약: "배경", 문제: "문제", 분석: "분석", 대안: "대안", 실행계획: "실행계획", 결론: "결론", 별첨: null };

  return html`
    <div>
      <div className="ivs-periodbar">
        <div className="ivs-seg">
          ${[["week", "주간 (5장)"], ["month", "월간 (10장 이내)"]].map(([k, t]) => html`
            <button key=${k} className=${`ivs-seg-btn ${kind === k ? "on" : ""}`} onClick=${() => setKind(k)}>${t}</button>`)}
        </div>
        <input className="ivs-input" type=${kind === "month" ? "month" : "date"}
          value=${kind === "month" ? anchor.slice(0, 7) : anchor}
          onChange=${(e) => setAnchor(kind === "month" ? `${e.target.value}-01` : e.target.value)} />
        <span className="ivs-section-hint">${rep.label} · 표지 포함 ${rep.slides.length}장</span>
        <span className="ivs-spacer"></span>
        <button className="ivs-btn ivs-btn-primary" onClick=${download} disabled=${busy}>
          <${Icon} name="download" size=${14} /> ${busy ? "만드는 중…" : "PPT 내려받기"}
        </button>
        <button className="ivs-btn" onClick=${() => window.print()}>
          <${Icon} name="printer" size=${14} /> 인쇄
        </button>
      </div>

      <div className="ivs-card ivs-print-hide" style=${{ paddingTop: 14, paddingBottom: 14 }}>
        <div className="ivs-flowline">
          ${stages.map((k, i) => html`
            <${Fragment} key=${k}>
              ${i > 0 ? html`<span className="ivs-flowline-arrow">→</span>` : null}
              <span className=${`ivs-flowline-step ${rep.slides.some((s) => covered[s.kicker] === k) ? "on" : ""}`}>${k}</span>
            <//>`)}
          <span className="ivs-spacer"></span>
          <span className="ivs-section-hint">
            제목이 곧 결론입니다 — 제목만 넘겨봐도 상황이 읽히도록 액션 타이틀로 씁니다
          </span>
        </div>
      </div>

      <div className="ivs-slides">
        ${rep.slides.map((s, i) => html`<${SlidePreview} key=${i} s=${s} no=${i + 1} total=${rep.slides.length} />`)}
      </div>
    </div>`;
}

// 화면 미리보기 — 내려받는 .pptx와 같은 설명서(visual)로 그려요.
function SlidePreview({ s, no, total }) {
  const v = s.visual || {};
  if (v.type === "cover") {
    return html`
      <div className="ivs-slide cover">
        <div className="ivs-slide-eyebrow">${v.eyebrow}</div>
        <div className="ivs-slide-covertitle">${v.title}</div>
        <div className="ivs-slide-coverrule"></div>
        <div className="ivs-slide-coversub">${v.subtitle}</div>
        <div className="ivs-slide-covermeta">${(v.meta || []).join("   ·   ")}</div>
      </div>`;
  }
  return html`
    <div className="ivs-slide" style=${{ "--accent": `#${String(s.accent || "10B981").replace("#", "")}` }}>
      <div className="ivs-slide-head">
        <span className="ivs-slide-kicker">${s.kicker}</span>
        <span className="ivs-slide-no">${no} / ${total}</span>
      </div>
      <div className="ivs-slide-title">${String(s.title).split("\n").map((t, i) => html`<div key=${i}>${t}</div>`)}</div>
      ${s.subtitle ? html`<div className="ivs-slide-sub">${s.subtitle}</div>` : null}
      <div className="ivs-slide-body">
        <${SlideVisual} v=${v} />
        ${s.points && s.points.length ? html`
          <div className="ivs-slide-points">
            ${s.points.map((p, i) => html`
              <div className="ivs-slide-point" key=${i}>
                <span className="ivs-slide-pn" style=${{ background: `#${String(p.color || "3B82F6").replace("#", "")}` }}>${i + 1}</span>
                <b style=${{ color: `#${String(p.color || "3B82F6").replace("#", "")}` }}>${p.label}</b>
                <span>${p.text}</span>
              </div>`)}
          </div>` : null}
        ${s.banner ? html`
          <div className=${`ivs-slide-banner ${s.banner.kind}`}>
            <b>${s.banner.label}</b> ${s.banner.text}
          </div>` : null}
      </div>
    </div>`;
}

function SlideVisual({ v }) {
  if (!v) return null;
  const hx2 = (c) => `#${String(c || "").replace("#", "")}`;
  if (v.type === "kpi") {
    return html`<div className="ivs-slide-kpis">
      ${v.items.map((k, i) => html`<div className="ivs-slide-kpi" key=${i}>
        <div className="ivs-slide-kpi-l">${k.label}</div>
        <div className="ivs-slide-kpi-v" style=${{ color: hx2(k.color) }}>${k.value}<em>${k.unit || ""}</em></div>
        ${k.delta ? html`<div className="ivs-slide-kpi-d" style=${{ color: hx2(k.deltaColor) }}>
          ${k.deltaDir === "up" ? "▲" : k.deltaDir === "down" ? "▼" : "●"} ${k.delta}
        </div>` : null}
      </div>`)}
    </div>`;
  }
  if (v.type === "bars") {
    const max = Math.max(1, ...v.rows.map((r) => Math.abs(Number(r.value) || 0)), v.axisMax || 0);
    return html`<div className="ivs-slide-bars">
      ${v.rows.map((r, i) => html`<div className=${`ivs-slide-bar ${r.strong ? "strong" : ""}`} key=${i}>
        <span className="ivs-slide-bar-l" style=${r.strong ? { color: hx2(r.color) } : null}>${r.label}</span>
        <span className="ivs-slide-bar-t">
          <i style=${{ width: `${Math.max(2, (Math.abs(r.value) / max) * 100)}%`, background: hx2(r.color) }}></i>
          ${v.mark ? html`<u style=${{ left: `${(v.mark / max) * 100}%` }}></u>` : null}
        </span>
        <span className="ivs-slide-bar-v" style=${r.strong ? { color: hx2(r.color) } : null}>${r.text}</span>
      </div>`)}
    </div>`;
  }
  if (v.type === "trend") {
    const rows = v.rows || [];
    const vals = rows.map((r) => Number(r.value) || 0);
    const lo = Math.min(...vals), hi = Math.max(...vals), span = Math.max(1e-6, hi - lo), pad = span * 0.28;
    const y = (val) => 100 - ((val - (lo - pad)) / (span + pad * 2)) * 100;
    const pts = rows.map((r, i) => [rows.length === 1 ? 50 : (100 * i) / (rows.length - 1), y(Number(r.value) || 0)]);
    return html`<div className="ivs-slide-trend">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" className="ivs-slide-trend-svg">
        <polygon points=${`0,100 ${pts.map(([a, b]) => `${a},${b}`).join(" ")} 100,100`} fill=${hx2(v.color)} opacity="0.16" />
        <polyline points=${pts.map(([a, b]) => `${a},${b}`).join(" ")} fill="none" stroke=${hx2(v.color)} strokeWidth="2" vectorEffect="non-scaling-stroke" />
      </svg>
      <div className="ivs-slide-trend-x">
        ${rows.map((r, i) => html`<span key=${i}><b>${r.text}</b>${r.label}</span>`)}
      </div>
    </div>`;
  }
  if (v.type === "issues") {
    return html`<div className="ivs-slide-issues">
      ${v.cards.map((c, i) => html`<div className="ivs-slide-issue" key=${i} style=${{ "--c": hx2(c.color) }}>
        <div className="ivs-slide-issue-h">
          <span className="ivs-slide-issue-ico"></span>
          <b>${c.title}</b>
        </div>
        <span className="ivs-slide-issue-badge">${c.badge}</span>
        ${c.rows.map((r, j) => html`<div className="ivs-slide-issue-r" key=${j}><b>${r.k}</b> ${r.v}</div>`)}
      </div>`)}
    </div>`;
  }
  if (v.type === "plan") {
    return html`<div className="ivs-slide-plan">
      ${v.rows.map((r, i) => html`<div className="ivs-slide-planrow" key=${i} style=${{ "--c": hx2(r.color) }}>
        <span className="ivs-slide-plandot"></span>
        <div className="ivs-slide-plantxt"><b>${r.title}</b><span>${r.detail || ""}</span></div>
        <span className="ivs-slide-planowner">${r.owner}</span>
        <span className="ivs-slide-plandue">${r.due}</span>
      </div>`)}
    </div>`;
  }
  if (v.type === "table") {
    return html`<div>
      <div className="ivs-table-wrap"><table className="ivs-table ivs-slide-table">
        <thead><tr>${v.head.map((h, i) => html`<th key=${i} className=${i > 0 ? "ivs-right" : ""}>${h}</th>`)}</tr></thead>
        <tbody>${v.rows.map((r, i) => html`<tr key=${i}>
          ${r.map((c, j) => html`<td key=${j} className=${j > 0 ? "ivs-right" : ""}>${c}</td>`)}
        </tr>`)}</tbody>
      </table></div>
      ${v.note ? html`<div className="ivs-section-hint" style=${{ marginTop: 10 }}>${v.note}</div>` : null}
    </div>`;
  }
  return null;
}

// ---------- 생산실적 ----------
// ---------- 출하 처리 ----------
// 생산에서 만들어진 Lot은 "출하대기"에 쌓여요. 여기서 하는 일은 셋뿐이에요.
//   1) 나갈 Lot을 고른다 (QR 리더기로 찍어서 골라도 되고, 목록에서 체크해도 돼요)
//   2) QR 라벨을 뽑아서 톤백에 붙인다
//   3) 출하일자를 넣고 "출하완료"로 넘긴다  → 재고에서 빠지고 출하 이력에 남아요
function ShipTab({ lots, moves, canEdit, onShip, onLabel }) {
  const today = new Date().toISOString().slice(0, 10);
  const [picked, setPicked] = useState(() => new Set());
  const [shipDate, setShipDate] = useState(today);
  const [q, setQ] = useState("");
  const [buf, setBuf] = useState("");
  const [flash, setFlash] = useState(null);
  const [ym, setYm] = useState(today.slice(0, 7));
  const scanRef = useRef(null);

  const waiting = useMemo(
    () => lots.filter((l) => l.stage === "usable")
      .sort((a, b) => String(b.lastMove || b.receivedDate).localeCompare(String(a.lastMove || a.receivedDate))),
    [lots]
  );
  const shipped = useMemo(() => lots.filter((l) => l.stage === "shipped"), [lots]);

  const shown = useMemo(() => {
    const w = q.trim().toLowerCase();
    if (!w) return waiting;
    return waiting.filter((l) => [l.lotNo, l.code, l.name, l.vendor, l.shipLoc].some((v) => String(v || "").toLowerCase().includes(w)));
  }, [waiting, q]);

  // 출하일 기준으로 얼마나 나갔는지 — 출하일이 없는 옛 데이터는 마지막 이동일로 봐요.
  const shipDayOf = (l) => l.shippedDate || l.lastMove || l.receivedDate;
  const monthShipped = shipped.filter((l) => String(shipDayOf(l)).slice(0, 7) === ym);
  const todayShipped = shipped.filter((l) => shipDayOf(l) === today);

  const waitKg = sumBy(waiting, "qtyKg");
  const pickedLots = waiting.filter((l) => picked.has(l.id));
  const pickedKg = sumBy(pickedLots, "qtyKg");

  // 며칠째 출하를 기다리고 있는지 — 오래 묵은 Lot이 있으면 먼저 내보내야죠.
  const ageOf = (l) => Math.max(0, Math.round((new Date(`${today}T00:00:00`) - new Date(`${(l.lastMove || l.receivedDate)}T00:00:00`)) / 86400000));
  const oldest = waiting.reduce((m, l) => Math.max(m, ageOf(l)), 0);

  const toggle = (id) => setPicked((prev) => {
    const n = new Set(prev);
    n.has(id) ? n.delete(id) : n.add(id);
    return n;
  });
  const allShownPicked = shown.length > 0 && shown.every((l) => picked.has(l.id));

  const scan = (text) => {
    const raw = String(text || "").trim();
    if (!raw) return;
    const m = SCAN_RE.exec(raw);
    const lotNo = m ? m[1].trim() : raw.split(/[\t,;]/)[0].trim();
    const hit = waiting.find((l) => l.lotNo === lotNo);
    if (!hit) {
      const elsewhere = lots.find((l) => l.lotNo === lotNo);
      setFlash({ ok: false, text: elsewhere ? `${lotNo} — 지금 "${getStage(elsewhere.stage).label}" 상태예요` : `${lotNo} — 못 찾았어요` });
      return;
    }
    if (picked.has(hit.id)) { setFlash({ ok: false, text: `${lotNo} — 이미 골랐어요` }); return; }
    setPicked((prev) => new Set(prev).add(hit.id));
    setFlash({ ok: true, text: `${lotNo} · ${fmtKg(hit.qtyKg)} 담았어요` });
  };

  const doShip = () => {
    if (!canEdit || pickedLots.length === 0) return;
    onShip(pickedLots.map((l) => l.id), shipDate);
    setPicked(new Set());
    setFlash(null);
  };

  const monthOptions = useMemo(() => {
    const set = new Set(shipped.map((l) => String(shipDayOf(l)).slice(0, 7)).filter(Boolean));
    set.add(today.slice(0, 7));
    return Array.from(set).sort().reverse();
  }, [shipped]);

  return html`
    <div>
      <div className="ivs-kpis">
        <${SummaryCard} label="출하대기" value=${fmtTon(waitKg)} unit="톤" accent=${true}
          icon=${html`<${Icon} name="package" size=${13} />`}
          sub=${`${waiting.length} lot · 가장 오래된 건 ${oldest}일째`} />
        <${SummaryCard} label="고른 Lot" value=${fmtTon(pickedKg)} unit="톤" icon=${html`<${Icon} name="check" size=${13} />`}
          sub=${pickedLots.length > 0 ? `${pickedLots.length} lot — 아래에서 출하 처리하세요` : "아직 고른 게 없어요"} />
        <${SummaryCard} label=${`${ym} 출하완료`} value=${fmtTon(sumBy(monthShipped, "qtyKg"))} unit="톤" icon=${html`<${Icon} name="arrow-right-circle" size=${13} />`}
          sub=${`${monthShipped.length} lot`} />
        <${SummaryCard} label="오늘 출하" value=${fmtTon(sumBy(todayShipped, "qtyKg"))} unit="톤" icon=${html`<${Icon} name="calendar" size=${13} />`}
          sub=${`${todayShipped.length} lot · ${today}`} />
      </div>

      <div className="ivs-card">
        <div className="ivs-card-head-row">
          <h2 className="ivs-section-title">출하대기 Lot</h2>
          <span className="ivs-section-hint">QR을 찍거나 체크해서 고른 뒤, 라벨을 뽑고 출하일자를 넣으면 끝이에요</span>
        </div>

        <div className="ivs-scanbox">
          <div className="ivs-scanbox-label"><${Icon} name="qr-code" size=${15} /> 톤백 라벨을 찍으면 그 Lot이 아래에서 자동으로 선택돼요</div>
          <input
            ref=${scanRef}
            className="ivs-scaninput"
            value=${buf}
            placeholder="여기를 클릭한 뒤 QR을 찍거나, 생산 Lot 번호를 입력하고 Enter"
            onChange=${(e) => setBuf(e.target.value)}
            onKeyDown=${(e) => { if (e.key === "Enter") { e.preventDefault(); const v = buf.trim(); setBuf(""); scan(v); } }}
          />
          ${flash ? html`<div className=${`ivs-scanflash ${flash.ok ? "ok" : "bad"}`}>
            <${Icon} name=${flash.ok ? "check" : "alert-triangle"} size=${14} /> ${flash.text}
          </div>` : html`<div className="ivs-scanflash muted">찍은 Lot이 여기에 표시돼요</div>`}
        </div>

        <div className="ivs-shipbar">
          <div className="ivs-shipbar-left">
            <span className=${`ivs-chip ${pickedLots.length ? "accent" : "neutral"}`}>${pickedLots.length}건 · ${pickedKg.toLocaleString("ko-KR", { maximumFractionDigits: 1 })} Kg</span>
            <button className="ivs-btn ivs-btn-sm" disabled=${shown.length === 0}
              onClick=${() => setPicked(allShownPicked ? new Set() : new Set(shown.map((l) => l.id)))}>
              ${allShownPicked ? "선택 해제" : `${shown.length}건 모두 선택`}
            </button>
            <button className="ivs-btn ivs-btn-sm" disabled=${pickedLots.length === 0} onClick=${() => onLabel(pickedLots)}>
              <${Icon} name="qr-code" size=${13} /> QR 라벨 출력
            </button>
          </div>
          <div className="ivs-shipbar-right">
            <label className="ivs-field ivs-ship-date"><span>출하일자</span>
              <input type="date" value=${shipDate} onChange=${(e) => setShipDate(e.target.value)} />
            </label>
            <button className="ivs-btn ivs-btn-primary" disabled=${!canEdit || pickedLots.length === 0 || !shipDate} onClick=${doShip}>
              <${Icon} name="arrow-right-circle" size=${14} /> 출하완료 처리
            </button>
          </div>
        </div>

        <div className="ivs-filter-row" style=${{ marginBottom: 10 }}>
          <div className="ivs-search">
            <${Icon} name="search" size=${14} />
            <input className="ivs-input" value=${q} onChange=${(e) => setQ(e.target.value)} placeholder="Lot · 품목 · 거래처로 찾기" />
          </div>
        </div>

        <div className="ivs-table-wrap">
          <table className="ivs-table">
            <thead><tr>
              <th className="ivs-th-check"></th>
              <th>생산 Lot</th><th>품목</th><th>거래처</th>
              <th className="ivs-right">수량(Kg)</th><th>출하대기 된 날</th><th className="ivs-right">대기일수</th>
            </tr></thead>
            <tbody>
              ${shown.length === 0
                ? html`<tr><td colSpan=${7} className="ivs-prod-empty center">출하대기 중인 Lot이 없어요.</td></tr>`
                : shown.map((l) => {
                    const age = ageOf(l);
                    return html`<tr key=${l.id} className=${picked.has(l.id) ? "ivs-row-on" : ""}>
                      <td className="ivs-th-check"><input type="checkbox" checked=${picked.has(l.id)} onChange=${() => toggle(l.id)} /></td>
                      <td className="ivs-mono">${l.lotNo}</td>
                      <td>${l.code} · ${l.name}</td>
                      <td className="ivs-dim">${l.vendor || "-"}</td>
                      <td className="ivs-mono ivs-right">${Number(l.qtyKg).toLocaleString("ko-KR", { maximumFractionDigits: 1 })}</td>
                      <td className="ivs-mono ivs-dim">${l.lastMove || l.receivedDate}</td>
                      <td className="ivs-right"><span className=${`ivs-chip ${age >= 30 ? "bad" : age >= 14 ? "accent" : "neutral"}`}>${age}일</span></td>
                    </tr>`;
                  })}
            </tbody>
          </table>
        </div>
      </div>

      <div className="ivs-card">
        <div className="ivs-card-head-row">
          <h2 className="ivs-section-title">출하 이력</h2>
          <div className="ivs-card-head-actions">
            <select className="ivs-select" value=${ym} onChange=${(e) => setYm(e.target.value)}>
              ${monthOptions.map((m) => html`<option key=${m} value=${m}>${m}</option>`)}
            </select>
            <button className="ivs-btn ivs-btn-sm" disabled=${monthShipped.length === 0} onClick=${() => {
              const rows = [["출하일자", "생산 Lot", "품목코드", "품목명", "거래처", "출고지", "수량(Kg)"]];
              [...monthShipped].sort((a, b) => String(shipDayOf(a)).localeCompare(String(shipDayOf(b))))
                .forEach((l) => rows.push([shipDayOf(l), l.lotNo, l.code, l.name, l.vendor || "", l.shipLoc || "", Number(l.qtyKg) || 0]));
              rows.push(["합계", "", "", "", "", "", sumBy(monthShipped, "qtyKg")]);
              downloadXlsx(`출하이력_${ym}.xlsx`, "출하이력", rows, [13, 18, 12, 18, 18, 14, 12]);
            }}>
              <${Icon} name="download" size=${13} /> 엑셀 내려받기
            </button>
          </div>
        </div>
        <div className="ivs-table-wrap">
          <table className="ivs-table">
            <thead><tr>
              <th>출하일자</th><th>생산 Lot</th><th>품목</th><th>거래처</th><th className="ivs-right">수량(Kg)</th>
            </tr></thead>
            <tbody>
              ${monthShipped.length === 0
                ? html`<tr><td colSpan=${5} className="ivs-prod-empty center">${ym}에 출하한 기록이 없어요.</td></tr>`
                : [...monthShipped].sort((a, b) => String(shipDayOf(b)).localeCompare(String(shipDayOf(a)))).map((l) => html`
                    <tr key=${l.id}>
                      <td className="ivs-mono">${shipDayOf(l)}</td>
                      <td className="ivs-mono">${l.lotNo}</td>
                      <td>${l.code} · ${l.name}</td>
                      <td className="ivs-dim">${l.vendor || "-"}</td>
                      <td className="ivs-mono ivs-right">${Number(l.qtyKg).toLocaleString("ko-KR", { maximumFractionDigits: 1 })}</td>
                    </tr>`)}
            </tbody>
            ${monthShipped.length > 0 ? html`<tfoot><tr className="ivs-tablefoot">
              <td colSpan=${4}>${ym} 합계 · ${monthShipped.length} lot</td>
              <td className="ivs-mono ivs-right">${sumBy(monthShipped, "qtyKg").toLocaleString("ko-KR", { maximumFractionDigits: 1 })}</td>
            </tr></tfoot>` : null}
          </table>
        </div>
      </div>
    </div>`;
}

function ActualTab({ lots, runs, mes, canEdit, onSave, onDelete, ym, onYm }) {
  const today = new Date().toISOString().slice(0, 10);
  const setYm = onYm; // 화면 제목("9월 생산실적")과 같은 달을 봐야 해서 위에서 내려받아요
  const [form, setForm] = useState(() => ({
    date: today, shift: "day", workers: "", note: "",
    inputIds: [], outputs: { bm: "", cu: "", al: "", cd: "" },
  }));
  const [pickOpen, setPickOpen] = useState(false);
  const [trace, setTrace] = useState(null); // Lot 추적으로 펼쳐본 실적
  const [delTarget, setDelTarget] = useState(null);

  // 그 날 그 교대의 담당 조는 패턴에서 자동으로 정해져요.
  const crew = shiftCrews(form.date, mes.shiftAnchor)[form.shift];
  // 투입할 수 있는 로트 = 아직 소진·출하되지 않은 것
  const pickable = useMemo(
    () => lots.filter((l) => !FINAL_STAGE_KEYS.includes(l.stage)).sort((a, b) => (a.receivedDate < b.receivedDate ? 1 : -1)),
    [lots]);
  const chosen = useMemo(() => lots.filter((l) => form.inputIds.includes(l.id)), [lots, form.inputIds]);
  const inputKg = chosen.reduce((a, l) => a + (Number(l.qtyKg) || 0), 0);
  const outSum = OUTPUT_KINDS.reduce((a, k) => a + (Number(form.outputs[k.key]) || 0), 0);

  const monthRuns = useMemo(() => runs.filter((r) => r.date.slice(0, 7) === ym), [runs, ym]);
  const months = useMemo(() => {
    const set = new Set(runs.map((r) => r.date.slice(0, 7)));
    set.add(today.slice(0, 7));
    return Array.from(set).sort().reverse();
  }, [runs, today]);

  // 일자별로 계획과 견줘서 달성율·회수율을 뽑아요.
  const daily = useMemo(() => {
    const map = new Map();
    monthRuns.forEach((r) => {
      if (!map.has(r.date)) map.set(r.date, { date: r.date, inputKg: 0, workers: 0, shifts: 0, out: { bm: 0, cu: 0, al: 0, cd: 0 } });
      const d = map.get(r.date);
      d.inputKg += r.inputKg || 0;
      d.workers += Number(r.workers) || 0;
      d.shifts += 1;
      (r.outputs || []).forEach((o) => { d.out[o.kind] = (d.out[o.kind] || 0) + (Number(o.qtyKg) || 0); });
    });
    return Array.from(map.values()).sort((a, b) => (a.date < b.date ? -1 : 1)).map((d) => {
      const plan = planForDay(mes, d.date).totalKg;
      return { ...d, planKg: plan, achieve: plan > 0 ? (d.inputKg / plan) * 100 : null,
        perCap: d.workers > 0 ? d.inputKg / d.workers : null };
    });
  }, [monthRuns, mes]);

  const tot = useMemo(() => {
    const a = { inputKg: 0, planKg: 0, workers: 0, out: { bm: 0, cu: 0, al: 0, cd: 0 } };
    daily.forEach((d) => {
      a.inputKg += d.inputKg; a.planKg += d.planKg; a.workers += d.workers;
      OUTPUT_KINDS.forEach((k) => { a.out[k.key] += d.out[k.key] || 0; });
    });
    a.achieve = a.planKg > 0 ? (a.inputKg / a.planKg) * 100 : null;
    a.perCap = a.workers > 0 ? a.inputKg / a.workers : null;
    return a;
  }, [daily]);

  // 조별 인당 생산성 (증감은 그 달 평균 대비)
  const byCrew = useMemo(() => {
    const m = new Map(CREWS.map((c) => [c, { crew: c, inputKg: 0, workers: 0, shifts: 0 }]));
    monthRuns.forEach((r) => {
      const o = m.get(r.crew); if (!o) return;
      o.inputKg += r.inputKg || 0; o.workers += Number(r.workers) || 0; o.shifts += 1;
    });
    const rows = Array.from(m.values()).map((o) => ({ ...o, perCap: o.workers > 0 ? o.inputKg / o.workers : null }));
    const avg = tot.perCap;
    return rows.map((r) => ({ ...r, delta: r.perCap != null && avg ? r.perCap - avg : null }));
  }, [monthRuns, tot]);

  const rate = (v) => (tot.inputKg > 0 ? (v / tot.inputKg) * 100 : null);

// ---------- 생산계획 ----------
// ---------- 생산계획 집계 ----------
// 계획 기간(첫 단계 시작 ~ 마지막 단계 종료) 전체를 하루씩 펼쳐서, 월별·주별로 다시 묶어요.
function planHorizon(mes) {
  const ps = (mes.phases || []).filter((p) => p.start && p.end);
  if (ps.length === 0) return null;
  const from = ps.reduce((a, p) => (p.start < a ? p.start : a), ps[0].start);
  const to = ps.reduce((a, p) => (p.end > a ? p.end : a), ps[0].end);
  return { from, to };
}
function planDays(mes) {
  const h = planHorizon(mes);
  if (!h) return [];
  return dateRange(h.from, h.to).map((d) => planForDay(mes, d));
}
// 단계별 집계 — 로드맵 표에 그대로 들어가요.
function planByPhase(mes, days) {
  return (mes.phases || []).map((p) => {
    const ds = days.filter((d) => d.phase && d.phase.id === p.id);
    const kg = ds.reduce((a, d) => a + d.totalKg, 0);
    const op = ds.filter((d) => !d.isStop).length;
    return { ...p, days: ds.length, opDays: op, kg, avg: op > 0 ? kg / op : 0, color: phaseColor(mes, p) };
  });
}
function planByMonth(mes, days) {
  const m = new Map();
  days.forEach((d) => {
    const k = d.date.slice(0, 7);
    if (!m.has(k)) m.set(k, { key: k, kg: 0, opDays: 0, days: 0, phases: new Set() });
    const o = m.get(k);
    o.kg += d.totalKg; o.days += 1;
    if (!d.isStop) { o.opDays += 1; if (d.phaseName) o.phases.add(d.phaseName); }
  });
  return Array.from(m.values()).map((o) => ({
    ...o, phaseNames: Array.from(o.phases), avg: o.opDays > 0 ? o.kg / o.opDays : 0, bm: bmOf(mes, o.kg),
  }));
}
// 주별 — 월요일부터 묶되 월이 바뀌면 거기서 잘라요 (월별 합계와 어긋나지 않게).
// 그렇게 자르고 나면 월 첫 조각이 며칠 안 되는 경우가 생기는데, 3일 이하이면 다음 주에 붙여요.
function planByWeek(mes, days) {
  const groups = [];
  days.forEach((d) => {
    const key = `${d.date.slice(0, 7)}|${mondayOf(d.date)}`;
    const last = groups[groups.length - 1];
    if (last && last.key === key) last.rows.push(d);
    else groups.push({ key, ym: d.date.slice(0, 7), rows: [d] });
  });
  // 월 첫 조각이 3일 이하이면 바로 다음 조각에 합쳐요
  for (let i = 0; i < groups.length - 1; i++) {
    const g = groups[i], n = groups[i + 1];
    const isMonthHead = i === 0 || groups[i - 1].ym !== g.ym;
    if (isMonthHead && g.ym === n.ym && g.rows.length <= 3) {
      n.rows = g.rows.concat(n.rows);
      groups.splice(i, 1);
      i--;
    }
  }
  const capShifts = Number(mes.maxShiftsPerWeek) || 5;
  const hoursPerShift1 = Number(mes.personHours) || 10.25;
  const crewSize = Number(mes.crewSize) || 3;
  return groups.map((g) => {
    const kg = g.rows.reduce((a, d) => a + d.totalKg, 0);
    const op = g.rows.filter((d) => !d.isStop).length;
    const names = Array.from(new Set(g.rows.filter((d) => d.phaseName).map((d) => d.phaseName)));
    const first = g.rows[0], lastD = g.rows[g.rows.length - 1];
    const notes = Array.from(new Set(g.rows.filter((d) => d.isStop && d.holiday).map((d) => d.holiday.name)));
    const wtl = Array.from(new Set(g.rows.filter((d) => !d.isStop).map((d) => d.workTypeLabel)));
    const staff = Math.max(0, ...g.rows.map((d) => d.staff || 0));
    return {
      key: g.key, ym: g.ym, rows: g.rows,
      // 주차 이름은 그 묶음에서 가장 많은 날이 속한 주로 붙여요 — 월 첫 조각을 다음 주에 합쳤을 때
      // 첫날 기준으로 이름을 붙이면 주차가 하나 건너뛴 것처럼 보이거든요.
      week: (() => {
        const c = new Map();
        g.rows.forEach((d) => { const k = isoWeekKey(d.date); c.set(k, (c.get(k) || 0) + 1); });
        return Array.from(c.entries()).sort((a, b) => b[1] - a[1])[0][0].slice(5);
      })(),
      from: first.date, to: lastD.date,
      label: `${first.date.slice(5).replace("-", "/")}-${lastD.date.slice(5).replace("-", "/")}`,
      kg, opDays: op, phaseNames: names, phaseName: names.join(" · "),
      workLabel: wtl.join(" · ") || "-", staff, note: notes.join(", "),
      color: phaseColor(mes, (g.rows.find((d) => !d.isStop) || g.rows[0]).phase),
      // 그 주에 채워야 하는 "연인원 교대수" — 교대당 정원 × 하루 교대수 × 조업일
      manShifts: g.rows.reduce((a, d) => a + (d.isStop ? 0 : d.shiftsPerDay * crewSize), 0),
    };
  }).map((w) => {
    // 1인이 그 주에 몇 번 들어가는지.
    // 3개조로 도는 구간은 실제 12일 순환표를 세어요 — 순환 때문에 어떤 주는 5교대(51.25h),
    // 어떤 주는 4교대(41h)가 나오거든요. 평균만 보면 52시간을 넘는 주를 놓칩니다.
    const rows = w.rows || [];
    const three = rows.some((d) => !d.isStop && Number(d.phase && d.phase.crews) === 3);
    let per;
    if (three) {
      // 주52시간은 어떤 7일을 잘라 봐도 넘으면 안 되는 규칙이라, 표시용 묶음이 8일이 되더라도
      // 7일짜리 창을 밀어가며 그 중 가장 빡센 창으로 판정해요.
      const win = Math.min(7, rows.length);
      let worst = 0;
      for (let st = 0; st + win <= rows.length; st++) {
        const cnt = { A: 0, B: 0, C: 0 };
        rows.slice(st, st + win).forEach((d) => {
          if (d.isStop) return;
          if (d.dayCrew) cnt[d.dayCrew] += 1;
          if (d.nightCrew) cnt[d.nightCrew] += 1;
        });
        worst = Math.max(worst, cnt.A, cnt.B, cnt.C);
      }
      per = worst;
    } else {
      per = w.staff > 0 ? Math.min(capShifts, w.manShifts / w.staff) : 0;
    }
    return { ...w, shiftsPerPerson: per, personHours: per * hoursPerShift1, byRotation: three };
  });
}
// 인원 충원 — 시점마다 누계를 쌓아요.
function hiringPlan(mes) {
  const rows = [...(mes.hiring || [])].sort((a, b) => String(a.date).localeCompare(String(b.date)));
  let acc = 0;
  const cap = Number(mes.headcount) || 9;
  return rows.map((h) => {
    acc += Number(h.add) || 0;
    return { ...h, total: acc, fill: cap > 0 ? (acc / cap) * 100 : 0, short: Math.max(0, cap - acc) };
  });
}
// 그 날짜에 확보돼 있는 인원
function staffAt(mes, dateStr) {
  const plan = hiringPlan(mes);
  let n = 0;
  plan.forEach((h) => { if (h.date <= dateStr) n = h.total; });
  return n;
}

                const v = hourVerdict(w.personHours);
                const share = view.kg > 0 ? (w.kg / view.kg) * 100 : 0;
                return html`
                  <div className="ivs-week-row" key=${w.key} style=${{ "--c": w.color }}>
                    <div className="ivs-week-row-h">
                      <span className="ivs-week-wk">${w.week}</span>
                      <span className="ivs-week-range">${w.label}</span>
                      <span className="ivs-week-kg">${kgTon(w.kg)}<em>톤</em></span>
                    </div>
                    <div className="ivs-week-meta">
                      <span>${w.phaseName || "-"} · ${w.workLabel}</span>
                      <span>조업 ${w.opDays}일 · BM ${kgTon(bmOf(mes, w.kg))}톤 · 월 대비 ${share.toFixed(0)}%</span>
                      <span className=${`ivs-chip ${v.c === "bad" ? "bad" : v.c === "warn" ? "accent" : "ok"}`}>
                        ${w.personHours > 0 ? `${w.personHours.toFixed(1)}h` : "-"}
                      </span>
                    </div>
                    ${w.note ? html`<div className="ivs-week-note">${w.note}</div>` : null}
                  </div>`;
              })}
              <div className="ivs-week-total">
                <span>${view.label} 합계</span>
                <b>${kgNum(view.kg)} kg</b>
                <span className="ivs-dim">조업 ${view.opDays}일 · BM ${kgNum(bm)} kg</span>
              </div>
            </div>
          </div>
        ` : html`
          <${PlanWeekChart} rows=${view.weeks} />
          ${weekTable(view.weeks)}
        `}
      </div>

      <!-- 일별 생산계획 -->
      <div className="ivs-card">
        <div className="ivs-card-head-row">
          <h2 className="ivs-section-title">일별 생산계획</h2>
          <div className="ivs-card-head-actions">
            <span className="ivs-chip accent">${ym} 계획 ${kgTon(monthRow.kg)} 톤 · BM ${kgTon(monthRow.bm)} 톤</span>
            <button className="ivs-btn ivs-btn-sm" onClick=${() => {
              const rows = [["일자", "요일", "주차", "단계", "근무형태", "조업구분", "일 교대수", "가동시간(hr)", "가동률", "계획 생산량(kg)", "BM 계획(kg)", "계획 누계(kg)", "배치 인원", "비고"]];
              let acc = 0;
              view.days.forEach((d) => {
                acc += d.totalKg;
                rows.push([d.date, dowOf(d.date), isoWeekKey(d.date).slice(5), d.phaseName, d.workTypeLabel,
                  d.opLabel, d.shiftsPerDay, Number(d.runHours.toFixed(2)), d.isStop ? 0 : Number(d.util),

              });
              downloadXlsx(`일별생산계획_${scope === "month" ? ym : "3개월"}.xlsx`, "일별계획", rows, [12, 6, 7, 11, 12, 18, 10, 13, 9, 16, 14, 15, 10, 16]);
            }}><${Icon} name="download" size=${13} /> 엑셀</button>
          </div>
        </div>
        <${PlanCalendar} ym=${ym} days=${calDays} mes=${mes} />
      </div>

      ${editOpen ? html`<${PlanEditModal} which=${editOpen} mes=${mes} months=${months} onClose=${() => setEditOpen(null)} onSave=${onSave} />` : null}
    </div>`;
}

// 월별 계획 — 막대(계획량)와 점(일 평균)을 같이 봐요. 계획량은 조업일수에 좌우되니까
// 일 평균을 나란히 놓아야 "달이 짧아서 적은 건지, 못 도는 건지"가 구분됩니다.
function PlanMonthChart({ rows, mes }) {
  if (!rows || rows.length === 0) return html`<div className="ivs-prod-empty center">계획 기간이 없어요.</div>`;
  const maxKg = Math.max(1, ...rows.map((r) => r.kg));
  const maxAvg = Math.max(1, ...rows.map((r) => r.avg));
  return html`
    <div>
    <div className="ivs-mchart">
      ${rows.map((r) => html`
        <div className="ivs-mchart-col" key=${r.key}>
          <div className="ivs-mchart-val">${(r.kg / 1000).toFixed(1)}<em>톤</em></div>
          <div className="ivs-mchart-plot">
            <div className="ivs-mchart-bar" style=${{ height: `${(r.kg / maxKg) * 100}%` }}></div>
            <span className="ivs-mchart-dot" style=${{ bottom: `${(r.avg / maxAvg) * 82}%` }}
              title=${`일 평균 ${Math.round(r.avg).toLocaleString("ko-KR")} kg`}></span>
          </div>
          <div className="ivs-mchart-name">${Number(r.key.slice(5))}월</div>
          <div className="ivs-mchart-sub">조업 ${r.opDays}일 · 일평균 ${Math.round(r.avg / 1000 * 10) / 10}톤</div>
        </div>`)}
    </div>
    <div className="ivs-legend" style=${{ marginTop: 12 }}>
      <span className="ivs-legend-row"><i className="ivs-legend-swatch" style=${{ background: "#E9692F" }}></i>계획 생산량</span>
      <span className="ivs-legend-row"><i className="ivs-legend-swatch round"></i>일 평균</span>
    </div>
    </div>`;
}

// 주별 계획 — 단계 색으로 칠해서 램프업이 눈에 보이게 해요.
function PlanWeekChart({ rows, compact }) {
  if (!rows || rows.length === 0) return html`<div className="ivs-prod-empty center">계획 기간이 없어요.</div>`;
  const max = Math.max(1, ...rows.map((r) => r.kg));
  const phaseSet = [];
  rows.forEach((r) => r.phaseNames.forEach((n) => { if (!phaseSet.find((x) => x.n === n)) phaseSet.push({ n, c: r.color }); }));
  return html`
    <div>
      <div className=${`ivs-wchart ${compact ? "compact" : ""}`}>
        ${rows.map((r) => html`
          <div className="ivs-wchart-col" key=${r.key} title=${`${r.label} · ${Math.round(r.kg).toLocaleString("ko-KR")} kg`}>
            <div className="ivs-wchart-val">${(r.kg / 1000).toFixed(1)}</div>
            <div className="ivs-wchart-plot">
              <div className="ivs-wchart-bar" style=${{ height: `${(r.kg / max) * 100}%`, background: r.color }}></div>
            </div>
            <div className="ivs-wchart-name">${r.week}</div>
            <div className="ivs-wchart-sub">${r.label}</div>
          </div>`)}
      </div>
      <div className="ivs-legend" style=${{ marginTop: 12 }}>
        ${phaseSet.map((p) => html`<span className="ivs-legend-row" key=${p.n}>
          <i className="ivs-legend-swatch" style=${{ background: p.c }}></i>${p.n}</span>`)}
        <span className="ivs-section-hint">막대 위 숫자는 톤</span>
      </div>
    </div>`;
}

// 인원 충원 — 누계가 정원선에 언제 닿는지 한눈에.
function HiringChart({ rows, cap }) {
  if (!rows || rows.length === 0) return html`<div className="ivs-prod-empty center">충원 계획이 없어요.</div>`;
  return html`
    <div className="ivs-hire">
      <div className="ivs-hire-capline" title=${`정원 ${cap}명`}></div>
      ${rows.map((h) => html`
        <div className="ivs-hire-col" key=${h.id || h.date}>
          <div className="ivs-hire-plot">
            <div className=${`ivs-hire-bar ${h.total >= cap ? "full" : ""}`} style=${{ height: `${Math.min(100, (h.total / cap) * 100)}%` }}>
              <span>${h.total}</span>
            </div>
          </div>
          <div className="ivs-hire-name">${h.label}</div>
          <div className="ivs-hire-sub">${h.date.slice(5).replace("-", "/")}${h.add > 0 ? ` · +${h.add}명` : ""}</div>
          <div className=${`ivs-hire-fill ${h.total >= cap ? "ok" : ""}`}>충족률 ${h.fill.toFixed(0)}%</div>
        </div>`)}
      <div className="ivs-hire-caplabel">정원 ${cap}명</div>
    </div>`;
}

// 일별 달력 — 그 날이 왜 그 색인지가 범례로 읽히게 했어요.
// 조업/휴무만 구분하면 "왜 쉬는지"가 안 보여서, 주말·공휴일·비생산을 각각 다른 색으로 둡니다.
function PlanCalendar({ ym, days, mes }) {
  if (!days || days.length === 0) return html`<div className="ivs-prod-empty center">이 달에는 계획이 없어요.</div>`;
  const lead = new Date(`${days[0].date}T00:00:00`).getDay();
  const kgNum = (kg) => Math.round(kg).toLocaleString("ko-KR");
  // 이 달에 실제로 나온 종류만 범례에 띄워요 (안 쓰는 색까지 늘어놓으면 오히려 헷갈려요)
  const used = [];
  ["work", "workWeekend", "workHoliday", "offWeekend", "offHoliday", "offNonProd"].forEach((k) => {
    const n = days.filter((d) => d.kind === k).length;
    if (n > 0) used.push({ k, n, ...DAY_KINDS[k] });
  });
  return html`
    <div>
      <div className="ivs-cal">
        ${DOW_KR.map((d) => html`<div className="ivs-cal-dow" key=${d}>${d}</div>`)}
        ${Array.from({ length: lead }, (_, i) => html`<div className="ivs-cal-pad" key=${`p${i}`}></div>`)}
        ${days.map((d) => {
          const kind = DAY_KINDS[d.kind] || DAY_KINDS.work;
          return html`
            <div className=${`ivs-cal-day k-${d.kind} ${d.isStop ? "stop" : ""}`} key=${d.date}
              style=${{ "--c": kind.color }}
              title=${`${d.date} (${dowOf(d.date)}) · ${d.phaseName || "-"} · ${d.opLabel}`}>
              <div className="ivs-cal-n">${Number(d.date.slice(8))}</div>
              ${d.isStop
                ? html`<div className="ivs-cal-stop">${d.opLabel.replace(/^휴무\(|\)$/g, "")}</div>`
                : html`
                  <div className="ivs-cal-kg">${kgNum(d.totalKg)}<em>kg</em></div>
                  <div className="ivs-cal-tags">
                    <span className="ivs-cal-tag day">${d.dayCrew ? `주 ${d.dayCrew}` : "주간"}</span>
                    ${d.nightHours > 0 ? html`<span className="ivs-cal-tag night">${d.nightCrew ? `야 ${d.nightCrew}` : "야간"}</span>` : null}
                  </div>
                  ${d.holiday ? html`<div className="ivs-cal-hol">${d.holiday.name}</div>` : null}`}
            </div>`;
        })}
      </div>
      <div className="ivs-cal-legend">
        ${used.map((u) => html`
          <span className="ivs-cal-legend-item" key=${u.k}>
            <i style=${{ background: u.color }}></i>${u.label}
            <b>${u.n}일</b>
          </span>`)}
      </div>
    </div>`;
}

// ---------- 기준정보 ----------
// 계획을 만드는 데 쓰는 값들을 한곳에 모았어요. 생산계획 화면에서는 결과만 보고,
// "왜 그 숫자가 나오는지"와 그걸 바꾸는 일은 여기서 합니다.
function BasisTab({ mes, canEdit, onSave }) {
  const [editOpen, setEditOpen] = useState(null);
  const days = useMemo(() => planDays(mes), [mes]);
  const months = useMemo(() => planByMonth(mes, days), [mes, days]);

    <div className="ivs-plan">
      <div className="ivs-section-head">
        <h2 className="ivs-section-title">기준정보</h2>
        <span className="ivs-section-hint">

        </span>
      </div>

      <${Section} title="기준값" hint="전체에 적용되는 기본값이에요"
        actions=${html`<${EditBtn} which="basis" icon="settings" label="기준값 편집" />`}>
        <div className="ivs-basis">
          ${[
            ["설비 처리능력", `${Number(mes.capa).toLocaleString("ko-KR")} kg/hr`, "분말 기준"],
            ["설비 투입 가동시간 / 교대", `${mes.dayHours} hr`, "구속 12h − 투입정지 1.25h − 인수인계 0.5h"],
            ["설비 투입 가동시간 / 주간", `${mes.dayOnlyHours} hr`, "주간근무는 작업 종료 준비가 더 붙어요"],
            ["1인 교대당 실 근무시간", `${mes.personHours} hr`, "주52시간 판정 기준"],
            ["BM 회수율", `${yieldPct} %`, "수분 + 유기물 제외 · BM 계획량 = 계획 생산량 × 회수율"],
            ["생산직 정원", `${Number(mes.headcount) || 9} 명`, `교대당 ${mes.crewSize}명 (투입 1 · 배출 1 · 중앙제어 1) × 3개조`],
            ["교대 순환", "주주주주휴휴야야야야휴휴", `12일 주기 · 기준일 ${mes.shiftAnchor} (A조 주간 첫날)`],
            ["목표 가동율", `${mes.targetUtil} %`, "가동율 현황에서 초록/노랑/빨강 판정 기준"],
          ].map(([k, v, sub]) => html`
            <div className="ivs-basis-row" key=${k}>
              <div className="ivs-basis-k">${k}</div>
              <div className="ivs-basis-v">${v}</div>
              <div className="ivs-basis-s">${sub}</div>
            </div>`)}
        </div>
        <p className="ivs-dash-note" style=${{ marginTop: 14 }}>
          일 계획 생산량 = 설비 처리능력 × 설비 투입 가동시간 × 일 교대수 × 그 단계의 설비 가동률.
          식사·휴식 중에는 설비를 세우지 않고 2인/1인이 번갈아 자리를 지켜요.
        </p>
      <//>

      <${Section} title="근무형태 기준" hint="여기서 정한 규칙이 달력의 조업 · 휴무를 결정해요"
        actions=${html`<${EditBtn} which="worktypes" icon="users" label="근무형태 편집" />`}>
        <div className="ivs-table-wrap">
          <table className="ivs-table">
            <thead><tr><th>근무형태</th><th className="ivs-right">일 교대수</th><th className="ivs-right">주 조업일</th>
              <th>공휴일</th><th className="ivs-right">조 수</th><th className="ivs-right">가동시간(hr)</th>
              <th className="ivs-right">일 생산량(kg)</th><th>조업일 규칙</th></tr></thead>
            <tbody>
              ${wts.map((w) => html`<tr key=${w.key}>
                <td><b>${w.label}</b></td>
                <td className="ivs-mono ivs-right">${w.shiftsPerDay}</td>
                <td className="ivs-mono ivs-right">${w.weekDays}일</td>

                <td className="ivs-mono ivs-right">${w.hours}</td>
                <td className="ivs-mono ivs-right ivs-dim">
                  ${kgNum(Number(mes.capa) * Number(w.hours) * Number(w.shiftsPerDay))}

                </td>
                <td className="ivs-dim">

                  ${w.holidayWork ? " · 공휴일 휴일근로" : " · 공휴일 휴무"}
                </td>
              </tr>`)}
            </tbody>
          </table>
        </div>
      <//>

      <${Section} title="양산 단계" hint="단계마다 근무형태와 가동률을 정해요"
        actions=${html`<${EditBtn} which="phases" icon="pencil" label="단계 편집" />`}>
        <div className="ivs-table-wrap">
          <table className="ivs-table">
            <thead><tr><th>단계</th><th>기간</th><th>근무형태</th><th className="ivs-right">가동률</th>
              <th className="ivs-right">인원</th><th className="ivs-right">조업일</th>
              <th className="ivs-right">계획 생산량(kg)</th><th>비고</th></tr></thead>
            <tbody>
              ${phases.map((p, i) => html`<tr key=${p.id}>
                <td><span className="ivs-ph-dot" style=${{ background: p.color }}></span>${i + 1}. ${p.name}</td>
                <td className="ivs-mono ivs-dim">${p.start} ~ ${p.end}</td>
                <td>${phaseWorkLabel(mes, p)}</td>
                <td className="ivs-mono ivs-right">${((Number(p.util) || 0) * 100).toFixed(0)}%</td>
                <td className="ivs-mono ivs-right">${p.staff}</td>
                <td className="ivs-mono ivs-right">${p.opDays}</td>
                <td className="ivs-mono ivs-right">${kgNum(p.kg)}</td>
                <td className="ivs-dim">${p.note || "-"}</td>
              </tr>`)}
            </tbody>
          </table>
        </div>
      <//>

      <div className="ivs-half-grid">
        <${Section} title="월별 기준" hint="그 달만 다르게 잡고 싶을 때"
          actions=${html`<${EditBtn} which="monthly" icon="calendar" label="월별 기준 편집" />`}>
          <div className="ivs-table-wrap">
            <table className="ivs-table">
              <thead><tr><th>월</th><th className="ivs-right">처리능력</th><th className="ivs-right">교대 가동</th>
                <th className="ivs-right">가동률</th><th>비고</th></tr></thead>
              <tbody>
                ${months.length === 0
                  ? html`<tr><td colSpan=${5} className="ivs-prod-empty center">계획 기간이 없어요.</td></tr>`
                  : months.map((m) => {
                      const ov = (mes.monthly || {})[m.key] || {};
                      const has = Object.keys(ov).length > 0;
                      return html`<tr key=${m.key} className=${has ? "" : "ivs-dim-row"}>
                        <td className="ivs-mono">${m.key}</td>
                        <td className="ivs-mono ivs-right">${ov.capa ? Number(ov.capa).toLocaleString("ko-KR") : html`<span className="ivs-dim">${Number(mes.capa).toLocaleString("ko-KR")}</span>`}</td>
                        <td className="ivs-mono ivs-right">${ov.dayHours ?? html`<span className="ivs-dim">${mes.dayHours}</span>`}</td>
                        <td className="ivs-mono ivs-right">${ov.util != null ? `${Math.round(ov.util * 100)}%` : html`<span className="ivs-dim">단계값</span>`}</td>
                        <td className="ivs-dim">${ov.note || (has ? "" : "기본값 사용")}</td>

function ProductionTab({ lots, moves, canEdit, onClearMoves, onDeleteMoves }) {
  const todayStr = new Date().toISOString().slice(0, 10);
  const [selectedDate, setSelectedDate] = useState(todayStr);
  const [pickedMoves, setPickedMoves] = useState(() => new Set()); // 지울 이력으로 체크해둔 것들
  const [confirmDelete, setConfirmDelete] = useState(false);
  const toggleMove = (id) => setPickedMoves((prev) => {
    const next = new Set(prev);
    next.has(id) ? next.delete(id) : next.add(id);
    return next;
  });

  const availableYears = useMemo(() => {
    const s = new Set(
      [...lots.map((l) => l.receivedDate?.slice(0, 4)), ...moves.map((m) => m.date?.slice(0, 4)), String(new Date().getFullYear())]
        .filter(Boolean)
    );
    return Array.from(s).sort().reverse();
  }, [lots, moves]);

  const [year, setYear] = useState(availableYears[0] || String(new Date().getFullYear()));
  const [month, setMonth] = useState("all"); // 'all' | '1'..'12'
  const [day, setDay] = useState("all"); // 'all' | '1'..'31'

  const dayOptions = useMemo(() => {
    if (month === "all") return [];
    const n = new Date(Number(year), Number(month), 0).getDate();
    return Array.from({ length: n }, (_, i) => String(i + 1));
  }, [year, month]);

  const inPeriod = useCallback((dateStr) => {
    if (!dateStr) return false;
    const [y, m, d] = dateStr.split("-");
    if (y !== year) return false;
    if (month !== "all" && Number(m) !== Number(month)) return false;
    if (month !== "all" && day !== "all" && Number(d) !== Number(day)) return false;
    return true;
  }, [year, month, day]);

  const dayReceipts = useMemo(
    () => lots.filter((l) => l.receivedDate === selectedDate).sort((a, b) => (a.lotNo > b.lotNo ? 1 : -1)),
    [lots, selectedDate]
  );
  const dayMoves = useMemo(() => moves.filter((m) => m.date === selectedDate), [moves, selectedDate]);
  const dayReceiptQty = sumBy(dayReceipts, "qtyKg");
  const dayDischargeQty = sumBy(dayMoves, "outputQty");
  const dayLossQty = sumBy(dayMoves, "lossQty");
  const dayMixQty = sumBy(dayMoves, "mixQty");

  const periodLots = useMemo(() => lots.filter((l) => inPeriod(l.receivedDate)), [lots, inPeriod]);
  const periodMoves = useMemo(() => moves.filter((m) => inPeriod(m.date)), [moves, inPeriod]);
  const totalIn = sumBy(periodLots, "qtyKg");
  const totalOut = sumBy(periodMoves, "outputQty");
  const totalLoss = sumBy(periodMoves, "lossQty");
  const totalMix = sumBy(periodMoves, "mixQty");
  const recoveryRate = totalIn > 0 ? (totalOut / totalIn) * 100 : 0;

  const stageYield = useMemo(() => {
    const map = new Map();
    periodMoves.forEach((m) => {
      const key = `${m.fromStage}__${m.toStage}`;
      if (!map.has(key)) map.set(key, { fromStage: m.fromStage, toStage: m.toStage, input: 0, output: 0 });
      const row = map.get(key);
      row.input += m.inputQty;
      row.output += m.outputQty;
    });
    return Array.from(map.values());
  }, [periodMoves]);

  return html`
    <div className="ivs-prod">
      <div className="ivs-prod-report-head" style=${{ marginBottom: 16 }}>
        <p className="ivs-prod-desc" style=${{ margin: 0 }}>
          공정이동 이력을 생산 관점에서 모아 보여줍니다. 재고현황과 같은 이력 데이터를 그대로 사용해요 —
          여기서 뭔가 등록하는 게 아니라, "재고현황"에서 등록한 공정이동을 분석용으로 다시 보여주는 화면입니다.
          이 이력은 로트와는 별개로 남기 때문에, 재고현황에서 로트를 지워도 여기 통계에는 과거 이동 기록이 그대로 반영돼요.
        </p>
        ${canEdit ? html`
          <button className="ivs-btn" onClick=${onClearMoves} title="공정이동 이력만 모두 지워요 (로트 데이터는 남아요)" style=${{ flexShrink: 0 }}>
            <${Trash2} size=${13} /> 이력 전체 삭제
          </button>
        ` : null}
      </div>

      <div className="ivs-card">
        <div className="ivs-prod-report-head">
          <div className="ivs-card-label" style=${{ marginBottom: 0 }}><${FileText} size=${13} style=${{ verticalAlign: -2, marginRight: 4 }} />일일 작업일보</div>
          <div className="ivs-prod-report-actions">
            <input type="date" className="ivs-input" value=${selectedDate} onChange=${(e) => setSelectedDate(e.target.value)} />
            <button className="ivs-btn" onClick=${() => window.print()}><${Printer} size=${13} /> 인쇄</button>
          </div>
        </div>
        <div className="ivs-kpis">
          <${SummaryCard} label="신규 입고" value=${fmtTon(dayReceiptQty)} unit="톤" />
          <${SummaryCard} label="공정이동 배출" value=${fmtTon(dayDischargeQty)} unit="톤" />
          <${SummaryCard} label="공정손실" value=${fmtTon(dayLossQty)} unit="톤" />
          <${SummaryCard} label="혼합증가" value=${fmtTon(dayMixQty)} unit="톤" />
        </div>

        <div className="ivs-prod-listlabel">신규 입고 (${dayReceipts.length}건)</div>
        <div className="ivs-prod-list">
          ${dayReceipts.length === 0 ? html`
            <div className="ivs-prod-empty">이 날 등록된 신규 입고가 없습니다.</div>
          ` : dayReceipts.map((l) => html`
            <div className="ivs-prod-row" key=${l.id}>
              ${l.code} · ${l.name} · ${l.lotNo} · ${Number(l.qtyKg).toLocaleString("ko-KR", { maximumFractionDigits: 1 })}Kg${l.carriedOver ? " (이월재고)" : ""}
            </div>
          `)}
        </div>

        <div className="ivs-prod-listhead">
          <div className="ivs-prod-listlabel" style=${{ marginBottom: 0 }}>공정이동 (${dayMoves.length}건)</div>
          ${canEdit && dayMoves.length > 0 ? html`
            <div className="ivs-prod-listactions">
              <button className="ivs-btn ivs-btn-sm" onClick=${() => setPickedMoves((prev) => {
                const allPicked = dayMoves.every((m) => prev.has(m.id));
                const next = new Set(prev);
                dayMoves.forEach((m) => (allPicked ? next.delete(m.id) : next.add(m.id)));
                return next;
              })}>
                ${dayMoves.every((m) => pickedMoves.has(m.id)) ? "선택 해제" : `이 날 ${dayMoves.length}건 모두 선택`}
              </button>
              <button
                className="ivs-btn ivs-btn-sm ivs-btn-danger"
                disabled=${dayMoves.every((m) => !pickedMoves.has(m.id))}
                onClick=${() => setConfirmDelete(true)}
              >
                <${Trash2} size=${12} /> 선택 이력 삭제 (${dayMoves.filter((m) => pickedMoves.has(m.id)).length})
              </button>
            </div>
          ` : null}
        </div>
        <div className="ivs-prod-list">
          ${dayMoves.length === 0 ? html`
            <div className="ivs-prod-empty">이 날 등록된 공정이동이 없습니다.</div>
          ` : dayMoves.map((m) => html`
            <div className=${`ivs-prod-row ${pickedMoves.has(m.id) ? "picked" : ""}`} key=${m.id}>
              ${canEdit ? html`
                <input type="checkbox" className="ivs-prod-check" checked=${pickedMoves.has(m.id)}
                  onChange=${() => toggleMove(m.id)} title="이 이력을 삭제 대상으로 고르기" />
              ` : null}
              <span>
                ${m.code} · ${m.lotNo} · ${getStage(m.fromStage).label} → ${getStage(m.toStage).label} ·
                투입 ${Number(m.inputQty).toLocaleString("ko-KR", { maximumFractionDigits: 1 })}Kg → 배출 ${Number(m.outputQty).toLocaleString("ko-KR", { maximumFractionDigits: 1 })}Kg
                ${m.lossQty > 0 ? html`<span className="ivs-prod-tag loss">손실 ${m.lossQty.toLocaleString("ko-KR", { maximumFractionDigits: 1 })}Kg</span>` : null}
                ${m.mixQty > 0 ? html`<span className="ivs-prod-tag mix">혼합증가 ${m.mixQty.toLocaleString("ko-KR", { maximumFractionDigits: 1 })}Kg</span>` : null}
              </span>
            </div>
          `)}
        </div>
        ${confirmDelete ? html`
          <${ConfirmModal}
            icon=${html`<${AlertTriangle} size=${18} />`}
            title=${`공정이동 이력 ${dayMoves.filter((m) => pickedMoves.has(m.id)).length}건을 지울까요?`}
            body="고른 이력만 지워져요. 재고현황의 로트(단계·수량)는 그대로 남고, 생산 통계에서만 빠져요. 되돌릴 수 없어요."
            confirmLabel="이력 삭제"
            danger=${true}
            onCancel=${() => setConfirmDelete(false)}
            onConfirm=${() => {
              const ids = dayMoves.filter((m) => pickedMoves.has(m.id)).map((m) => m.id);
              onDeleteMoves(ids);
              setPickedMoves((prev) => { const next = new Set(prev); ids.forEach((id) => next.delete(id)); return next; });
              setConfirmDelete(false);

      </div>

      <div className="ivs-prod-periodbar">
        <span className="ivs-dim">기간</span>
        <select className="ivs-select" value=${year} onChange=${(e) => setYear(e.target.value)}>

      <div className="ivs-kpis cols-5">
        <${SummaryCard} label="총 입고량 (선택 기간)" value=${fmtTon(totalIn)} unit="톤" />
        <${SummaryCard} label="총 배출량/생산량 (선택 기간)" value=${fmtTon(totalOut)} unit="톤" />
        <${SummaryCard} label="총 공정손실 (선택 기간)" value=${fmtTon(totalLoss)} unit="톤" />
        <${SummaryCard} label="총 혼합증가 (선택 기간)" value=${fmtTon(totalMix)} unit="톤" />
        <${SummaryCard} label="입고대비 회수율 (선택 기간)" value=${recoveryRate.toFixed(1)} unit="%" accent=${true} />

      <div className="ivs-card">
        <div className="ivs-card-label">단계 구간별 수율 (투입 → 배출, 선택 기간)</div>
        ${stageYield.length === 0 ? html`
          <div className="ivs-prod-empty center">해당 기간에 등록된 공정이동이 없습니다.</div>
        ` : html`
          <table className="ivs-table ivs-yield-table">
            <thead>
              <tr><th>구간</th><th className="ivs-right">투입</th><th className="ivs-right">배출</th><th className="ivs-right">수율</th></tr>
            </thead>
            <tbody>
              ${stageYield.map((r) => html`
                <tr key=${`${r.fromStage}__${r.toStage}`}>
                  <td>
                    <span className="ivs-badge" style=${{ "--c": getStage(r.fromStage).color }}>${getStage(r.fromStage).label}</span>${" → "}<span className="ivs-badge" style=${{ "--c": getStage(r.toStage).color }}>${getStage(r.toStage).label}</span>
                  </td>
                  <td className="ivs-mono ivs-right">${fmtTon(r.input)} 톤</td>

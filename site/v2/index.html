}

function TollingTab({ lots }) {
  const tollingLots = useMemo(() => lots.filter((l) => l.tolling), [lots]);
  const [selectedLoc, setSelectedLoc] = useState("");

  const totals = useMemo(() => {
    const totalIn = sumBy(tollingLots, "qtyKg");
    const inProgress = tollingLots.filter((l) => !FINAL_STAGE_KEYS.includes(l.stage)).reduce((s, l) => s + l.qtyKg, 0);
    const done = tollingLots.filter((l) => FINAL_STAGE_KEYS.includes(l.stage)).reduce((s, l) => s + l.qtyKg, 0);
    return { totalIn, inProgress, done };
  }, [tollingLots]);

  const groupBy = (keyFn, extra) => {
    const map = new Map();
    tollingLots.forEach((l) => {
      const key = keyFn(l);
      if (!map.has(key)) map.set(key, { key, in: 0, prog: 0, ...extra(l) });
      const row = map.get(key);
      row.in += l.qtyKg;
      if (!FINAL_STAGE_KEYS.includes(l.stage)) row.prog += l.qtyKg;
    });
    return Array.from(map.values())
      .sort((a, b) => b.in - a.in)
      .map((r, i) => ({ ...r, color: RANK_PALETTE[i % RANK_PALETTE.length] }));
  };

  const byLoc = useMemo(() => groupBy((l) => l.shipLoc, (l) => ({ label: l.shipLoc })), [tollingLots]);
  const byItemVendor = useMemo(
    () => groupBy((l) => `${l.code}__${l.vendor}`, (l) => ({ label: `${l.code}·${l.name} · ${l.vendor}` })),
    [tollingLots]
  );
  const byItem = useMemo(() => groupBy((l) => l.code, (l) => ({ label: `${l.code} · ${l.name}` })), [tollingLots]);

  const byLocDrill = useMemo(() => {
    if (!selectedLoc) return [];
    const map = new Map();
    tollingLots.filter((l) => l.shipLoc === selectedLoc).forEach((l) => {
      const catLabel = categoryById[l.categoryId]?.label || "기타";
      const wk = weekLabel(l.receivedDate);
      const key = `${catLabel}__${wk}`;
      if (!map.has(key)) map.set(key, { key, label: `${catLabel} · ${wk}`, in: 0, prog: 0 });
      const row = map.get(key);
      row.in += l.qtyKg;
      if (!FINAL_STAGE_KEYS.includes(l.stage)) row.prog += l.qtyKg;
    });
    return Array.from(map.values())
      .sort((a, b) => b.in - a.in)
      .map((r, i) => ({ ...r, color: RANK_PALETTE[i % RANK_PALETTE.length] }));
  }, [tollingLots, selectedLoc]);

  const locOptions = useMemo(() => Array.from(new Set(tollingLots.map((l) => l.shipLoc))).sort(), [tollingLots]);

  // 나열 대신 막대로 — 입고량(연한 막대) 위에 재공 현재고(진한 막대)를 겹쳐 그려서
  // "얼마나 들어왔고, 그중 얼마가 아직 남아있는지"가 한눈에 보이게 했어요.
  const AggList = ({ rows, emptyMsg }) => {
    if (rows.length === 0) return html`<div className="ivs-prod-empty center">${emptyMsg}</div>`;
    const max = Math.max(...rows.map((r) => r.in), 1);
    const color = "var(--text-dim)";
    return html`
      <div className="ivs-aggbars">
        <div className="ivs-aggbars-legend">
          <span><i className="ivs-legend-swatch soft" style=${{ background: "var(--text-dim)" }} /> 입고량 (연한 막대)</span>
          <span><i className="ivs-legend-swatch" style=${{ background: "var(--text-dim)" }} /> 재공 현재고 (진한 막대)</span>
        </div>
        ${rows.map((r) => html`
          <div className="ivs-aggbar-row" key=${r.key}>
            <div className="ivs-aggbar-name" title=${r.label}>${r.label}</div>
            <div className="ivs-aggbar-track" title=${`입고 ${fmtTon(r.in)} 톤 · 재공 ${fmtTon(r.prog)} 톤`}>
              <div className="ivs-aggbar-in" style=${{ width: `${(r.in / max) * 100}%`, background: r.color || color }} />
              <div className="ivs-aggbar-prog" style=${{ width: `${(r.prog / max) * 100}%`, background: r.color || color }} />
            </div>
            <div className="ivs-aggbar-val">
              ${fmtTon(r.in)} 톤<small>재공 ${fmtTon(r.prog)} 톤</small>
            </div>
          </div>
        `)}
      </div>
    `;
  };

  return html`
    <div className="ivs-tolling">
      <p className="ivs-prod-desc">
        여기서는 "재고현황"에 등록할 때 톨링품으로 체크한 로트만 모아서 출고지·품목·주차별로 집계해서 보여줍니다.
        개별 로트를 편집하려면 재고현황 탭에서 "톨링품만 보기"를 켜세요.
      </p>

      <div className="ivs-kpis cols-3">
        <${SummaryCard} label="톨링 총 입고량" value=${fmtTon(totals.totalIn)} unit="톤" />
        <${SummaryCard} label="톨링 현재고 (재공)" value=${fmtTon(totals.inProgress)} unit="톤" accent=${true} />
        <${SummaryCard} label="톨링 완료(출고) 합계" value=${fmtTon(totals.done)} unit="톤" />
      </div>

      <div className="ivs-card">
        <div className="ivs-card-head-row">
          <h2 className="ivs-section-title">출고지별 입고량 / 재공 현재고</h2>
          <span className="ivs-section-hint">단위: 톤</span>
        </div>
        <div className="ivs-chart-split">
          <div>
            <div className="ivs-chart-label">출고지 재공 구성비</div>
            <${DonutChart}
              rows=${byLoc.map((r) => ({ key: r.key, label: r.label, value: r.prog, color: r.color }))}
              centerLabel="톤 재공"
              emptyMsg="재공 중인 톨링품이 없어요."
            />
          </div>
          <div>
            <div className="ivs-chart-label">출고지별 상세</div>
            <${AggList} rows=${byLoc} emptyMsg="등록된 톨링품이 없습니다." />
          </div>
        </div>
      </div>

      <div className="ivs-card">
        <div className="ivs-card-head-row">
          <h2 className="ivs-section-title">품목별 입고량 / 재공 현재고</h2>
          <span className="ivs-section-hint">단위: 톤</span>
        </div>
        <div className="ivs-chart-split">
          <div>
            <div className="ivs-chart-label">품목 재공 구성비</div>
            <${DonutChart}
              rows=${byItem.map((r) => ({ key: r.key, label: r.label, value: r.prog, color: r.color }))}
              centerLabel="톤 재공"
              emptyMsg="재공 중인 톨링품이 없어요."
            />
          </div>
          <div>
            <div className="ivs-chart-label">품목별 상세</div>
            <${AggList} rows=${byItem} emptyMsg="등록된 톨링품이 없습니다." />
          </div>
        </div>
      <div className="ivs-card">
        <div className="ivs-card-head-row">
          <div className="ivs-card-label" style=${{ marginBottom: 0 }}>출고지 선택 → 품목 × 주차/월차별 입고량 / 재공 현재고 (톤)</div>
          <select className="ivs-select" value=${selectedLoc} onChange=${(e) => setSelectedLoc(e.target.value)}>
            <option value="">출고지를 선택하세요</option>
            ${locOptions.map((loc) => html`<option key=${loc} value=${loc}>${loc}</option>`)}
          </select>
        </div>
        ${!selectedLoc ? html`
          <div className="ivs-prod-empty center">
            위에서 출고지를 선택하면 해당 출고지의 품목·주차/월차별 입고량과 재공현재고가 표시됩니다.
          </div>
        ` : html`<${AggList} rows=${byLocDrill} emptyMsg=${`${selectedLoc}의 톨링품 데이터가 없습니다.`} />`}
      </div>

      <div className="ivs-card">
        <div className="ivs-card-label">품목 × 거래처별 입고량 / 재공 현재고 (톤)</div>
        <${AggList} rows=${byItemVendor} emptyMsg="등록된 톨링품이 없습니다." />
      </div>

      </div>
    </div>
  `;
}

// 순위 그래프는 상위 7개까지만 — 조각이 많아지면 도넛이 오히려 안 읽혀요.
const top7 = (rows) => (rows || []).slice(0, 7);
const RANK_PALETTE = ["#3B82F6", "#A855F7", "#22C55E", "#F97316", "#06B6D4", "#EAB308", "#EF4444", "#EC4899", "#14B8A6", "#8B98AD"];

function DashboardTab({ lots, moves, dayDelta }) {
  const availableYears = useMemo(() => {
    const s = new Set(
      [...lots.map((l) => l.receivedDate?.slice(0, 4)), ...moves.map((m) => m.date?.slice(0, 4)), String(new Date().getFullYear())]
        .filter(Boolean)
    );
    return Array.from(s).sort().reverse();
  }, [lots, moves]);

  const [year, setYear] = useState(availableYears[0] || String(new Date().getFullYear()));
  const [month, setMonth] = useState("all");
  const [day, setDay] = useState("all");

  const dayOptions = useMemo(() => {
    if (month === "all") return [];
    const n = new Date(Number(year), Number(month), 0).getDate();
    return Array.from({ length: n }, (_, i) => String(i + 1));
  }, [year, month]);

  const inPeriod = useCallback((dateStr) => {
    if (!dateStr) return false;
    const [y, m, d] = dateStr.split("-");
    if (y !== year) return false;
    if (month !== "all" && Number(m) !== Number(month)) return false;
    if (month !== "all" && day !== "all" && Number(d) !== Number(day)) return false;
    return true;
  }, [year, month, day]);

  const periodLots = useMemo(() => lots.filter((l) => inPeriod(l.receivedDate)), [lots, inPeriod]);

  // ---------- 선택 기간 요약 ----------
  const totalInKg = sumBy(periodLots, "qtyKg");
  const totalNetKg = periodLots.reduce((s, l) => s + (l.qtyKg - (l.waterKg || 0)), 0);
  const readyKg = periodLots.filter((l) => l.stage === "usable").reduce((s, l) => s + l.qtyKg, 0); // 출하대기
  const calcineKg = periodLots.filter((l) => l.stage === "calcine_needed").reduce((s, l) => s + l.qtyKg, 0);
  const shippedKg = periodLots.filter((l) => l.stage === "shipped").reduce((s, l) => s + l.qtyKg, 0); // 출하완료

  // ---------- 실시간 현재고 (기간 무관) ----------
  const liveTotalKg = sumBy(lots, "qtyKg");
  const liveNetKg = lots.reduce((s, l) => s + (l.qtyKg - (l.waterKg || 0)), 0);

  // ---------- 월마감(기준일) 스냅샷 ----------
  const asOfDate = useMemo(() => computeAsOfDate(year, month, day), [year, month, day]);
  const movesByLot = useMemo(() => {
    const map = new Map();
    moves.forEach((m) => {
      const key = m.lotId || m.lotNo;
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(m);
    });
    return map;
  }, [moves]);

  const snapshot = useMemo(() => {
    const stageTotals = Object.fromEntries(STAGES.map((s) => [s.key, 0]));
    lots.forEach((l) => {
      const lotMoves = movesByLot.get(l.id) || movesByLot.get(l.lotNo) || [];
      const state = reconstructLotState(l, lotMoves, asOfDate);
      if (state) stageTotals[state.stage] = (stageTotals[state.stage] || 0) + state.qtyKg;
    });
    const inProgress = STAGES.filter((s) => !FINAL_STAGE_KEYS.includes(s.key)).reduce((s, st) => s + stageTotals[st.key], 0);
    const done = FINAL_STAGE_KEYS.reduce((s, k) => s + stageTotals[k], 0);
    return { stageTotals, inProgress, done };
  }, [lots, movesByLot, asOfDate]);

  // 그래프용 데이터 — 세로 막대는 공정 순서 그대로, 도넛은 재공(출하완료 제외) 구성비만.
  const stageChartRows = useMemo(() => STAGES.map((s) => ({
    key: s.key, label: s.label, color: s.color,
    value: snapshot.stageTotals[s.key] || 0,
    sub: FINAL_STAGE_KEYS.includes(s.key) ? "최종" : null,
  })), [snapshot]);
  const stageDonutRows = useMemo(() => stageChartRows.filter((r) => !FINAL_STAGE_KEYS.includes(r.key)), [stageChartRows]);

  // ---------- 카테고리별 현재고 (실시간, 재공 중) ----------
  const categoryLive = useMemo(() => {
    const map = new Map();
    lots.filter((l) => !FINAL_STAGE_KEYS.includes(l.stage)).forEach((l) => {
      const cat = categoryById[l.categoryId];
      const key = cat ? cat.id : "__none";
      if (!map.has(key)) map.set(key, { key, label: cat ? cat.label : "(미분류)", color: cat ? cat.color : "#94A3B8", count: 0, kg: 0 });
      const row = map.get(key);
      row.count += 1; row.kg += l.qtyKg;
    });
    return Array.from(map.values()).sort((a, b) => b.kg - a.kg);
  }, [lots]);

  // ---------- 품목별 입고 순위 (선택 기간) ----------
  const itemRank = useMemo(() => {
    const map = new Map();
    periodLots.forEach((l) => {
      const key = l.code;
      if (!map.has(key)) map.set(key, { key, label: `${l.code} · ${l.name}`, count: 0, kg: 0, netKg: 0 });
      const row = map.get(key);
      row.count += 1; row.kg += l.qtyKg; row.netKg += (l.qtyKg - (l.waterKg || 0));
    });
    return Array.from(map.values()).sort((a, b) => b.kg - a.kg).map((r, i) => ({ ...r, color: RANK_PALETTE[i % RANK_PALETTE.length] }));
  }, [periodLots]);

  // ---------- 카테고리별 입고 순위 (선택 기간) ----------
  const categoryRank = useMemo(() => {
    const map = new Map();
    periodLots.forEach((l) => {
      const cat = categoryById[l.categoryId];
      const key = cat ? cat.id : "__none";
      if (!map.has(key)) map.set(key, { key, label: cat ? cat.label : "(미분류)", color: cat ? cat.color : "#94A3B8", count: 0, kg: 0 });
      const row = map.get(key);
      row.count += 1; row.kg += l.qtyKg;
    });
    return Array.from(map.values()).sort((a, b) => b.kg - a.kg);
  }, [periodLots]);

  // ---------- 거래처별 입고 순위 (선택 기간) ----------
  const vendorRank = useMemo(() => {
    const map = new Map();
    periodLots.forEach((l) => {
      const key = l.vendor;
      if (!map.has(key)) map.set(key, { key, label: l.vendor, count: 0, kg: 0 });
      const row = map.get(key);
      row.count += 1; row.kg += l.qtyKg;
    });
    return Array.from(map.values()).sort((a, b) => b.kg - a.kg).map((r, i) => ({ ...r, color: RANK_PALETTE[i % RANK_PALETTE.length] }));
  }, [periodLots]);

  // 기준일 시점의 재공재고 장부 — 이동이력으로 되돌린 "그날의 재고"를 로트 한 줄씩 뽑아요.
  const snapshotLedger = useMemo(() => {
    const rows = [];
    lots.forEach((l) => {
      const lotMoves = movesByLot.get(l.id) || movesByLot.get(l.lotNo) || [];
      const st = reconstructLotState(l, lotMoves, asOfDate);
      if (!st) return;                                  // 기준일에는 아직 입고 전
      if (FINAL_STAGE_KEYS.includes(st.stage)) return;  // 이미 출하완료된 건 재공재고가 아니에요
      rows.push({ lot: l, state: st });
    });
    // 단계(공정 순서) → 입고일 순으로 정렬해서 장부처럼 읽히게 해요.
    const order = Object.fromEntries(STAGES.map((x, i) => [x.key, i]));
    rows.sort((a, b) =>
      (order[a.state.stage] ?? 99) - (order[b.state.stage] ?? 99) ||
      String(a.lot.receivedDate).localeCompare(String(b.lot.receivedDate))
    );
    return rows;
  }, [lots, movesByLot, asOfDate]);

  const ledgerTotalKg = useMemo(
    () => snapshotLedger.reduce((sum, r) => sum + (Number(r.state.qtyKg) || 0), 0),
    [snapshotLedger]
  );

  const downloadLedger = () => {
    const headers = [
      "기준일", "공정단계", "품목코드", "품목명", "카테고리", "거래처", "출고지", "입고 Lot",
      "입고일", "주차", "기준일 수량(Kg)", "물중량(Kg)", "제외무게(Kg)", "최종 공정이동일", "톨링품", "이월",
    ];
    const rows = snapshotLedger.map(({ lot, state }) => [
      asOfDate, getStage(state.stage).label, lot.code, lot.name,
      categoryById[lot.categoryId]?.label || "", lot.vendor, lot.shipLoc, lot.lotNo,
      lot.receivedDate, weekLabel(lot.receivedDate), state.qtyKg,
      lot.waterKg ?? "", lot.excludeKg ?? "", state.lastMove ?? "",
      lot.tolling ? "Y" : "", lot.carriedOver ? "Y" : "",
    ]);
    const total = ["합계", "", "", "", "", "", "", `${rows.length}건`, "", "", ledgerTotalKg, "", "", "", "", ""];
    const widths = [12, 13, 11, 20, 14, 20, 11, 16, 12, 18, 15, 13, 14, 15, 9, 7];
    downloadXlsx(`재공재고장부_${asOfDate}.xlsx`, `재공재고 ${asOfDate}`, [headers, ...rows, total], widths);
  };

  return html`
    <div className="ivs-dash">
      <div className="ivs-section-head">
        <h2 className="ivs-section-title">집계</h2>
        <span className="ivs-section-hint">기간을 고르면 아래 "선택 기간" 카드와 순위가 함께 바뀌어요</span>
      </div>

      <div className="ivs-prod-periodbar">
        <span className="ivs-dim">기간</span>
        <select className="ivs-select" value=${year} onChange=${(e) => setYear(e.target.value)}>
          ${availableYears.map((y) => html`<option key=${y} value=${y}>${y}년</option>`)}
        </select>
        <select className="ivs-select" value=${month} onChange=${(e) => { setMonth(e.target.value); setDay("all"); }}>
          <option value="all">연간 전체</option>
          ${Array.from({ length: 12 }, (_, i) => i + 1).map((m) => html`<option key=${m} value=${String(m)}>${m}월</option>`)}
        </select>
        <select className="ivs-select" value=${day} onChange=${(e) => setDay(e.target.value)} disabled=${month === "all"}>
          <option value="all">일자 전체</option>
          ${dayOptions.map((d) => html`<option key=${d} value=${d}>${d}일</option>`)}
        </select>
      </div>

      <div className="ivs-kpis cols-5">
        <${SummaryCard} label="총 입고량 (선택 기간)" value=${fmtTon(totalInKg)} unit="톤" sub=${`물중량 제외 ${fmtTon(totalNetKg)} 톤`} />
        <${SummaryCard} label="출하대기 (선택 기간)" value=${fmtTon(readyKg)} unit="톤" />
        <${SummaryCard} label="열분해대기 (선택 기간)" value=${fmtTon(calcineKg)} unit="톤" />
        <${SummaryCard} label="출하완료 (선택 기간)" value=${fmtTon(shippedKg)} unit="톤" />
        <${SummaryCard}
          label="현재고 (실시간)"
          value=${fmtTon(liveTotalKg)} unit="톤" accent=${true}
          icon=${html`<${Layers} size=${13} />`}
          delta=${dayDelta ? html`<${Delta} kg=${dayDelta.totalKg} count=${dayDelta.count} />` : null}
          sub=${`물중량 제외 ${fmtTon(liveNetKg)} 톤`}
        />
      </div>

      <p className="ivs-dash-note">
        ※ "총 입고량"과 단계별 카드(출하대기 · 열분해대기 · 출하완료)는 선택한 기간에 입고된 로트 기준이고,
        "현재고"는 기간과 무관하게 지금 이 순간의 실시간 수량이에요.
        재공(현재고)에서 빠지는 최종 단계는 "출하완료" 하나예요 — 열분해대기는 아직 공정이 남아있어서 현재고에 포함돼요.
      </p>

      <div className="ivs-card">
        <div className="ivs-card-head-row">
          <h2 className="ivs-section-title"><${Calendar} size=${13} style=${{ verticalAlign: -2, marginRight: 5 }} />월마감(기준일) 재고 스냅샷</h2>
          <div className="ivs-card-head-actions">
            <span className="ivs-section-hint">기준일 ${asOfDate}</span>
            <button className="ivs-btn ivs-btn-sm" onClick=${downloadLedger} disabled=${snapshotLedger.length === 0}
              title="기준일 시점의 재공재고를 로트 단위로 정리한 장부를 엑셀 파일(.xlsx)로 내려받아요">
              <${Download} size=${13} /> 재공재고 장부 엑셀 내려받기 (${snapshotLedger.length}건)
            </button>
          </div>
        </div>
        <p className="ivs-dash-note">
          위에서 "일"까지 선택하면 그 날짜 기준, "일"을 비워두면 선택한 달의 말일 기준 재고를 보여줍니다 (연간 전체면 그 해 12/31 기준).
          실시간 현재고와 달리, 그 시점에 실제로 얼마나 있었는지를 이동이력 기반으로 재구성한 값이에요.
        </p>
        <div className="ivs-kpis cols-3">
          <${SummaryCard} label="기준일" value=${asOfDate} unit="" />
          <${SummaryCard} label="재공재고 (기준일)" value=${fmtTon(snapshot.inProgress)} unit="톤" accent=${true} />
          <${SummaryCard} label="완료(출고) 합계 (기준일)" value=${fmtTon(snapshot.done)} unit="톤" />
        </div>
        <p className="ivs-dash-note">
          기간을 바꾸면 기준일도 함께 바뀌고, "재공재고 장부 내려받기"는 그 기준일 시점의 재공재고를
          로트 한 줄씩(단계 · 입고 Lot · 수량 · 입고일 순) 정리해서 내려줘요.
          엑셀 파일(.xlsx)이라 더블클릭하면 바로 열리고, 한글이 깨지지 않아요.
        </p>
      </div>

      <div className="ivs-half-grid">
        <div className="ivs-card">
          <div className="ivs-card-head-row">
            <h2 className="ivs-section-title">공정 순서대로 본 단계별 재고</h2>
            <span className="ivs-section-hint">기준일 ${asOfDate} · 단위 톤</span>
          </div>
          <${ColumnChart} rows=${stageChartRows} />
        </div>

        <div className="ivs-card">
          <div className="ivs-card-head-row">
            <h2 className="ivs-section-title">재공 재고 구성비</h2>
            <span className="ivs-section-hint">기준일 ${asOfDate} · 출하완료 제외</span>
          </div>
          <${DonutChart}
            rows=${stageDonutRows}
            centerValue=${fmtTon(snapshot.inProgress)} centerLabel="톤 재공"
            emptyMsg="기준일에 남아있는 재공 재고가 없어요."
          />
        </div>
      </div>

      <div className="ivs-half-grid">
        <div className="ivs-card">
          <div className="ivs-card-head-row">
            <h2 className="ivs-section-title">카테고리별 현재고</h2>
            <span className="ivs-section-hint">실시간 · 재공 중</span>
          </div>
          <${DonutChart}
            rows=${categoryLive.map((c) => ({ key: c.key, label: c.label, color: c.color, value: c.kg }))}
            centerLabel="톤 재공"
            emptyMsg="재공 중인 재고가 없어요."
          />
        </div>

        <div className="ivs-card">
          <div className="ivs-card-head-row">
            <h2 className="ivs-section-title">카테고리별 입고 순위 Top 7</h2>
            <span className="ivs-section-hint">선택 기간</span>
          </div>
          <${DonutChart}
            rows=${top7(categoryRank).map((r) => ({ key: r.key, label: r.label, color: r.color, value: r.kg }))}
            centerLabel="톤 · Top 7 합계"
            emptyMsg="선택한 기간에 입고된 로트가 없어요."
          />
        </div>
      </div>

      <div className="ivs-half-grid">
        <div className="ivs-card">
          <div className="ivs-card-head-row">
            <h2 className="ivs-section-title">품목별 입고 순위 Top 7</h2>
            <span className="ivs-section-hint">선택 기간</span>
          </div>
          <${DonutChart}
            rows=${top7(itemRank).map((r) => ({ key: r.key, label: r.label, color: r.color, value: r.kg }))}
            centerLabel="톤 · Top 7 합계"
            emptyMsg="선택한 기간에 입고된 로트가 없어요."
          />
        </div>

        <div className="ivs-card">
          <div className="ivs-card-head-row">
            <h2 className="ivs-section-title">거래처별 입고 순위 Top 7</h2>
            <span className="ivs-section-hint">선택 기간</span>
          </div>
          <${DonutChart}
            rows=${top7(vendorRank).map((r) => ({ key: r.key, label: r.label, color: r.color, value: r.kg }))}
            centerLabel="톤 · Top 7 합계"
            emptyMsg="선택한 기간에 입고된 로트가 없어요."
          />
        </div>
      </div>
    </div>
  `;
}

// ---------- 그래프 (외부 라이브러리 없이 SVG로 직접 그려요) ----------
// rows: [{ key, label, value, color }] — value는 Kg 기준
const chartTotal = (rows) => rows.reduce((a, r) => a + (Number(r.value) || 0), 0);
const pctText = (v, total) => (total > 0 ? `${((v / total) * 100).toFixed(1)}%` : "0%");

// 도넛: 비중이 한눈에 보이게. 가운데에는 합계를 크게 적어요.
function Donut({ rows, size = 176, thickness = 26, centerValue, centerLabel }) {
  const total = chartTotal(rows);
  const r = (size - thickness) / 2;
  const circ = 2 * Math.PI * r;
  const half = size / 2;
  let acc = 0;
  const slices = total > 0 ? rows.filter((row) => row.value > 0).map((row) => {
    const frac = row.value / total;
    const seg = html`<circle
      key=${row.key} cx=${half} cy=${half} r=${r} fill="none"
      stroke=${row.color} strokeWidth=${thickness}
      strokeDasharray=${`${circ * frac} ${circ * (1 - frac)}`}
      strokeDashoffset=${-circ * acc}
      transform=${`rotate(-90 ${half} ${half})`}
    ><title>${`${row.label} · ${fmtTon(row.value)} 톤 (${pctText(row.value, total)})`}</title></circle>`;
    acc += frac;
    return seg;
  }) : null;
  return html`
    <svg className="ivs-donut" width=${size} height=${size} viewBox=${`0 0 ${size} ${size}`} role="img">
      <circle cx=${half} cy=${half} r=${r} fill="none" stroke="var(--grid)" strokeWidth=${thickness} />
      ${slices}
      <text x=${half} y=${half - 4} textAnchor="middle" className="ivs-donut-value">${centerValue != null ? centerValue : fmtTon(total)}</text>
      <text x=${half} y=${half + 16} textAnchor="middle" className="ivs-donut-label">${centerLabel || "톤"}</text>
    </svg>
  `;
}

// 도넛 + 범례를 한 덩어리로. 값이 하나도 없으면 안내 문구만 보여줘요.
function DonutChart({ rows, centerValue, centerLabel, emptyMsg = "표시할 데이터가 없어요." }) {
  const total = chartTotal(rows);
  if (total <= 0) return html`<div className="ivs-prod-empty center">${emptyMsg}</div>`;
  const shown = rows.filter((r) => r.value > 0).sort((a, b) => b.value - a.value);
  return html`
    <div className="ivs-donut-wrap">
      <${Donut} rows=${shown} centerValue=${centerValue} centerLabel=${centerLabel} />
      <ul className="ivs-legend">
        ${shown.map((r) => html`
          <li className="ivs-legend-row" key=${r.key}>
            <span className="ivs-legend-dot" style=${{ background: r.color }} />
            <span className="ivs-legend-name">${r.label}</span>
            <span className="ivs-legend-pct">${pctText(r.value, total)}</span>
            <span className="ivs-legend-val">${fmtTon(r.value)} 톤</span>
          </li>
        `)}
      </ul>
    </div>
  `;
}

// 세로 막대: 순서(공정 흐름)가 중요한 값에 써요.
// 큰 회색 상자 대신, 옅은 눈금선 위에 가는 막대만 세워서 값 차이가 바로 읽히도록 했어요.
function ColumnChart({ rows, height = 168, valueLabel = "톤" }) {
  const max = Math.max(...rows.map((r) => Number(r.value) || 0), 0);
  if (max <= 0) return html`<div className="ivs-prod-empty center">표시할 데이터가 없어요.</div>`;
  return html`
    <div className="ivs-columns" style=${{ "--chart-h": `${height}px` }}>
      ${rows.map((r) => {
        const h = Math.max(1.5, (r.value / max) * 100);
        return html`
          <div className="ivs-column" key=${r.key} title=${`${r.label} · ${fmtTon(r.value)} ${valueLabel}`}>
            <div className="ivs-column-plot">
              <div className="ivs-column-bar" style=${{ height: `${h}%`, background: r.color }}>
                <span className="ivs-column-val">${fmtTon(r.value)}</span>
              </div>
            </div>
            <div className="ivs-column-labels">
              <div className="ivs-column-name"><span className="ivs-column-dot" style=${{ background: r.color }} />${r.label}</div>
              ${r.sub ? html`<div className="ivs-column-sub">${r.sub}</div>` : null}
            </div>
          </div>
        `;
      })}
    </div>
  `;
}

// ---------- QR 라벨 ----------
// qrcode-generator를 페이지에 인라인으로 실어두고 SVG 문자열을 만들어요 (외부 요청 없음 · 오프라인에서도 동작).
function qrSvg(text) {
  try {
    const qr = qrcode(0, "M"); // 0 = 데이터 길이에 맞춰 자동으로 버전 선택
    qr.addData(text);
    qr.make();
    // margin은 "조용한 영역(quiet zone)" — 4셀이 규격 권장값이고, 이게 없으면 라벨프린터 스캔이 잘 안 돼요.
    return qr.createSvgTag({ cellSize: 4, margin: 8, scalable: true });
  } catch (e) {
    return "";
  }
}

// QR에 담는 값 — 한글을 넣으면 글자당 3바이트라 QR이 커지고, 17mm 라벨에서는 스캔이 잘 안 돼요.
// 그래서 QR은 짧은 ASCII로 두고(휴대폰으로 찍어도 입고 Lot가 그대로 읽혀요), 한글 정보는 라벨에 글자로 인쇄해요.
function labelPayload(lot, manager, prodDate) {
  return `DRT|${lot.lotNo}|${lot.code}|${lot.qtyKg}kg|${lot.receivedDate}|${prodDate}`;
}

// 생산일: 마지막 공정이동일이 있으면 그 날, 아직 이동이 없으면 입고일을 그대로 써요.
const productionDate = (lot) => lot.lastMove || lot.receivedDate || "-";

const LABEL_SIZE = { w: 100, h: 100 }; // mm — 라벨 용지 규격. 프린터 라벨을 바꾸면 여기만 고치면 돼요.

function LabelModal({ lots, manager, onClose }) {
  // 라벨 모달이 열려있는 동안에만 인쇄 규칙을 끼워넣어요 (모달을 닫으면 원래대로 돌아가요).
  //  - 용지를 라벨 크기(50×30mm)로 바꾸고
  //  - 화면의 나머지(카드·표·필터)는 인쇄에서 통째로 빼서 라벨만 나가게 해요.
  useEffect(() => {
    const st = document.createElement("style");
    st.textContent = [
      "@media print {",
      `  @page { size: ${LABEL_SIZE.w}mm ${LABEL_SIZE.h}mm; margin: 0; }`,
      "  .ivs-root > *:not(.ivs-overlay) { display: none !important; }",
      "  .ivs-overlay { display: block !important; }",
      "}",
    ].join("\n");
    document.head.appendChild(st);
    return () => st.remove();
  }, []);

  const rows = lots || [];
  return html`
    <div className="ivs-overlay" onMouseDown=${overlayDown} onClick=${(e) => overlayClick(e, onClose)}>
      <div className="ivs-modal ivs-modal-lg" onClick=${(e) => e.stopPropagation()}>
        <div className="ivs-modal-head">
          <h3><${QrCode} size=${16} style=${{ verticalAlign: -3, marginRight: 6 }} /> QR 라벨 출력 · ${rows.length}건</h3>
          <button className="ivs-icon-btn" onClick=${onClose}><${X} size=${16} /></button>
        </div>
        <div className="ivs-modal-body">
          <div className="ivs-label-toolbar ivs-print-hide">
            <button className="ivs-btn ivs-btn-primary" onClick=${() => window.print()}>
              <${Printer} size=${13} /> 인쇄 (라벨 1장씩)
            </button>
            <span className="ivs-section-hint">
              용지 ${LABEL_SIZE.w} × ${LABEL_SIZE.h} mm · 라벨 1장이 1페이지로 나가요.
              프린터 설정에서 배율은 "실제 크기(100%)", 여백은 "없음"으로 두세요.
            </span>
          </div>
          <div className="ivs-label-sheet">
            ${rows.map((l) => {
              const prod = productionDate(l);
              return html`
                <div className="ivs-label" key=${l.id}>
                  <div className="ivs-label-top">
                    <div className="ivs-label-lot">${l.lotNo}</div>
                    <div className="ivs-label-name">${l.name}</div>
                  </div>
                  <div className="ivs-label-kg">${Number(l.qtyKg).toLocaleString("ko-KR", { maximumFractionDigits: 1 })}<em>kg</em></div>
                  <div className="ivs-label-qr" dangerouslySetInnerHTML=${{ __html: qrSvg(labelPayload(l, manager, prod)) }} />
                  <div className="ivs-label-meta">
                    <div><span>품목</span><b>${l.code}</b></div>
                    <div><span>입고</span><b>${l.receivedDate}</b></div>
                    <div><span>생산</span><b>${prod}</b></div>
                    <div><span>담당</span><b>${manager}</b></div>
                  </div>
                </div>
              `;
            })}
          </div>
        </div>
        <div className="ivs-modal-foot">
          <button className="ivs-btn" onClick=${onClose}>닫기</button>
        </div>
      </div>
    </div>
  `;
}

function ConfirmModal({ icon, title, body, confirmLabel, danger, onCancel, onConfirm }) {
  return html`
    <div className="ivs-overlay" onMouseDown=${overlayDown} onClick=${(e) => overlayClick(e, onCancel)}>
      <div className="ivs-modal ivs-modal-sm" onClick=${(e) => e.stopPropagation()}>
        <div className="ivs-modal-body ivs-confirm-body">
          <div className=${`ivs-confirm-icon ${danger ? "danger" : ""}`}>${icon}</div>
          <div>
            <h3 className="ivs-confirm-title">${title}</h3>
            <p className="ivs-dim">${body}</p>
          </div>
        </div>
        <div className="ivs-modal-foot">
          <button className="ivs-btn" onClick=${onCancel}>취소</button>
          <button className=${`ivs-btn ${danger ? "ivs-btn-danger" : "ivs-btn-primary"}`} onClick=${onConfirm}>${confirmLabel}</button>
        </div>
      </div>
    </div>
  `;
}

// ---------- 마운트 ----------
// 렌더 전에 Firebase에서 한 번 읽어와 LIVE_DATA를 채워요. 그래야 InventorySystem이 처음
// 렌더될 때부터 올바른 초기값(잠금 여부 포함)을 가지고 시작하고, 그 다음부터는 실시간 구독이 이어받아요.
(async function bootstrap() {
  const rootEl = document.getElementById("ivs-app-root");
  if (PREVIEW_MODE) {
    // 샘플 화면 — 실제 팀 데이터(Firebase)는 읽지도 쓰지도 않아요. 잠금 PIN도 없이 바로 보여줘요.
    LIVE_DATA = normalizeLive({
      lots: seedData(), moves: moveSeedData(), master: {},
      settings: { title: "DRT · 재고관리", subtitle: "로트 단위 공정 이동 관리", editPin: "", viewPin: "" },
    });
  } else {
    LIVE_DATA = (await fetchLive()) || FALLBACK_DATA;
  }
  ReactDOM.createRoot(rootEl).render(html`<${InventorySystem} />`);
})();
</script>
</body>
</html>

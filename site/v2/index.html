<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRT_ 재고관리</title>
<style>
  /* ============================================================
     DRT 재고관리 (2안) — 디자인 토큰
     .ivs-root[data-theme="dark"|"light"] 두 벌을 모두 정의해요.
     모든 색은 토큰으로만 쓰고, 특정 테마 안에서만 정의되는 색은 두지 않아요.
     ============================================================ */
  .ivs-root[data-theme="dark"] {
    --bg: #0B0E14;
    --surface: #131823;
    --surface-2: #1A2130;
    --surface-3: #222B3C;
    --border: #253044;
    --border-strong: #35415A;
    --text: #E9EEF6;
    --text-dim: #93A3BC;
    --text-faint: #6B7B94;
    --accent: #E8A34A;
    --accent-soft: rgba(232,163,74,0.14);
    --accent-ink: #1A1206;
    --good: #3DD68C;
    --good-soft: rgba(61,214,140,0.14);
    --bad: #F2685F;
    --bad-soft: rgba(242,104,95,0.14);
    --warn: #F2C46D;
    --info: #6EA8FF;
    --grid: rgba(255,255,255,0.05);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.35);
    --shadow: 0 2px 4px rgba(0,0,0,0.30), 0 12px 28px rgba(0,0,0,0.28);
    --zebra: rgba(255,255,255,0.018);
  }
  .ivs-root[data-theme="light"] {
    --bg: #F3F6FA;
    --surface: #FFFFFF;
    --surface-2: #F7F9FC;
    --surface-3: #EDF1F7;
    --border: #E2E8F1;
    --border-strong: #C6D0DF;
    --text: #101725;
    --text-dim: #5A6B85;
    --text-faint: #8494AC;
    --accent: #C97E23;
    --accent-soft: rgba(201,126,35,0.12);
    --accent-ink: #FFFFFF;
    --good: #12A46A;
    --good-soft: rgba(18,164,106,0.12);
    --bad: #D24A41;
    --bad-soft: rgba(210,74,65,0.12);
    --warn: #B77F16;
    --info: #2C6FD1;
    --grid: rgba(16,23,37,0.05);
    --shadow-sm: 0 1px 2px rgba(16,23,37,0.06);
    --shadow: 0 1px 3px rgba(16,23,37,0.07), 0 12px 28px rgba(16,23,37,0.07);
    --zebra: rgba(16,23,37,0.016);
  }

  .ivs-root {
    --radius: 12px;
    --radius-sm: 8px;
    background: var(--bg); color: var(--text); min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    padding: 0; position: relative; box-sizing: border-box;
    font-size: 14px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .ivs-root * { box-sizing: border-box; }
  body { margin: 0; background: #0B0E14; }
  .ivs-num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
  .ivs-mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
  .ivs-dim { color: var(--text-dim); }
  .ivs-right { text-align: right; }

  /* ---------- 상단 헤더 ---------- */
  .ivs-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .ivs-title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ivs-title { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
  .ivs-subtitle { color: var(--text-dim); font-size: 13px; margin: 5px 0 0; }
  .ivs-header-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .ivs-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500;
    padding: 3px 9px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
  .ivs-chip.ok { color: var(--good); background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 30%, transparent); }
  .ivs-chip.bad { color: var(--bad); background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
  .ivs-chip.neutral { color: var(--text-dim); background: var(--surface-2); border-color: var(--border); }
  .ivs-chip.accent { color: var(--accent); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .ivs-saving { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-dim); }

  /* ---------- 버튼 ---------- */
  .ivs-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); color: var(--text);
    border: 1px solid var(--border); padding: 8px 13px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500;
    cursor: pointer; white-space: nowrap; transition: border-color .12s ease, background .12s ease; box-shadow: var(--shadow-sm); }
  .ivs-btn:hover { border-color: var(--border-strong); background: var(--surface-2); }
  .ivs-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .ivs-btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .ivs-btn-primary:hover { background: var(--accent); filter: brightness(1.06); border-color: var(--accent); }
  .ivs-btn-danger { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 35%, transparent); color: var(--bad); }
  .ivs-btn-danger:hover { background: var(--bad-soft); border-color: var(--bad); }
  .ivs-btn:disabled { opacity: .45; cursor: not-allowed; }
  .ivs-btn-sm { padding: 5px 9px; font-size: 12px; }
  .ivs-icon-btn { background: none; border: 1px solid transparent; color: var(--text-dim); cursor: pointer;
    padding: 6px; border-radius: var(--radius-sm); display: inline-flex; align-items: center; justify-content: center; }
  .ivs-icon-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--border); }
  .ivs-menu-danger { color: var(--bad) !important; }

  /* ---------- 탭 ---------- */
  .ivs-tabs { display: flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--border);
    padding: 4px; border-radius: 10px; margin-bottom: 20px; width: fit-content; max-width: 100%; overflow-x: auto; }
  .ivs-tab { background: none; border: none; color: var(--text-dim); padding: 8px 16px; font-size: 13.5px; font-weight: 500;
    cursor: pointer; border-radius: 7px; white-space: nowrap; transition: background .12s ease, color .12s ease; }
  .ivs-tab:hover { color: var(--text); }
  .ivs-tab.active { color: var(--text); background: var(--surface); box-shadow: var(--shadow-sm); font-weight: 600; }

  /* ---------- 섹션 / 카드 ---------- */
  .ivs-half-grid { margin-bottom: 14px; }
  .ivs-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
  .ivs-section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .ivs-section-title { font-size: 14px; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
  .ivs-section-hint { font-size: 12px; color: var(--text-faint); font-weight: 400; }
  .ivs-card-label { font-size: 12.5px; color: var(--text-dim); margin-bottom: 16px; }

  /* ---------- KPI 카드 ---------- */
  .ivs-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  .ivs-kpis.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .ivs-kpis.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .ivs-kpis.cols-5 { grid-template-columns: repeat(5, 1fr); }
  .ivs-kpi-bm { color: var(--accent); font-weight: 600; }
  .ivs-kpis.cols-5 { grid-template-columns: repeat(5, 1fr); }
  .ivs-kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 15px 16px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden; }
  .ivs-kpi.accent::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--accent); }
  .ivs-kpi-label { font-size: 12.5px; font-weight: 700; color: var(--text-dim); margin-bottom: 9px;
    display: flex; align-items: center; gap: 5px; letter-spacing: -0.01em; }
  .ivs-kpi-value { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .ivs-kpi-value em { font-size: 13px; font-weight: 500; color: var(--text-dim); font-style: normal; margin-left: 3px; }
  .ivs-kpi-sub { font-size: 11.5px; color: var(--text-faint); margin-top: 6px; }
  .ivs-delta { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600;
    padding: 2px 7px; border-radius: 999px; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .ivs-delta.up { color: var(--good); background: var(--good-soft); }
  .ivs-delta.down { color: var(--bad); background: var(--bad-soft); }
  .ivs-delta.flat { color: var(--text-dim); background: var(--surface-2); }
  .ivs-delta span { font-weight: 400; color: var(--text-faint); }

  /* ---------- 공정 파이프라인 ---------- */
  .ivs-pipe { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding-bottom: 6px; }
  .ivs-pipe-card { flex: 1 1 0; min-width: 132px; text-align: left; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 13px 13px; cursor: pointer;
    display: flex; flex-direction: column; gap: 7px; position: relative; overflow: hidden; font: inherit; color: inherit;
    transition: border-color .12s ease, transform .12s ease, background .12s ease; }
  .ivs-pipe-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--c); opacity: .85; }
  .ivs-pipe-card:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  .ivs-pipe-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ivs-pipe-card.selected { background: var(--surface-3); border-color: var(--c); }
  .ivs-pipe-card.empty { opacity: .62; }
  .ivs-pipe-name { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); font-weight: 500; }
  .ivs-pipe-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
  .ivs-pipe-val { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .ivs-pipe-val em { font-size: 11.5px; font-weight: 500; color: var(--text-dim); font-style: normal; margin-left: 2px; }
  .ivs-pipe-sub { font-size: 11.5px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .ivs-pipe .ivs-delta { margin-top: 1px; align-self: flex-start; font-size: 11px; padding: 1px 6px; gap: 3px; }
  .ivs-pipe .ivs-delta span { font-size: 10px; }
  .ivs-pipe-bar { height: 3px; border-radius: 999px; background: var(--grid); overflow: hidden; }
  .ivs-pipe-bar i { display: block; height: 100%; border-radius: 999px; background: var(--c); }
  .ivs-pipe-flag { font-size: 10px; font-weight: 700; color: var(--accent); background: var(--accent-soft);
    padding: 1px 5px; border-radius: 4px; letter-spacing: .02em; }
  .ivs-pipe-sep { flex: 0 0 14px; display: flex; align-items: center; justify-content: center; color: var(--text-faint); font-size: 15px; user-select: none; }

  /* ---------- 필터 바 ---------- */
  .ivs-filterbar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 13px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
  .ivs-search { position: relative; margin-bottom: 11px; }
  .ivs-search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-faint); pointer-events: none; }
  .ivs-search-input.ivs-search-input { width: 100%; padding-left: 36px; }
  .ivs-filter-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .ivs-daterange { display: flex; align-items: center; gap: 6px; }
  .ivs-tilde { color: var(--text-faint); }
  .ivs-spacer { flex: 1; }

  .ivs-input, .ivs-select { background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: var(--radius-sm); padding: 8px 11px; font-size: 13px; font-family: inherit; }
  .ivs-input::placeholder { color: var(--text-faint); }
  .ivs-input:focus, .ivs-select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .ivs-select-full { width: 100%; }
  .ivs-checkbox-label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-dim); cursor: pointer; white-space: nowrap; }
  .ivs-checkbox-label input { accent-color: var(--accent); }

  .ivs-bulkbar { display: flex; align-items: center; gap: 10px; background: var(--accent-soft);
    border: 1px solid color-mix(in srgb, var(--accent) 32%, transparent); border-radius: var(--radius-sm);
    padding: 9px 13px; margin-bottom: 12px; font-size: 13px; flex-wrap: wrap; }

  /* ---------- 표 ---------- */
  .ivs-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); box-shadow: var(--shadow-sm); }
  .ivs-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; min-width: 1080px; }
  .ivs-table th { text-align: left; color: var(--text-dim); font-weight: 650; font-size: 13px;
    letter-spacing: 0; text-transform: none; padding: 11px 12px; background: var(--surface-2);
    border-bottom: 1px solid var(--border); white-space: nowrap; position: sticky; top: 0; z-index: 2; }
  .ivs-table td { padding: 11px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .ivs-table tbody tr:nth-child(even) { background: var(--zebra); }
  .ivs-table tbody tr:hover { background: var(--surface-2); }
  .ivs-table tbody tr:last-child td { border-bottom: none; }
  .ivs-th-check, .ivs-th-actions { width: 38px; }
  .ivs-th-sort { background: none; border: none; color: inherit; font: inherit; display: inline-flex;
    align-items: center; gap: 4px; cursor: pointer; padding: 0; }
  .ivs-table th.ivs-right { text-align: right; }
  .ivs-table th.ivs-right .ivs-th-sort { display: flex; width: 100%; justify-content: flex-end; }
  .ivs-th-sort:hover { color: var(--text); }
  .ivs-th-sort.active { color: var(--text); }
  .ivs-arrow-up { transform: rotate(180deg); }
  .ivs-empty { text-align: center; color: var(--text-dim); padding: 44px 0 !important; white-space: normal; }
  .ivs-tablefoot { font-size: 12px; color: var(--text-faint); margin-top: 10px; }
  @media (max-width: 900px) { .ivs-hide-sm { display: none; } }

  .ivs-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 500;
    padding: 3px 9px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--c) 40%, transparent);
    color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); white-space: nowrap; }
  .ivs-root[data-theme="light"] .ivs-badge { color: color-mix(in srgb, var(--c) 72%, #0B1220);
    background: color-mix(in srgb, var(--c) 17%, #FFFFFF); border-color: color-mix(in srgb, var(--c) 46%, #FFFFFF); }
  .ivs-badge-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
  .ivs-badge-warn { border-color: color-mix(in srgb, var(--accent) 45%, transparent); color: var(--accent);
    background: var(--accent-soft); margin-left: 5px; font-size: 11px; padding: 2px 7px; border-radius: 999px; border-width: 1px; border-style: solid; }

  .ivs-row-menu-cell { position: relative; }
  .ivs-menu { position: absolute; right: 8px; top: 34px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; z-index: 20; min-width: 156px; box-shadow: var(--shadow); padding: 4px; }
  .ivs-menu button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none;
    border: none; color: var(--text); font-size: 13px; font-family: inherit; padding: 8px 10px; cursor: pointer; border-radius: 6px; }
  .ivs-menu button:hover { background: var(--surface-2); }

  /* ---------- 모달 ---------- */
  .ivs-overlay { position: fixed; inset: 0; background: rgba(6,9,15,0.62); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 18px; }
  .ivs-modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; width: 100%;
    max-width: 500px; max-height: 88vh; display: flex; flex-direction: column; box-shadow: var(--shadow); }
  .ivs-modal-sm { max-width: 390px; }
  .ivs-modal-lg { max-width: 760px; }
  /* 표가 들어가는 창은 더 넓게 — 가로로 잘려서 스크롤하지 않아도 되게. */
  .ivs-modal-xl { max-width: 1100px; }
  .ivs-import-st { width: 170px; }
  .ivs-import-st + td, td.ivs-import-st { white-space: normal; }
  .ivs-modal-xl .ivs-table th, .ivs-modal-xl .ivs-table td { padding-left: 9px; padding-right: 9px; }
  .ivs-modal-head { display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 16px 18px; border-bottom: 1px solid var(--border); }
  .ivs-modal-head h3 { margin: 0; font-size: 15px; font-weight: 650; }
  .ivs-modal-body { padding: 18px; overflow-y: auto; }
  .ivs-modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 13px 18px; border-top: 1px solid var(--border); }
  .ivs-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
  .ivs-form-checks { grid-column: 1 / -1; display: flex; gap: 18px; margin-top: 2px; }
  .ivs-field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--text-dim); }
  .ivs-field input, .ivs-field select { width: 100%; }
  /* .ivs-input / .ivs-select 클래스를 빠뜨려도 라벨 안의 입력칸은 같은 모양이 되도록 —
     안 그러면 다크 모드에서 브라우저 기본 흰 배경이 그대로 나와서 눈에 확 튀어요. */
  .ivs-field > input, .ivs-field > select, .ivs-field > textarea {
    box-sizing: border-box; background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); border-radius: var(--radius-sm); padding: 8px 11px;
    font-size: 13px; font-family: inherit; }
  .ivs-field > input::placeholder { color: var(--text-faint); }
  .ivs-field > input:focus, .ivs-field > select:focus {
    outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .ivs-input-auto { background: var(--surface-3); color: var(--text-dim); cursor: default; }
  .ivs-settings-divider { height: 1px; background: var(--border); margin: 3px 0; }

  /* 이동 흐름: 현재 단계 → 고른 단계 */
  .ivs-move-flow { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 12px; }
  .ivs-move-arrow { color: var(--text-faint); font-size: 15px; }
  .ivs-move-placeholder { font-size: 12.5px; color: var(--text-faint); border: 1px dashed var(--border-strong);
    padding: 3px 10px; border-radius: 999px; }

  .ivs-stage-picker { display: flex; flex-wrap: wrap; gap: 7px; }
  .ivs-stage-pick { display: inline-flex; align-items: center; gap: 5px;
    border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); color: var(--c); background: transparent;
    padding: 7px 12px; border-radius: 999px; font-size: 12.5px; font-family: inherit; cursor: pointer;
    transition: background .12s ease, box-shadow .12s ease; }
  .ivs-stage-pick:hover { background: color-mix(in srgb, var(--c) 14%, transparent); }
  .ivs-stage-pick:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* 고른 단계 — 색을 꽉 채우고 체크까지 붙여서 한눈에 보이게. 글자는 어느 테마에서든 진한 잉크로 고정해요. */
  .ivs-stage-pick.active { background: var(--c); color: #0B1119; font-weight: 700; border-color: var(--c);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 30%, transparent); }
  .ivs-stage-pick.active:hover { background: var(--c); }
  /* 지금 있는 단계 — 고를 수 없어요 (같은 단계로는 이동하지 않으니까요) */
  .ivs-stage-pick.current { opacity: .4; cursor: not-allowed; }
  .ivs-stage-pick.current:hover { background: transparent; }
  .ivs-move-diff { font-size: 12.5px; margin-top: 10px; padding: 7px 11px; border-radius: var(--radius-sm); }
  .ivs-move-diff.loss { color: var(--bad); background: var(--bad-soft); }
  .ivs-move-diff.mix { color: var(--good); background: var(--good-soft); }

  .ivs-confirm-body { display: flex; gap: 13px; align-items: flex-start; }
  .ivs-confirm-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0; background: var(--surface-2); color: var(--text-dim); }
  .ivs-confirm-icon.danger { color: var(--bad); background: var(--bad-soft); }
  .ivs-confirm-title { margin: 0 0 5px; font-size: 14.5px; font-weight: 650; }

  .ivs-master-form { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .ivs-master-form .ivs-input { flex: 1; min-width: 140px; }
  .ivs-master-list { border: 1px solid var(--border); border-radius: var(--radius-sm); max-height: 250px; overflow-y: auto; }
  .ivs-master-row { display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 10px 13px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .ivs-master-row:last-child { border-bottom: none; }

  /* ---------- 잠금 화면 ---------- */
  .ivs-viewgate { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .ivs-lock-screen { max-width: 360px; padding: 42px 30px 34px; display: flex; flex-direction: column;
    align-items: center; text-align: center; position: relative; }
  .ivs-lock-close { position: absolute; top: 13px; right: 13px; }
  .ivs-lock-icon { width: 54px; height: 54px; border-radius: 14px; background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
  .ivs-lock-title { margin: 0 0 7px; font-size: 18px; font-weight: 650; }
  .ivs-lock-input { width: 100%; text-align: center; letter-spacing: 7px; font-size: 17px; padding: 13px; }
  .ivs-lock-input::placeholder { letter-spacing: 4px; }
  .ivs-lock-submit { width: 100%; margin-top: 15px; justify-content: center; padding: 11px; }

  /* ---------- 토스트 ---------- */
  .ivs-toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 12px 16px; border-radius: 10px; font-size: 13px; display: flex; align-items: center;
    gap: 8px; box-shadow: var(--shadow); z-index: 60; max-width: 380px; }
  .ivs-toast-success { border-color: color-mix(in srgb, var(--good) 40%, transparent); color: var(--good); }
  .ivs-toast-error { border-color: color-mix(in srgb, var(--bad) 40%, transparent); color: var(--bad); }

  /* ---------- 생산 탭 ---------- */
  .ivs-prod-desc { color: var(--text-dim); font-size: 13px; line-height: 1.6; margin: 0 0 16px; }
  .ivs-prod-report-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
  .ivs-prod-report-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .ivs-prod-listlabel { font-size: 12px; color: var(--text-dim); margin: 16px 0 7px; font-weight: 500; }
  .ivs-prod-list { max-height: 170px; overflow-y: auto; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .ivs-prod-row { display: flex; align-items: flex-start; gap: 8px; }
  .ivs-prod-row { padding: 8px 13px; font-size: 12.5px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    border-bottom: 1px solid var(--border); }
  .ivs-prod-row:last-child { border-bottom: none; }
  .ivs-prod-empty { padding: 22px; text-align: center; color: var(--text-faint); font-size: 13px; }
  .ivs-prod-empty.center { padding: 36px 0; }
  .ivs-prod-tag { font-size: 11px; padding: 2px 7px; border-radius: 999px; margin-left: 7px; }
  .ivs-prod-tag.loss { background: var(--bad-soft); color: var(--bad); }
  .ivs-prod-tag.mix { background: var(--good-soft); color: var(--good); }
  .ivs-prod-periodbar { display: flex; align-items: center; gap: 8px; margin: 18px 0 13px; flex-wrap: wrap; }
  .ivs-yield-table { min-width: 0; }

  /* ---------- 집계(대시보드) ---------- */
  .ivs-dash-note { font-size: 12px; color: var(--text-faint); line-height: 1.6; margin: 0 0 16px; }
  .ivs-breakdown { display: flex; flex-direction: column; gap: 2px; }
  .ivs-breakdown-row { display: grid; grid-template-columns: 150px 1fr 128px; align-items: center; gap: 14px;
    padding: 10px 12px; border-radius: var(--radius-sm); }
  .ivs-breakdown-row:hover { background: var(--surface-2); }
  .ivs-breakdown-name { display: flex; align-items: center; gap: 7px; font-size: 12.5px; }
  .ivs-breakdown-track { height: 8px; border-radius: 999px; background: var(--grid); overflow: hidden; }
  .ivs-breakdown-fill { height: 100%; border-radius: 999px; background: var(--c); min-width: 2px; }
  .ivs-breakdown-val { text-align: right; font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .ivs-breakdown-val small { display: block; font-size: 11px; color: var(--text-faint); font-weight: 400; }
  .ivs-final-badge { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: var(--good-soft); color: var(--good); margin-left: 6px; }

  .ivs-collapse-head { width: 100%; display: flex; justify-content: space-between; align-items: center;
    background: none; border: none; color: var(--text); cursor: pointer; padding: 0; margin-bottom: 16px; font: inherit; }
  .ivs-collapse-chevron { transition: transform .15s ease; color: var(--text-faint); flex-shrink: 0; }
  .ivs-collapse-chevron.closed { transform: rotate(-90deg); }

  .ivs-rank-list { display: flex; flex-direction: column; gap: 3px; }
  .ivs-rank-row { display: grid; grid-template-columns: minmax(140px, 1.4fr) 1fr 150px; align-items: center;
    gap: 14px; padding: 9px 12px; border-radius: var(--radius-sm); }
  .ivs-rank-row:hover { background: var(--surface-2); }
  .ivs-rank-left { display: flex; align-items: center; gap: 7px; font-size: 12.5px; min-width: 0; }
  .ivs-rank-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .ivs-rank-label { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ivs-rank-count { color: var(--text-faint); white-space: nowrap; font-size: 11.5px; }
  .ivs-rank-bar-track { height: 8px; border-radius: 999px; background: var(--grid); overflow: hidden; }
  .ivs-rank-bar-fill { height: 100%; border-radius: 999px; }
  .ivs-rank-value { font-size: 13px; font-weight: 650; text-align: right; font-variant-numeric: tabular-nums; }
  .ivs-rank-net { display: block; font-size: 11px; font-weight: 400; color: var(--text-faint); }

  .ivs-agg-list { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
  .ivs-agg-row { display: flex; justify-content: space-between; align-items: center; padding: 13px 15px;
    border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px; }
  .ivs-agg-row:last-child { border-bottom: none; }
  .ivs-agg-row:hover { background: var(--surface-2); }
  .ivs-agg-name { font-size: 13px; font-weight: 600; }
  .ivs-agg-pair { display: flex; gap: 30px; }
  .ivs-agg-stat { text-align: right; }
  .ivs-agg-stat span { display: block; font-size: 14.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ivs-agg-stat small { font-size: 11px; color: var(--text-faint); }
  .ivs-card-head-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
  .ivs-card-head-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  .ivs-loading { display: flex; align-items: center; gap: 9px; justify-content: center; padding: 64px 0; color: var(--text-dim); }
  .ivs-spin { animation: ivs-spin .8s linear infinite; }
  @keyframes ivs-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .ivs-spin { animation: none; } .ivs-pipe-card:hover { transform: none; } }

  /* ---------- 미리보기 배너 ---------- */
  .ivs-preview-banner { display: flex; align-items: center; gap: 8px; background: var(--accent-soft);
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); color: var(--accent);
    padding: 10px 14px; border-radius: var(--radius-sm); font-size: 12.5px; margin-bottom: 16px; }

  /* ---------- QR 라벨 ---------- */
  .ivs-label-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .ivs-label-sheet { display: flex; flex-wrap: wrap; gap: 12px; }
  /* 라벨 규격은 여기 두 줄만 바꾸면 화면·인쇄가 함께 따라와요 (@page 크기도 이 값을 읽어요). */
  .ivs-label {
    --lw: 100mm; --lh: 100mm;
    width: var(--lw); height: var(--lh); background: #FFFFFF; color: #000000;
    border: 1px solid #C9CFDA; border-radius: 3px; padding: 5mm 5.5mm;
    display: flex; flex-direction: column; gap: 2.5mm;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    box-sizing: border-box; overflow: hidden;
  }
  .ivs-label-top { border-bottom: 0.45mm solid #111111; padding-bottom: 2.2mm; }
  .ivs-label-lot { font-size: 7.6mm; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ivs-label-name { font-size: 4.4mm; font-weight: 600; line-height: 1.2; margin-top: 1mm; color: #1B2029;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ivs-label-kg { font-size: 11mm; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em; }
  .ivs-label-kg em { font-size: 5mm; font-weight: 600; font-style: normal; margin-left: 1.5mm; }
  .ivs-label-qr { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .ivs-label-qr svg { display: block; width: 42mm; height: 42mm; }
  .ivs-label-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4mm 4mm;
    border-top: 0.3mm solid #C3CAD6; padding-top: 2.6mm; font-size: 3.2mm; line-height: 1.3; }
  .ivs-label-meta > div { display: flex; gap: 1.6mm; min-width: 0; white-space: nowrap; }
  .ivs-label-meta span { color: #5A6270; flex-shrink: 0; }
  .ivs-label-meta b { font-weight: 700; color: #000000; overflow: hidden; text-overflow: ellipsis; }

  @media print {
    body { background: #FFFFFF !important; }
    .ivs-root { padding: 0 !important; background: #FFFFFF !important; min-height: 0 !important; }
    .ivs-print-hide, .ivs-tabs, .ivs-header, .ivs-qrbar, .ivs-overlay > .ivs-modal > .ivs-modal-head,
    .ivs-overlay > .ivs-modal > .ivs-modal-foot, .ivs-label-toolbar, .ivs-toast { display: none !important; }
    .ivs-overlay { position: static !important; padding: 0 !important; background: none !important;
      backdrop-filter: none !important; display: block !important; }
    .ivs-modal { max-width: none !important; max-height: none !important; border: none !important;
      box-shadow: none !important; background: #FFFFFF !important; border-radius: 0 !important; }
    .ivs-modal-body { padding: 0 !important; overflow: visible !important; }
    .ivs-label-sheet { gap: 0 !important; }
    .ivs-label { border: none !important; border-radius: 0 !important; break-inside: avoid; page-break-inside: avoid; }
    .ivs-label + .ivs-label { break-before: page; page-break-before: always; }
  }

  /* ---------- QR 라벨 선택 바 ---------- */
  .ivs-qrbar { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: var(--radius); padding: 12px 15px; margin-bottom: 12px; box-shadow: var(--shadow-sm); }
  .ivs-qrbar-main { display: flex; align-items: flex-start; gap: 11px; min-width: 0; }
  .ivs-qrbar-icon { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px;
    border-radius: 8px; background: var(--accent-soft); color: var(--accent); flex-shrink: 0; }
  .ivs-qrbar-title { font-size: 13.5px; font-weight: 650; margin-bottom: 2px; }
  .ivs-qrbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  /* ---------- 그래프 ---------- */
  .ivs-chart-label { font-size: 12px; color: var(--text-dim); font-weight: 550; margin-bottom: 12px; }
  /* 카드 두 장을 절반씩 나란히 */
  .ivs-half-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  .ivs-half-grid > .ivs-card { margin-bottom: 0; height: 100%; }
  .ivs-chart-split { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 26px; align-items: start; }

  .ivs-donut-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .ivs-donut { flex-shrink: 0; }
  .ivs-donut-value { font-size: 21px; font-weight: 700; fill: var(--text); font-variant-numeric: tabular-nums; }
  .ivs-donut-label { font-size: 10px; fill: var(--text-faint); }
  .ivs-legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px;
    min-width: 190px; max-width: 360px; flex: 1 1 190px; }
  .ivs-legend-row { display: grid; grid-template-columns: 9px minmax(0, 1fr) auto auto; align-items: center;
    gap: 8px; font-size: 12px; }
  .ivs-legend-dot { width: 9px; height: 9px; border-radius: 3px; }
  .ivs-legend-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-dim); }
  .ivs-legend-pct { font-weight: 650; font-variant-numeric: tabular-nums; }
  .ivs-legend-val { color: var(--text-faint); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .ivs-columns { display: flex; align-items: flex-end; gap: 4px; padding-top: 22px; }
  .ivs-column { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 9px; }
  .ivs-column-plot { width: 100%; height: var(--chart-h, 168px); display: flex; align-items: flex-end; justify-content: center;
    border-bottom: 1px solid var(--border-strong);
    background-image: repeating-linear-gradient(to top, var(--grid) 0 1px, transparent 1px 25%); }
  .ivs-column-bar { position: relative; width: 100%; max-width: 42px; min-height: 3px;
    border-radius: 5px 5px 0 0; transition: height .25s ease; }
  .ivs-column-val { position: absolute; left: 50%; bottom: calc(100% + 5px); transform: translateX(-50%);
    font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--text); }
  .ivs-column-labels { min-height: 32px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .ivs-column-name { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--text-dim);
    text-align: center; line-height: 1.25; }
  .ivs-column-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .ivs-column-sub { font-size: 10px; color: var(--accent); font-weight: 650; }

  .ivs-aggbars { display: flex; flex-direction: column; gap: 3px; }
  .ivs-aggbars-legend { display: flex; gap: 16px; font-size: 11.5px; color: var(--text-faint); margin-bottom: 8px; }
  .ivs-aggbars-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .ivs-legend-swatch { width: 11px; height: 8px; border-radius: 2px; display: inline-block; }
  /* 차트 아래에 한 줄로 놓는 범례 (도넛 옆에 세로로 세우는 .ivs-legend와는 쓰임이 달라요) */
  .ivs-legend.row, .ivs-card > .ivs-legend, .ivs-trend .ivs-legend, .ivs-wchart ~ .ivs-legend,
  .ivs-mchart .ivs-legend, div > .ivs-legend:not(.ivs-donut-wrap .ivs-legend) {
    flex-direction: row; flex-wrap: wrap; align-items: center; gap: 6px 16px; }
  .ivs-legend:not(.ivs-donut-wrap .ivs-legend) .ivs-legend-row {
    display: inline-flex; grid-template-columns: none; gap: 6px; font-size: 11.5px; color: var(--text-dim); }
  .ivs-legend-swatch.soft { opacity: .3; }
  .ivs-aggbar-row { display: grid; grid-template-columns: minmax(120px, 1.3fr) 1fr 132px; align-items: center;
    gap: 14px; padding: 7px 8px; border-radius: var(--radius-sm); }
  .ivs-aggbar-row:hover { background: var(--surface-2); }
  .ivs-aggbar-name { font-size: 12.5px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ivs-aggbar-track { position: relative; height: 14px; background: var(--grid); border-radius: 999px; }
  .ivs-aggbar-in { position: absolute; inset: 0 auto 0 0; border-radius: 999px; opacity: .3; min-width: 2px; }
  .ivs-aggbar-prog { position: absolute; inset: 0 auto 0 0; border-radius: 999px; }
  .ivs-aggbar-val { text-align: right; font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .ivs-aggbar-val small { display: block; font-size: 11px; color: var(--text-faint); font-weight: 400; }

  /* ---------- 여러 건 공정이동 ---------- */
  .ivs-qty-cell { width: 96px; text-align: right; padding: 5px 8px; font-size: 12.5px; }
  .ivs-qty-cell.bad { border-color: var(--bad); outline: 1px solid var(--bad); }
  .ivs-diff-loss { color: var(--bad); }
  .ivs-diff-mix { color: var(--good); }
  .ivs-bulk-sum { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; margin-top: 12px;
    padding: 11px 14px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .ivs-bulk-sum b { font-weight: 700; }

  /* ---------- 생산 이력 선택 삭제 ---------- */
  .ivs-prod-listhead { display: flex; justify-content: space-between; align-items: center;
    gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .ivs-prod-listactions { display: flex; gap: 7px; flex-wrap: wrap; }
  .ivs-prod-check { flex-shrink: 0; margin-right: 2px; }
  .ivs-prod-row.picked { background: var(--accent-soft);
    box-shadow: inset 3px 0 0 var(--accent); }

  /* ---------- 파일로 한 번에 추가 ---------- */
  .ivs-import-drop { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 14px; border: 1px dashed var(--border-strong); border-radius: var(--radius-sm);
    background: var(--surface-2); margin-bottom: 14px; }
  /* 파일 고르기 — 숨긴 input + label 조합은 브라우저마다 동작이 달라서, 그냥 보이는 입력칸으로 뒀어요. */
  .ivs-import-input { flex: 1 1 260px; min-width: 220px; background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 12.5px;
    font-family: inherit; cursor: pointer; }
  .ivs-import-input::file-selector-button { background: var(--accent); color: var(--accent-ink); border: none;
    border-radius: 6px; padding: 6px 12px; margin-right: 10px; font-weight: 650; font-size: 12.5px;
    font-family: inherit; cursor: pointer; }
  .ivs-import-sum { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .ivs-row-bad td { background: color-mix(in srgb, var(--bad) 8%, transparent); }
  .ivs-row-bad .ivs-chip.bad { white-space: normal; }

  /* ---------- 화면 배치 A : 왼쪽 사이드바 ---------- */
  .ivs-layout-sidebar { display: flex; padding: 0; align-items: stretch; }
  .ivs-layout-sidebar .ivs-shell { flex: 1; min-width: 0; padding: 22px 24px 40px; }
  .ivs-layout-tabs .ivs-shell { padding: 22px 24px 40px; }
  .ivs-side { flex: 0 0 232px; width: 232px; display: flex; flex-direction: column; gap: 4px;
    padding: 18px 13px; background: var(--surface); border-right: 1px solid var(--border);
    position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .ivs-side-brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
  .ivs-side-logo { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
    background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 12.5px; letter-spacing: -.3px; flex-shrink: 0; }
  .ivs-side-brand b { display: block; font-size: 13.5px; letter-spacing: -.2px; }
  .ivs-side-brand span { font-size: 11px; color: var(--text-faint); }
  .ivs-side-nav { display: flex; flex-direction: column; gap: 2px; }
  .ivs-side-group { font-size: 10.5px; letter-spacing: .1em; color: var(--text-faint);
    margin: 13px 10px 5px; text-transform: uppercase; font-weight: 700; }
  .ivs-side-link { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
    padding: 9px 11px; border: none; border-radius: 9px; background: none; color: var(--text-dim);
    font: inherit; font-size: 13px; font-weight: 550; cursor: pointer; }
  .ivs-side-link:hover { background: var(--surface-2); color: var(--text); }
  .ivs-side-link.on { background: var(--accent-soft); color: var(--accent); font-weight: 700;
    box-shadow: inset 3px 0 0 var(--accent); }
  .ivs-side-foot { margin-top: auto; padding: 11px 10px 2px; border-top: 1px solid var(--border);
    font-size: 11px; color: var(--text-faint); }

  /* ---------- 화면 배치 B : 위쪽 탭 (묶음 구분) ---------- */
  .ivs-tabbar { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 18px;
    padding-bottom: 2px; border-bottom: 1px solid var(--border); }
  .ivs-tabgroup { display: flex; flex-direction: column; gap: 4px; }
  .ivs-tabgroup-t { font-size: 10.5px; letter-spacing: .1em; color: var(--text-faint);
    font-weight: 700; text-transform: uppercase; padding-left: 4px; }
  .ivs-tabbar .ivs-tabs { margin-bottom: 0; }

  /* ---------- 안내 카드 ---------- */
  .ivs-soon-list { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .ivs-soon-list li { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: var(--text-dim); }
  .ivs-soon-list li svg { color: var(--good); flex-shrink: 0; margin-top: 2px; }

  /* ---------- 생산계획 ---------- */
  .ivs-plan-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .ivs-crew-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .ivs-crew-input { resize: vertical; line-height: 1.5; }
  .ivs-np-form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .ivs-np-form .ivs-input:first-child { flex: 1 1 200px; }

  .ivs-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .ivs-cal-dow { text-align: center; font-size: 11.5px; font-weight: 700; color: var(--text-faint); padding-bottom: 2px; }
  .ivs-cal-dow:first-child { color: var(--bad); }
  .ivs-cal-dow:last-child { color: var(--info); }
  .ivs-cal-pad { min-height: 10px; }
  .ivs-cal-day { border: 1px solid var(--border); border-radius: 9px; background: var(--surface-2);
    padding: 7px 8px 8px; min-height: 82px; display: flex; flex-direction: column; gap: 4px; }
  .ivs-cal-day.stop { background: color-mix(in srgb, var(--bad) 7%, var(--surface-2));
    border-color: color-mix(in srgb, var(--bad) 28%, var(--border)); }
  .ivs-cal-n { font-size: 11.5px; font-weight: 700; color: var(--text-dim); }
  .ivs-cal-row { display: flex; gap: 4px; flex-wrap: wrap; }
  .ivs-cal-tag { font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 5px; white-space: nowrap; }
  .ivs-cal-tag.day { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
  .ivs-cal-tag.night { background: color-mix(in srgb, var(--info) 22%, transparent); color: var(--info); }
  .ivs-cal-kg { margin-top: auto; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ivs-cal-kg em { font-size: 10.5px; font-weight: 600; font-style: normal; color: var(--text-faint); margin-left: 1px; }
  .ivs-cal-stop { font-size: 10.5px; color: var(--bad); font-weight: 650; line-height: 1.3; margin-top: auto; }

  @media (max-width: 1100px) {
    .ivs-side { flex-basis: 200px; width: 200px; }
    .ivs-crew-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 760px) {
    .ivs-layout-sidebar { flex-direction: column; }
    .ivs-side { position: static; height: auto; width: 100%; flex-basis: auto;
      border-right: none; border-bottom: 1px solid var(--border); }
    .ivs-side-nav { flex-direction: row; flex-wrap: wrap; }
    .ivs-side-group { display: none; }
    .ivs-cal { grid-template-columns: repeat(2, 1fr); }
    .ivs-cal-dow { display: none; }
    .ivs-cal-pad { display: none; }
  }

  /* ---------- 생산실적 ---------- */
  .ivs-run-inputs { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
  .ivs-chiprow { display: flex; flex-wrap: wrap; gap: 7px; }
  .ivs-lotchip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 10px; color: var(--text-dim); white-space: nowrap; }
  .ivs-lotchip b { color: var(--text); font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .ivs-lotchip-x { border: none; background: none; padding: 0; margin-left: 2px; cursor: pointer;
    color: var(--text-faint); display: inline-flex; }
  .ivs-lotchip-x:hover { color: var(--bad); }
  .ivs-linkbtn { border: none; background: none; padding: 0; font: inherit; cursor: pointer;
    color: var(--accent); font-weight: 650; }
  .ivs-linkbtn:hover { text-decoration: underline; }
  .ivs-trace-row td { background: var(--surface-2); }
  .ivs-trace { display: flex; align-items: flex-start; gap: 18px; padding: 6px 2px; flex-wrap: wrap; }
  .ivs-trace > div { min-width: 0; }
  .ivs-trace-arrow { align-self: center; color: var(--text-faint); font-size: 18px; }
  .ivs-rank-net.ivs-diff-mix { color: var(--good); }
  .ivs-rank-net.ivs-diff-loss { color: var(--bad); }

  /* ---------- 레이아웃 래퍼 · 기타 ---------- */
  .ivs-dash, .ivs-prod, .ivs-tolling, .ivs-plan { display: block; }
  .ivs-collapse-body { padding-top: 4px; }
  .ivs-comingsoon { padding: 40px; text-align: center; color: var(--text-dim); background: var(--surface);
    border: 1px dashed var(--border); border-radius: var(--radius); }
  .ivs-btn-icon { padding-left: 10px; padding-right: 11px; }
  .ivs-title-edit { opacity: .55; }
  .ivs-title-edit:hover { opacity: 1; }

  /* ---------- QR 스캔 입고 ---------- */
  .ivs-seg { display: inline-flex; gap: 4px; padding: 4px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; }
  .ivs-seg-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border: 0;
    background: transparent; color: var(--text-dim); font-size: 12.5px; font-weight: 600;
    border-radius: 7px; cursor: pointer; font-family: inherit; }
  .ivs-seg-btn.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .ivs-scan-common { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  .ivs-scan-common-head { font-size: 12px; color: var(--text-faint); margin-bottom: 12px; }
  .ivs-check-row { display: inline-flex; align-items: center; gap: 7px; margin-top: 12px;
    font-size: 12.5px; color: var(--text-dim); cursor: pointer; }
  .ivs-scanbox { border: 1px dashed color-mix(in srgb, var(--accent) 45%, var(--border));
    background: var(--accent-soft); border-radius: 12px; padding: 15px 16px; margin-bottom: 16px; }
  .ivs-scanbox-label { display: flex; align-items: center; gap: 7px; font-size: 12.5px;
    font-weight: 600; color: var(--accent); margin-bottom: 11px; }
  .ivs-scaninput { width: 100%; box-sizing: border-box; padding: 13px 15px; font-size: 15px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .4px;
    background: var(--surface); color: var(--text); border: 1.5px solid var(--accent); border-radius: 9px; outline: none; }
  .ivs-scaninput::placeholder { font-family: inherit; letter-spacing: 0; color: var(--text-faint); font-size: 13px; }
  .ivs-scanflash { display: flex; align-items: center; gap: 6px; margin-top: 9px;
    font-size: 12.5px; font-weight: 600; min-height: 17px; }
  .ivs-scanflash.ok { color: var(--good); }
  .ivs-scanflash.bad { color: var(--bad); }
  .ivs-scanflash.muted { color: var(--text-faint); font-weight: 400; }
  .ivs-range-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .ivs-range-ex { font-size: 12.5px; color: var(--text-dim); }
  .ivs-range-ex b { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); }
  .ivs-scan-list-head { display: flex; align-items: center; justify-content: space-between;
    gap: 10px; font-size: 12.5px; color: var(--text-dim); margin-bottom: 8px; }
  .ivs-scan-list { max-height: 300px; overflow: auto; border: 1px solid var(--border); border-radius: 10px; }
  .ivs-scan-list .ivs-table { margin: 0; }
  .ivs-scan-list .ivs-table thead th { position: sticky; top: 0; background: var(--surface-2); z-index: 1; }
  .ivs-cellinput { width: 92px; padding: 5px 8px; text-align: right; font-size: 12.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; }

  /* ---------- 출하 처리 ---------- */
  .ivs-shipbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px;
    flex-wrap: wrap; padding: 12px 14px; margin-bottom: 14px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 11px; }
  .ivs-shipbar-left, .ivs-shipbar-right { display: flex; align-items: flex-end; gap: 9px; flex-wrap: wrap; }
  .ivs-ship-date { width: 158px; }
  .ivs-row-on { background: var(--accent-soft); }
  .ivs-row-on td { border-color: color-mix(in srgb, var(--accent) 22%, var(--border)); }

  /* ---------- 기간 고르기 (가동율 · 비가동 공통) ---------- */
  .ivs-periodbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .ivs-periodbar .ivs-seg { margin-bottom: 0; }

  /* ---------- 가동율 현황 ---------- */
  .ivs-kpi.warn { border-color: color-mix(in srgb, var(--warn, #F59E0B) 32%, var(--border)); }
  .ivs-flow { display: flex; align-items: stretch; gap: 4px; overflow-x: auto; padding-bottom: 6px; }
  .ivs-flow-arrow { display: flex; align-items: center; color: var(--text-faint); font-size: 14px; flex: 0 0 auto; }
  .ivs-flow-node { flex: 1 1 0; min-width: 104px; padding: 11px 10px 10px; border-radius: 10px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-top: 3px solid var(--c); display: flex; flex-direction: column; gap: 6px; }
  .ivs-flow-name { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .ivs-flow-util { font-size: 19px; font-weight: 700; color: var(--c); font-variant-numeric: tabular-nums; line-height: 1; }
  .ivs-flow-util em { font-size: 11px; font-style: normal; margin-left: 1px; opacity: .75; }
  .ivs-flow-bar { height: 4px; border-radius: 2px; background: var(--surface-3, rgba(127,127,127,.18)); overflow: hidden; }
  .ivs-flow-bar i { display: block; height: 100%; background: var(--c); }
  .ivs-flow-node.hot { background: color-mix(in srgb, var(--c) 9%, var(--surface-2)); }
  .ivs-flow-dt { font-size: 10.5px; color: var(--text-faint); line-height: 1.45; }
  .ivs-flow-dt b { color: var(--text-dim); font-weight: 600; }

  .ivs-trend-svg { width: 100%; height: 170px; display: block; }
  .ivs-trend-grid { stroke: var(--border); stroke-width: .5; vector-effect: non-scaling-stroke; }
  .ivs-trend-target { stroke: var(--accent); stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
  .ivs-trend-line { fill: none; stroke: #4C8DFF; stroke-width: 1.6; vector-effect: non-scaling-stroke;
    stroke-linejoin: round; stroke-linecap: round; }
  .ivs-trend-x { display: flex; margin-top: 5px; font-size: 10px; color: var(--text-faint);
    font-variant-numeric: tabular-nums; }
  .ivs-trend-x span { flex: 1 1 0; text-align: center; overflow: hidden; }
  .ivs-trend-x span.hide { visibility: hidden; }
  .ivs-legend-swatch.line { background: #4C8DFF; height: 3px; border-radius: 2px; align-self: center; }
  .ivs-legend-swatch.dash { background: transparent; border-top: 2px dashed var(--accent); height: 0; align-self: center; }
  .ivs-dim-row td { opacity: .5; }

  /* ---------- 비가동 현황 ---------- */
  .ivs-pareto { display: flex; flex-direction: column; gap: 9px; }
  .ivs-pareto-row { display: grid; grid-template-columns: minmax(110px, 1.1fr) 1fr 132px; gap: 12px; align-items: center; }
  .ivs-pareto-name { font-size: 12.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ivs-pareto-track { position: relative; height: 20px; border-radius: 5px;
    background: var(--surface-2); border: 1px solid var(--border); overflow: visible; }
  .ivs-pareto-fill { height: 100%; border-radius: 4px; }
  .ivs-pareto-cum { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--accent); border-radius: 1px; }
  .ivs-pareto-val { text-align: right; font-size: 12.5px; display: flex; flex-direction: column; gap: 1px; }
  .ivs-pareto-val b { font-variant-numeric: tabular-nums; }

  .ivs-matrix th .ivs-mx-h { display: inline-block; padding: 1px 7px; border-radius: 5px; font-size: 11px;
    color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
  .ivs-mx-cell { background: color-mix(in srgb, var(--c) calc(var(--a) * 100%), transparent); }

  /* ---------- 생산계획 : 로드맵 · 기준 ---------- */
  .ivs-roadmap { display: flex; gap: 8px; align-items: stretch; }
  .ivs-rm-seg { flex: 1 1 0; min-width: 178px; padding: 13px 14px 12px; border-radius: 11px;
    background: var(--surface-2); border: 1px solid var(--border); border-top: 3px solid var(--c);
    display: flex; flex-direction: column; gap: 6px; }
  .ivs-rm-name { font-size: 13px; font-weight: 700; color: var(--text); }
  .ivs-rm-range { font-size: 11px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .ivs-rm-kg { font-size: 17px; font-weight: 700; color: var(--c); font-variant-numeric: tabular-nums; }
  .ivs-rm-sub { font-size: 10.5px; color: var(--text-faint); }
  .ivs-ph-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 0; }
  .ivs-basis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 26px; }
  .ivs-basis-row { display: grid; grid-template-columns: minmax(140px, 1fr) auto; gap: 8px 12px;
    padding: 9px 0; border-bottom: 1px solid var(--border); align-items: baseline; }
  .ivs-basis-k { font-size: 12.5px; color: var(--text-dim); }
  .ivs-basis-v { font-size: 13px; font-weight: 600; color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }
  .ivs-basis-s { grid-column: 1 / -1; font-size: 11px; color: var(--text-faint); margin-top: -4px; }

  /* ---------- 생산계획 : 월별 · 주별 · 인원 그래프 ---------- */
  .ivs-mchart { position: relative; display: flex; gap: 18px; align-items: flex-end; padding-top: 22px; }
  .ivs-mchart-col { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .ivs-mchart-val { font-size: 15px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  .ivs-mchart-val em { font-size: 10px; font-style: normal; color: var(--text-faint); margin-left: 2px; }
  .ivs-mchart-plot { position: relative; width: 100%; height: 132px; display: flex; align-items: flex-end; }
  .ivs-mchart-bar { width: 100%; border-radius: 7px 7px 0 0; min-height: 3px;
    background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 55%, transparent)); }
  .ivs-mchart-dot { position: absolute; left: 50%; width: 11px; height: 11px; margin-left: -5.5px;
    border-radius: 50%; background: var(--surface); border: 2.5px solid #4C8DFF; }
  .ivs-mchart-name { font-size: 12.5px; font-weight: 600; color: var(--text); }
  .ivs-mchart-sub { font-size: 10.5px; color: var(--text-faint); text-align: center; }
  .ivs-legend-swatch.round { border-radius: 50%; background: transparent; border: 2.5px solid #4C8DFF; }

  .ivs-wchart { display: flex; gap: 5px; align-items: flex-end; overflow-x: auto; padding-bottom: 4px; }
  .ivs-wchart-col { flex: 1 1 0; min-width: 46px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .ivs-wchart-val { font-size: 11px; font-weight: 600; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .ivs-wchart-plot { width: 100%; height: 108px; display: flex; align-items: flex-end; }
  .ivs-wchart-bar { width: 100%; border-radius: 5px 5px 0 0; min-height: 2px; }
  .ivs-wchart-name { font-size: 11px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .ivs-wchart-sub { font-size: 9.5px; color: var(--text-faint); white-space: nowrap; }

  .ivs-hire { position: relative; display: flex; gap: 20px; align-items: flex-end; padding-top: 24px; }
  /* 정원선은 칸마다 끊지 않고 차트 전체를 가로지르게 — 끊어 그리면 점선이 셋으로 보여요 */
  .ivs-hire-capline { position: absolute; left: 0; right: 0; top: 24px; border-top: 2px dashed var(--accent); }
  .ivs-hire-col { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .ivs-hire-plot { position: relative; width: 100%; height: 128px; display: flex; align-items: flex-end;
    border-bottom: 1px solid var(--border); }
  .ivs-hire-bar { width: 100%; border-radius: 7px 7px 0 0; min-height: 20px; background: #4C8DFF;
    display: flex; align-items: flex-start; justify-content: center; padding-top: 4px; }
  .ivs-hire-bar.full { background: var(--good); }
  .ivs-hire-bar span { font-size: 13px; font-weight: 700; color: #fff; }
  .ivs-hire-name { font-size: 12.5px; font-weight: 600; color: var(--text); }
  .ivs-hire-sub { font-size: 10.5px; color: var(--text-faint); }
  .ivs-hire-fill { font-size: 10.5px; color: var(--text-dim); }
  .ivs-hire-fill.ok { color: var(--good); font-weight: 600; }
  .ivs-hire-caplabel { position: absolute; right: 0; top: 3px; font-size: 10.5px; color: var(--accent);
    font-weight: 600; background: var(--surface); padding: 0 4px; }

  /* 달력 — 범례 색으로 그 날이 왜 그런지 구분해요 */
  .ivs-cal-day.k-work        { background: var(--surface-2); }
  .ivs-cal-day.k-workWeekend { background: color-mix(in srgb, var(--c) 13%, var(--surface-2)); }
  .ivs-cal-day.k-workHoliday { background: color-mix(in srgb, var(--c) 15%, var(--surface-2)); }
  .ivs-cal-day.k-offWeekend  { background: color-mix(in srgb, var(--c) 11%, var(--surface-2)); }
  .ivs-cal-day.k-offHoliday  { background: color-mix(in srgb, var(--c) 13%, var(--surface-2)); }
  .ivs-cal-day.k-offNonProd  { background: color-mix(in srgb, var(--c) 15%, var(--surface-2)); }
  .ivs-cal-day.stop .ivs-cal-stop { color: var(--c); }
  .ivs-cal-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 14px;
    padding-top: 13px; border-top: 1px solid var(--border); }
  .ivs-cal-legend-item { display: inline-flex; align-items: center; gap: 7px;
    font-size: 11.5px; color: var(--text-dim); }
  .ivs-cal-legend-item i { width: 13px; height: 13px; border-radius: 4px; display: inline-block; opacity: .85; }
  .ivs-cal-legend-item b { color: var(--text); font-variant-numeric: tabular-nums; }

  .ivs-cal-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
  .ivs-cal-hol { font-size: 9.5px; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ivs-cal-day { border-top: 2px solid var(--c); }
  .ivs-cal-day.stop { border-top-color: transparent; }
  .ivs-cellinput.wide { width: 100%; min-width: 96px; text-align: left; }

  /* ---------- 보고서 (슬라이드 미리보기) ---------- */
  /* 내려받는 .pptx와 같은 인상이 되도록, 화면에서도 딥 네이비 + 원포인트 컬러로 그려요. */
  .ivs-flowline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ivs-flowline-arrow { color: var(--text-faint); font-size: 12px; }
  .ivs-flowline-step { padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
    color: var(--text-faint); background: var(--surface-2); border: 1px solid var(--border); }
  .ivs-flowline-step.on { color: #10B981; background: rgba(16,185,129,.12); border-color: rgba(16,185,129,.4); }

  .ivs-slides { display: flex; flex-direction: column; gap: 18px; }
  .ivs-slide { --accent: #10B981;
    background: #0F172A; border: 1px solid #2E3B52; border-radius: 12px;
    padding: 26px 30px 28px; break-inside: avoid; position: relative; color: #FFFFFF; }
  .ivs-slide::before { content: ""; position: absolute; left: 30px; top: 30px;
    width: 4px; height: 44px; background: var(--accent); border-radius: 2px; }
  .ivs-slide-head { display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px; padding-left: 18px; }
  .ivs-slide-kicker { font-size: 10.5px; font-weight: 700; color: var(--accent); letter-spacing: .08em; }
  .ivs-slide-no { font-size: 10.5px; color: #64748B; font-variant-numeric: tabular-nums; }
  .ivs-slide-title { font-size: 21px; font-weight: 700; line-height: 1.38; padding-left: 18px; color: #fff; }
  .ivs-slide-sub { font-size: 12.5px; color: #94A3B8; padding-left: 18px; margin-top: 5px; }
  .ivs-slide-body { margin-top: 22px; }

  .ivs-slide.cover { padding: 46px 40px 40px; border-top: 3px solid #10B981; }
  .ivs-slide.cover::before { display: none; }
  .ivs-slide-eyebrow { font-size: 11px; font-weight: 700; color: #10B981; letter-spacing: .16em; }
  .ivs-slide-covertitle { font-size: 32px; font-weight: 700; margin-top: 12px; color: #fff; }
  .ivs-slide-coverrule { width: 56px; height: 3px; background: #10B981; margin: 18px 0 14px; }
  .ivs-slide-coversub { font-size: 14px; color: #94A3B8; }
  .ivs-slide-covermeta { font-size: 11px; color: #64748B; margin-top: 26px; }

  .ivs-slide-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .ivs-slide-kpi { background: #1B2437; border: 1px solid #2E3B52; border-radius: 10px; padding: 16px 18px; }
  .ivs-slide-kpi-l { font-size: 11px; color: #94A3B8; }
  .ivs-slide-kpi-v { font-size: 30px; font-weight: 700; line-height: 1.15; margin-top: 6px;
    font-variant-numeric: tabular-nums; }
  .ivs-slide-kpi-v em { font-size: 13px; font-style: normal; color: #94A3B8; margin-left: 3px; }
  .ivs-slide-kpi-d { font-size: 10.5px; font-weight: 600; margin-top: 8px; }

  .ivs-slide-points { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
  .ivs-slide-point { display: grid; grid-template-columns: 18px auto 1fr; gap: 10px; align-items: baseline;
    background: rgba(27,36,55,.6); border-radius: 8px; padding: 11px 14px; font-size: 12px; }
  .ivs-slide-pn { width: 18px; height: 18px; border-radius: 50%; color: #0F172A; font-size: 10px;
    font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .ivs-slide-point span:last-child { color: #94A3B8; }

  .ivs-slide-bars { display: flex; flex-direction: column; gap: 11px;
    background: rgba(27,36,55,.55); border-radius: 10px; padding: 20px 22px; }
  .ivs-slide-bar { display: grid; grid-template-columns: 190px 1fr 130px; gap: 14px; align-items: center; }
  .ivs-slide-bar-l { font-size: 12px; color: #94A3B8; text-align: right; }
  .ivs-slide-bar.strong .ivs-slide-bar-l, .ivs-slide-bar.strong .ivs-slide-bar-v { font-weight: 700; }
  .ivs-slide-bar-t { position: relative; height: 22px; border-radius: 6px; background: #232F45; overflow: visible; }
  .ivs-slide-bar-t i { display: block; height: 100%; border-radius: 6px; }
  .ivs-slide-bar-t u { position: absolute; top: -4px; bottom: -4px; width: 1.5px; background: #94A3B8; opacity: .6; }
  .ivs-slide-bar-v { font-size: 12px; font-weight: 600; color: #fff; font-variant-numeric: tabular-nums; }

  .ivs-slide-trend { background: rgba(27,36,55,.55); border-radius: 10px; padding: 22px 26px 16px; }
  .ivs-slide-trend-svg { width: 100%; height: 170px; display: block; }
  .ivs-slide-trend-x { display: flex; margin-top: 10px; }
  .ivs-slide-trend-x span { flex: 1 1 0; text-align: center; font-size: 10px; color: #94A3B8;
    display: flex; flex-direction: column; gap: 2px; }
  .ivs-slide-trend-x b { font-size: 12.5px; color: #fff; font-variant-numeric: tabular-nums; }

  .ivs-slide-issues { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .ivs-slide-issue { background: #1B2437; border-radius: 10px; border-top: 3px solid var(--c); padding: 18px 18px 20px; }
  .ivs-slide-issue-h { display: flex; align-items: center; gap: 10px; }
  .ivs-slide-issue-ico { width: 26px; height: 26px; border-radius: 7px; border: 1.5px solid var(--c);
    position: relative; flex: 0 0 auto; }
  .ivs-slide-issue-ico::after { content: ""; position: absolute; inset: 6px; border-radius: 3px; background: var(--c); }
  .ivs-slide-issue-h b { font-size: 13.5px; color: #fff; }
  .ivs-slide-issue-badge { display: inline-block; margin: 12px 0 12px; padding: 3px 10px; border-radius: 6px;
    font-size: 10px; font-weight: 700; color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); }
  .ivs-slide-issue-r { font-size: 11.5px; color: #94A3B8; line-height: 1.5; margin-bottom: 9px; }
  .ivs-slide-issue-r b { color: #fff; margin-right: 5px; }

  .ivs-slide-plan { display: flex; flex-direction: column; gap: 10px; }
  .ivs-slide-planrow { display: grid; grid-template-columns: 16px 1fr 90px 100px; gap: 14px; align-items: center;
    background: rgba(27,36,55,.55); border-radius: 9px; padding: 13px 16px; }
  .ivs-slide-plandot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
  .ivs-slide-plantxt { display: flex; flex-direction: column; gap: 3px; }
  .ivs-slide-plantxt b { font-size: 12.5px; color: #fff; }
  .ivs-slide-plantxt span { font-size: 10.5px; color: #94A3B8; }
  .ivs-slide-planowner { font-size: 10.5px; font-weight: 700; color: var(--c); text-align: center;
    background: color-mix(in srgb, var(--c) 16%, transparent); border-radius: 6px; padding: 4px 0; }
  .ivs-slide-plandue { font-size: 11px; color: #94A3B8; text-align: right; }

  .ivs-slide-banner { margin-top: 16px; border-radius: 9px; padding: 14px 18px; font-size: 12px; color: #fff;
    border-left: 4px solid #3B82F6; background: rgba(59,130,246,.12); }
  .ivs-slide-banner.action { border-left-color: #EF4444; background: rgba(239,68,68,.12); }
  .ivs-slide-banner.insight { border-left-color: #10B981; background: rgba(16,185,129,.12); }
  .ivs-slide-banner b { margin-right: 8px; }
  .ivs-slide-banner.action b { color: #EF4444; }
  .ivs-slide-banner.insight b { color: #10B981; }

  .ivs-slide-table { background: transparent; }
  .ivs-slide-table th { font-size: 11px; color: #94A3B8; border-color: #2E3B52; }
  .ivs-slide-table td { font-size: 11.5px; color: #fff; border-color: #2E3B52; }
  .ivs-slide .ivs-table-wrap { border-color: #2E3B52; }
  .ivs-slide .ivs-section-hint { color: #64748B; }
  @media print { .ivs-slide { page-break-after: always; border-radius: 0; } }

  @media (max-width: 1100px) {
    .ivs-slide-kpis { grid-template-columns: repeat(2, 1fr); }
    .ivs-slide-issues { grid-template-columns: 1fr; }
    .ivs-slide-bar { grid-template-columns: 130px 1fr 110px; }
  }

  /* ---------- 당월 주별 요약 : 그래프는 작게, 요약은 오른쪽에 ---------- */
  .ivs-week-split { display: grid; grid-template-columns: minmax(240px, 0.85fr) 1.15fr; gap: 26px; align-items: start; }
  /* 당월은 주가 서너 개뿐이라, 폭을 안 잡아두면 막대가 멋대로 넓어져요 */
  .ivs-wchart.compact { gap: 14px; justify-content: center; }
  .ivs-wchart.compact .ivs-wchart-plot { height: 150px; }
  .ivs-wchart.compact .ivs-wchart-col { min-width: 40px; max-width: 68px; }
  .ivs-week-side { display: flex; flex-direction: column; gap: 9px; }
  .ivs-week-row { border: 1px solid var(--border); border-left: 3px solid var(--c);
    border-radius: 9px; padding: 11px 14px; background: var(--surface-2); }
  .ivs-week-row-h { display: flex; align-items: baseline; gap: 9px; margin-bottom: 8px; }
  .ivs-week-wk { font-size: 12px; font-weight: 700; color: var(--c); font-variant-numeric: tabular-nums; }
  .ivs-week-range { font-size: 11px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .ivs-week-kg { margin-left: auto; font-size: 15px; font-weight: 700; color: var(--text);
    font-variant-numeric: tabular-nums; }
  .ivs-week-kg em { font-size: 10px; font-style: normal; color: var(--text-faint); margin-left: 2px; }
  .ivs-week-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-size: 11px; color: var(--text-dim); }
  .ivs-week-meta .ivs-chip { margin-left: auto; }
  .ivs-week-note { margin-top: 7px; font-size: 10.5px; color: var(--accent); }
  .ivs-week-total { display: flex; align-items: baseline; gap: 12px; padding: 11px 14px;
    border-radius: 9px; background: var(--accent-soft);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); font-size: 12px; }
  .ivs-week-total b { font-size: 15px; color: var(--text); font-variant-numeric: tabular-nums; }
  .ivs-week-total span:last-child { margin-left: auto; font-size: 11px; }
  @media (max-width: 1100px) { .ivs-week-split { grid-template-columns: 1fr; } }

  /* ---------- 기준정보 : 조 편성 보기 ---------- */
  .ivs-crew-view { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .ivs-crew-card { border: 1px solid var(--border); border-top: 3px solid var(--c);
    border-radius: 10px; padding: 13px 15px; background: var(--surface-2); }
  .ivs-crew-card-h { display: flex; align-items: baseline; gap: 8px; font-size: 13px;
    font-weight: 700; color: var(--c); margin-bottom: 10px; }
  .ivs-crew-card-h span { margin-left: auto; font-size: 11px; color: var(--text-faint); font-weight: 500; }
  .ivs-crew-names { display: flex; flex-wrap: wrap; gap: 5px; font-size: 11.5px; }
  @media (max-width: 900px) { .ivs-crew-view { grid-template-columns: 1fr; } }

  /* ---------- 반응형 ---------- */
  @media (max-width: 1100px) {
    .ivs-kpis, .ivs-kpis.cols-5 { grid-template-columns: repeat(2, 1fr); }
    .ivs-chart-split { grid-template-columns: 1fr; gap: 22px; }
    .ivs-half-grid { grid-template-columns: 1fr; }
    .ivs-aggbar-row { grid-template-columns: minmax(100px, 1fr) 1fr 118px; }
    .ivs-breakdown-row { grid-template-columns: 120px 1fr 108px; }
    .ivs-rank-row { grid-template-columns: minmax(110px, 1fr) 1fr 120px; }
  }
  @media (max-width: 680px) {
    .ivs-layout-sidebar .ivs-shell, .ivs-layout-tabs .ivs-shell { padding: 16px 14px 32px; }
    .ivs-kpis, .ivs-kpis.cols-3, .ivs-kpis.cols-5 { grid-template-columns: 1fr; }
    .ivs-form-grid { grid-template-columns: 1fr; }
    .ivs-breakdown-row, .ivs-rank-row, .ivs-aggbar-row { grid-template-columns: 1fr auto; }
    .ivs-breakdown-track, .ivs-rank-bar-track, .ivs-aggbar-track { display: none; }
    .ivs-qrbar { align-items: stretch; }
    .ivs-qrbar-actions { justify-content: space-between; }
    .ivs-column { min-width: 62px; }
  }
</style>

// 그 날 라인을 돌리는지, 안 돌리면 왜 안 돌리는지.
function opStatus(mes, dateStr) {
  const ph = phaseAt(mes, dateStr);
  if (!ph) return { run: false, why: "계획 기간 밖", kind: "none", ph: null };
  const wt = workTypeOf(mes, ph.workType);
  const weekDays = Number(wt.weekDays) || 7;
  const dow = new Date(`${dateStr}T00:00:00`).getDay(); // 0=일 … 6=토
  const weekend = dow === 0 || dow === 6;
  const hol = holidayAt(mes, dateStr);

  // 비생산 기간이 제일 셉니다 — 정기 OH가 잡히면 근무형태와 상관없이 세워요.
  const stops = nonProdHits(mes, dateStr, "day").concat(nonProdHits(mes, dateStr, "night"));
  if (stops.length > 0) return { run: false, why: `휴무(${stops[0].name})`, kind: "offNonProd", ph, wt, stop: stops[0] };

  if (weekDays < 7 && weekend) return { run: false, why: "휴무(주말)", kind: "offWeekend", ph, wt };
  if (hol && !wt.holidayWork) return { run: false, why: `휴무(${hol.name})`, kind: "offHoliday", ph, wt, hol };
  if (hol) return { run: true, why: `조업(${hol.name} 휴일근로)`, kind: "workHoliday", ph, wt, hol };
  if (weekend) return { run: true, why: "조업(주말 연속 가동)", kind: "workWeekend", ph, wt };
  return { run: true, why: "조업", kind: "work", ph, wt };
}

const dayDiff = (fromStr, toStr) =>
  Math.round((new Date(`${toStr}T00:00:00`) - new Date(`${fromStr}T00:00:00`)) / 86400000);

// 그 날 각 조가 무엇을 하는지 — { A: "day", B: "off", C: "night" }
function crewShifts(dateStr, anchor) {
  const d = dayDiff(anchor, dateStr);
  const out = {};
  CREWS.forEach((c) => {
    const i = (((d + CREW_OFFSET[c]) % 12) + 12) % 12;
    out[c] = SHIFT_PATTERN[i];
  });
  return out;
}
// 그 날 주간/야간을 맡은 조 — { day: "A", night: "C" }
function shiftCrews(dateStr, anchor) {
  const cs = crewShifts(dateStr, anchor);
  const out = { day: null, night: null };
  CREWS.forEach((c) => { if (cs[c] === "day") out.day = c; else if (cs[c] === "night") out.night = c; });
  return out;
}

// 그 달에 적용되는 capa·작업시간 (월별로 바꿔둔 값이 있으면 그걸 씁니다)
function mesRates(mes, ym) {
  const ov = (mes.monthly || {})[ym] || {};
  return {
    capa: Number(ov.capa ?? mes.capa) || 0,
    dayHours: Number(ov.dayHours ?? mes.dayHours) || 0,
    nightHours: Number(ov.nightHours ?? mes.nightHours) || 0,
    dayOnlyHours: Number(ov.dayOnlyHours ?? mes.dayOnlyHours ?? mes.dayHours) || 0,
    // 그 달만 가동률을 따로 잡고 싶을 때 (비워두면 단계에 적힌 값을 씁니다)
    util: ov.util == null || ov.util === "" ? null : Number(ov.util),
    note: ov.note || "",
  };
}

// 하루치 생산계획.
//   계획 생산량 = CAPA × 설비 투입 가동시간 × 일 교대수 × 그 단계의 설비 가동률
// 주간근무만 하는 날은 교대가 1번이고 가동시간도 짧아요(8.25h). 교대 근무는 2번 × 10.25h.
function planForDay(mes, dateStr) {
  const r = mesRates(mes, dateStr.slice(0, 7));
  const crews = shiftCrews(dateStr, mes.shiftAnchor);
  const op = opStatus(mes, dateStr);
  const ph = op.ph;
  const wt = op.wt || workTypeOf(mes, "day");
  // 그 달에 따로 잡아둔 가동률이 있으면 그게 우선이에요 (월별 기준 설정).
  const util = r.util != null ? r.util : (ph ? Number(ph.util) || 0 : 0);
  const twoShift = (Number(wt.shiftsPerDay) || 1) >= 2;
  // 가동시간도 근무형태에 붙어 있어요 — 주간근무는 작업 종료 준비가 더 붙어서 짧습니다.
  const hoursPerShift = Number(wt.hours) || (twoShift ? r.dayHours : r.dayOnlyHours);
  // 반올림은 화면에 찍을 때만 해요 — 여기서 하루하루 반올림하면 한 달 합계가 몇 kg씩 어긋납니다.
  const runKg = op.run ? r.capa * hoursPerShift * util : 0;

  const dayKg = runKg;
  const nightKg = op.run && twoShift ? runKg : 0;
  return {
    date: dateStr,
    phase: ph, phaseName: ph ? ph.name : "",
    workType: ph ? ph.workType : null, workTypeLabel: phaseWorkLabel(mes, ph),
    crews: Number(wt.crews) || 1, kind: op.kind,
    util, shiftsPerDay: op.run ? Number(wt.shiftsPerDay) || 1 : 0,
    staff: op.run && ph ? Number(ph.staff) || 0 : 0,
    // 3개조로 돌 때만 A·B·C가 순환해요. 그 전 단계에서는 조 이름을 붙이지 않습니다.
    dayCrew: op.run && Number(wt.crews) === 3 ? crews.day : null,
    nightCrew: op.run && twoShift && Number(wt.crews) === 3 ? crews.night : null,
    dayHours: op.run ? hoursPerShift : 0,
    nightHours: op.run && twoShift ? hoursPerShift : 0,
    dayKg, nightKg,
    get totalKg() { return this.dayKg + this.nightKg; },
    get runHours() { return this.dayHours + this.nightHours; },
    opLabel: op.why, holiday: op.hol || null, nonProd: op.stop || null,
    stopNames: op.run ? [] : [op.why.replace(/^휴무\(|\)$/g, "")],
    isStop: !op.run,
  };
}

//   - 쓰기: PUT {DB_BASE}/inventory.json (매번 전체 데이터를 통째로 씀 — 단순하고 안전)
//   - 실시간 구독: EventSource로 스트림을 열어두면 누가 바꿀 때마다 "put" 이벤트가 즉시 옴
const DB_BASE = "https://drt-stock-status-default-rtdb.firebaseio.com";

// 생산관리 설정 — 저장된 값이 없거나 일부만 있어도 기본값으로 채워요.
function normalizeMes(raw) {
  const m = raw && typeof raw === "object" ? raw : {};
  const members = m.crewMembers && typeof m.crewMembers === "object" ? m.crewMembers : {};
  const asList = (v) => (Array.isArray(v) ? v.filter((x) => typeof x === "string" && x.trim()) : []);
  return {
    ...DEFAULT_MES,
    ...m,
    monthly: m.monthly && typeof m.monthly === "object" ? m.monthly : {},
    nonProd: Array.isArray(m.nonProd) ? m.nonProd : DEFAULT_NONPROD.map((n) => ({ ...n })),
    workTypes: Array.isArray(m.workTypes) && m.workTypes.length > 0
      ? DEFAULT_WORK_TYPES.map((d) => ({ ...d, ...(m.workTypes.find((w) => w.key === d.key) || {}) }))
      : DEFAULT_WORK_TYPES.map((w) => ({ ...w })),
    crewMembers: { A: asList(members.A), B: asList(members.B), C: asList(members.C) },
    phases: Array.isArray(m.phases) && m.phases.length > 0 ? m.phases : DEFAULT_PHASES.map((p) => ({ ...p })),
    holidays: Array.isArray(m.holidays) ? m.holidays : DEFAULT_HOLIDAYS.map((h) => ({ ...h })),
    hiring: Array.isArray(m.hiring) && m.hiring.length > 0 ? m.hiring : DEFAULT_HIRING.map((h) => ({ ...h })),
    crewSize: Number(m.crewSize ?? DEFAULT_MES.crewSize) || DEFAULT_MES.crewSize,
    maxShiftsPerWeek: Number(m.maxShiftsPerWeek ?? DEFAULT_MES.maxShiftsPerWeek) || DEFAULT_MES.maxShiftsPerWeek,
    personHours: Number(m.personHours ?? DEFAULT_MES.personHours) || DEFAULT_MES.personHours,
    yieldRate: Number(m.yieldRate ?? DEFAULT_MES.yieldRate) || DEFAULT_MES.yieldRate,
    headcount: Number(m.headcount ?? DEFAULT_MES.headcount) || DEFAULT_MES.headcount,
    dayOnlyHours: Number(m.dayOnlyHours ?? DEFAULT_MES.dayOnlyHours) || DEFAULT_MES.dayOnlyHours,
    targetUtil: Number(m.targetUtil ?? DEFAULT_MES.targetUtil) || DEFAULT_MES.targetUtil,
    targetRates: { ...DEFAULT_MES.targetRates, ...(m.targetRates && typeof m.targetRates === "object" ? m.targetRates : {}) },
  };
}
// Firebase는 배열을 가끔 {0:…, 1:…} 형태의 객체로 돌려줘요. 어느 쪽이 와도 배열로 맞춰줘요.
function normalizeVendors(raw) {
  const list = Array.isArray(raw) ? raw : (raw && typeof raw === "object" ? Object.values(raw) : []);
  return list.filter((x) => x && typeof x === "object" && x.name);
}
function normalizeMaster(raw) {
  const m = raw && typeof raw === "object" ? raw : null;
  const vendors = normalizeVendors(m && m.vendors);
  // 거래처가 하나도 없을 때: "저장한 적 있음" 표시가 있으면 사용자가 다 지운 것이니 빈 채로 두고,
  // 표시가 없으면 아직 한 번도 설정한 적 없는 새 저장소이니 기본 거래처를 넣어줘요.
  const useDefaults = vendors.length === 0 && !(m && m.configured);
  return { configured: true, vendors: useDefaults ? DEFAULT_VENDORS.map((v) => ({ ...v })) : vendors };
}
function normalizeLive(data) {
  if (!data || typeof data !== "object") return { ...FALLBACK_DATA };
  return {
    lots: Array.isArray(data.lots) ? data.lots : [],
    moves: Array.isArray(data.moves) ? data.moves : [],
    settings: { ...DEFAULT_SETTINGS, ...(data.settings || {}) },
    master: normalizeMaster(data.master),
    mes: normalizeMes(data.mes),
    runs: Array.isArray(data.runs) ? data.runs : [],
    downs: Array.isArray(data.downs) ? data.downs : [],
  };
}
async function fetchLive() {
  try {
    const res = await fetch(DB_BASE + DATA_PATH, { cache: "no-store" });
    if (!res.ok) throw new Error(`fetch failed: ${res.status}`);
    return normalizeLive(await res.json());
  } catch (e) {
    return null;
  }
}
async function writeLive(fullObj) {
  const res = await fetch(DB_BASE + DATA_PATH, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(fullObj),
  });
  if (!res.ok) throw new Error(`write failed: ${res.status}`);
  return true;
}
// 실시간 구독: onData는 전체 데이터가 바뀔 때마다 호출돼요. onStatus는 연결 상태 표시용.
function subscribeLive(onData, onStatus) {
  let es;
  try {
    es = new EventSource(DB_BASE + DATA_PATH);
  } catch (e) {
    onStatus?.("error");
    return () => {};
  }
  es.addEventListener("put", (e) => {
    try {
      const payload = JSON.parse(e.data); // { path: "/...", data: ... }
      if (payload.path === "/") onData(normalizeLive(payload.data));
      // 하위 경로만 바뀐 patch/put은 우리가 항상 루트를 통째로 쓰기 때문에 사실상 안 옴 — 무시해도 안전.
    } catch (err) {}
  });
  es.onopen = () => onStatus?.("connected");
  es.onerror = () => onStatus?.("reconnecting"); // EventSource가 알아서 재연결을 시도해요
  return () => es.close();
}

// 대시보드 "월마감 스냅샷": 선택한 연/월/일로 기준일을 계산해요.
// 일까지 고르면 그 날짜, 월만 고르면 그 달 말일, 연도만 고르면 그 해 12/31.
function computeAsOfDate(year, month, day) {
  if (month !== "all" && day !== "all") return `${year}-${pad2(Number(month))}-${pad2(Number(day))}`;
  if (month !== "all") {
    const lastDay = new Date(Number(year), Number(month), 0).getDate();
    return `${year}-${pad2(Number(month))}-${pad2(lastDay)}`;
  }
  return `${year}-12-31`;
}

// 공정이동 이력을 거슬러 올라가, 기준일 시점에 이 로트가 어떤 단계에 얼마나 있었는지 재구성해요.
function reconstructLotState(lot, lotMoves, asOfDate) {
  if (lot.receivedDate > asOfDate) return null; // 그 시점엔 아직 입고 전
  const sorted = [...lotMoves].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  const applicable = sorted.filter((m) => m.date <= asOfDate);
  if (applicable.length > 0) {
    const last = applicable[applicable.length - 1];
    return { stage: last.toStage, qtyKg: last.outputQty, lastMove: last.date };
  }
  if (sorted.length > 0) {
    const first = sorted[0];
    return { stage: first.fromStage, qtyKg: first.inputQty, lastMove: null }; // 아직 첫 이동 전이면 이동 전 상태
  }
  return { stage: lot.stage, qtyKg: lot.qtyKg, lastMove: null }; // 이동 이력이 없으면 입고 이후 그대로라고 가정
}

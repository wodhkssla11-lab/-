<p:sldMaster xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main"><p:cSld><p:bg><p:bgPr><a:solidFill><a:srgbClr val="0E1420"/></a:solidFill><a:effectLst/></p:bgPr></p:bg><p:spTree><p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr><p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/><a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr></p:spTree></p:cSld><p:clrMap bg1="lt1" tx1="dk1" bg2="lt2" tx2="dk2" accent1="accent1" accent2="accent2" accent3="accent3" accent4="accent4" accent5="accent5" accent6="accent6" hlink="hlink" folHlink="folHlink"/><p:sldLayoutIdLst><p:sldLayoutId id="2147483649" r:id="rId1"/></p:sldLayoutIdLst><p:txStyles><p:titleStyle><a:lvl1pPr><a:defRPr sz="2600"/></a:lvl1pPr></p:titleStyle><p:bodyStyle><a:lvl1pPr><a:defRPr sz="1400"/></a:lvl1pPr></p:bodyStyle><p:otherStyle><a:lvl1pPr><a:defRPr sz="1400"/></a:lvl1pPr></p:otherStyle></p:txStyles></p:sldMaster>`;

function buildPptx(slides) {
  const n = slides.length;
  const files = [];
  const ct = [
    `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>`,
    `<Default Extension="xml" ContentType="application/xml"/>`,
    `<Override PartName="/ppt/presentation.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.presentation.main+xml"/>`,
    `<Override PartName="/ppt/slideMasters/slideMaster1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideMaster+xml"/>`,
    `<Override PartName="/ppt/slideLayouts/slideLayout1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideLayout+xml"/>`,
    `<Override PartName="/ppt/theme/theme1.xml" ContentType="application/vnd.openxmlformats-officedocument.theme+xml"/>`,
    ...slides.map((_, i) => `<Override PartName="/ppt/slides/slide${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slide+xml"/>`),
  ].join("");
  files.push({ name: "[Content_Types].xml", content: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">${ct}</Types>` });
  files.push({ name: "_rels/.rels", content: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="ppt/presentation.xml"/></Relationships>` });

  const sldIds = slides.map((_, i) => `<p:sldId id="${256 + i}" r:id="rId${i + 2}"/>`).join("");
  files.push({ name: "ppt/presentation.xml", content: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<p:presentation xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main" saveSubsetFonts="1"><p:sldMasterIdLst><p:sldMasterId id="2147483648" r:id="rId1"/></p:sldMasterIdLst><p:sldIdLst>${sldIds}</p:sldIdLst><p:sldSz cx="${SLIDE_W}" cy="${SLIDE_H}"/><p:notesSz cx="${SLIDE_H}" cy="${SLIDE_W}"/></p:presentation>` });

  const presRels = [`<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideMaster" Target="slideMasters/slideMaster1.xml"/>`]
    .concat(slides.map((_, i) => `<Relationship Id="rId${i + 2}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slide" Target="slides/slide${i + 1}.xml"/>`))
    .concat([`<Relationship Id="rId${n + 2}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/theme" Target="theme/theme1.xml"/>`]).join("");
  files.push({ name: "ppt/_rels/presentation.xml.rels", content: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${presRels}</Relationships>` });

  files.push({ name: "ppt/slideMasters/slideMaster1.xml", content: PPT_MASTER });
  files.push({ name: "ppt/slideMasters/_rels/slideMaster1.xml.rels", content: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideLayout" Target="../slideLayouts/slideLayout1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/theme" Target="../theme/theme1.xml"/></Relationships>` });
  files.push({ name: "ppt/slideLayouts/slideLayout1.xml", content: PPT_LAYOUT });
  files.push({ name: "ppt/slideLayouts/_rels/slideLayout1.xml.rels", content: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideMaster" Target="../slideMasters/slideMaster1.xml"/></Relationships>` });
  files.push({ name: "ppt/theme/theme1.xml", content: PPT_THEME });

  slides.forEach((s, i) => {
    files.push({ name: `ppt/slides/slide${i + 1}.xml`, content: slideXml(s, i + 1, n) });
    files.push({ name: `ppt/slides/_rels/slide${i + 1}.xml.rels`, content: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideLayout" Target="../slideLayouts/slideLayout1.xml"/></Relationships>` });
  });
  return makeZip(files);
}

function downloadPptx(filename, slides) {
  downloadFile(filename, buildPptx(slides), "application/vnd.openxmlformats-officedocument.presentationml.presentation");
}


// 새 로트 폼의 초기값 — 거래처는 코드에 박아두지 않고, 지금 등록돼 있는 목록에서 가져와요.
// (예전에는 기본 목록의 첫 거래처가 박혀 있어서, 등록 관리에서 지워도 계속 다시 나타났어요.)
const newLotForm = (master) => {
  const vendors = (master && master.vendors) || [];
  const first = vendors[0];
  return {
    code: CATEGORIES[0].code, name: "", categoryId: CATEGORIES[0].id,
    vendor: first ? first.name : "", shipLoc: first ? (first.loc || "") : "",
    lotNo: "", receivedDate: new Date().toISOString().slice(0, 10),
    stage: "raw_in", qtyKg: "", waterKg: "", excludeKg: "", tolling: false, carriedOver: false,
  };
};

// 색은 전부 스타일시트의 .ivs-root[data-theme="dark"|"light"] 토큰에서 와요 (인라인 변수 없음).

function InventorySystem() {
  const [activeTab, setActiveTab] = useState(MENU_ITEMS[0].key); // 메뉴 첫 항목 = 생산계획
  // 부트스트랩(bootstrap())이 렌더 전에 Firebase에서 한 번 읽어온 값으로 시작해요. 그 뒤로는
  // 실시간 구독(subscribeLive)이 변경분을 계속 밀어줘요 — 별도의 "로컬 저장" 개념이 아예 없어요.
  const [lots, setLots] = useState(() => LIVE_DATA.lots);
  const [moves, setMoves] = useState(() => LIVE_DATA.moves); // 공정이동(후속공정) 이력 — 생산 탭에서 분석용으로 사용
  const [saving, setSaving] = useState(false);
  const [toast, setToast] = useState(null);

  const [filters, setFilters] = useState({
    search: "", dateFrom: "", dateTo: "", year: "all",
    tollingOnly: false, stage: "all", category: "all",
  });
  const [sort, setSort] = useState({ key: "receivedDate", dir: "desc" });
  const [selected, setSelected] = useState(() => new Set());
  const [openMenuId, setOpenMenuId] = useState(null);

  const [formModal, setFormModal] = useState(null); // { mode: 'add'|'edit', values }
  const [moveModal, setMoveModal] = useState(null); // lot
  const [bulkMoveOpen, setBulkMoveOpen] = useState(false); // 여러 로트를 한 번에 공정이동
  const [importOpen, setImportOpen] = useState(false); // 파일로 입고 Lot 한 번에 추가
  const [scanOpen, setScanOpen] = useState(false); // QR 리더기로 찍어서 즉시 입고
  const [deleteTarget, setDeleteTarget] = useState(null); // lot | 'bulk'
  const [resetConfirm, setResetConfirm] = useState(false);
  const [clearMovesConfirm, setClearMovesConfirm] = useState(false);
  const [settings, setSettingsState] = useState(() => LIVE_DATA.settings);
  const [settingsModalOpen, setSettingsModalOpen] = useState(false);
  const [master, setMaster] = useState(() => LIVE_DATA.master); // 거래처 · 품목코드 등록 정보
  const [mes, setMes] = useState(() => LIVE_DATA.mes); // 생산관리(계획·교대·설비) 설정
  const [runs, setRuns] = useState(() => LIVE_DATA.runs); // 생산실적 (투입↔산출 Lot 연결 포함)
  const [downs, setDowns] = useState(() => LIVE_DATA.downs); // 비가동 기록 (설비 · 유형 · 분)
  // 생산실적이 어느 달을 보고 있는지 — 화면 제목을 "9월 생산실적"처럼 쓰려고 위로 올렸어요.
  const [actYm, setActYm] = useState(() => new Date().toISOString().slice(0, 10).slice(0, 7));
  const [masterModalOpen, setMasterModalOpen] = useState(false);
  const [unlocked, setUnlocked] = useState(false); // 세션에서만 유지 (보안을 위해 저장하지 않음)
  const [viewUnlocked, setViewUnlocked] = useState(false); // 세션에서만 유지
  const canEdit = !settings.editPin || unlocked;
  // 보기 잠금 — 걸려있으면 이 PIN을 맞히기 전까지는 화면 전체가 잠금 화면 하나만 보여요 (재고 데이터 자체가 안 보임).
  // 편집 잠금(editPin)과는 별개예요: 팀원에게는 이 보기 PIN만 알려주면 되고, 편집 PIN은 관리자만 알면 돼요.
  const viewGateEnabled = !!settings.viewPin;

  const [liveStatus, setLiveStatus] = useState("connecting"); // "connecting" | "connected" | "reconnecting"

  // 다크/화이트 모드 — 이 브라우저에만 저장돼요 (사람마다 다르게 볼 수 있게).
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem(THEME_KEY) === "light" ? "light" : "dark"; } catch (e) { return "dark"; }
  });
  useEffect(() => {
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
    // 페이지 바깥(브라우저 스크롤 영역) 배경도 테마에 맞춰줘요.
    document.body.style.background = theme === "light" ? "#F3F6FA" : "#0B0E14";
  }, [theme]);

  // QR 라벨 출력 대상 로트 목록 (모달로 띄워요)
  const [labelLots, setLabelLots] = useState(null);

  // ---------- 실시간 구독: 누군가 Firebase에 쓰면 1초 안에 모두에게 반영돼요 ----------
  useEffect(() => {
    if (PREVIEW_MODE) { setLiveStatus("connected"); return; }
    const unsubscribe = subscribeLive((data) => {
      setLots(data.lots);
      setMoves(data.moves);
      setSettingsState(data.settings);
      setMaster(data.master);
      setMes(data.mes);
      setRuns(data.runs);
      setDowns(data.downs);
    }, setLiveStatus);
    return unsubscribe;
  }, []);

  const showToast = useCallback((msg, type = "info") => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 2600);
  }, []);

  // 수동 새로고침 — 평소엔 실시간 구독이 알아서 반영하지만, 혹시 연결이 끊겼다 싶을 때 안전판으로 둬요.
  const manualRefresh = useCallback(async () => {
    if (PREVIEW_MODE) { showToast("미리보기 화면이라 샘플 데이터만 보여줘요.", "info"); return; }
    const data = await fetchLive();
    if (!data) { showToast("새로고침에 실패했어요. 네트워크를 확인해주세요.", "error"); return; }
    setLots(data.lots);
    setMoves(data.moves);
    setSettingsState(data.settings);
    setMaster(data.master);
    setMes(data.mes);
    setRuns(data.runs);
    setDowns(data.downs);
    showToast("최신 데이터로 새로고침했어요.", "success");
  }, [showToast]);

  // 모든 쓰기는 lots/moves/settings/master 네 조각을 통째로 합쳐서 Firebase에 한 번에 PUT해요.
  // (부분만 따로 쓰면, 같은 동작 안에서 두 조각을 연달아 쓸 때 옛 값으로 덮어쓰는 경합이 생길 수 있어서
  //  항상 "지금 이 순간의 완성된 전체 값"을 명시적으로 만들어서 써요.)
  const writeAll = useCallback(async (next) => {
    if (PREVIEW_MODE) return; // 미리보기: 화면 상태만 바뀌고 실제 데이터에는 저장되지 않아요
    setSaving(true);
    try {
      await writeLive(next);
    } catch (e) {
      showToast("저장에 실패했어요. 네트워크를 확인해주세요.", "error");
    } finally {
      setSaving(false);
    }
  }, [showToast]);

  const persist = useCallback(async (nextLots) => {
    if (!canEdit) return;
    setLots(nextLots);
    await writeAll({ lots: nextLots, moves, settings, master, mes, runs, downs });
  }, [canEdit, moves, settings, master, mes, runs, downs, writeAll]);

  const persistMoves = useCallback(async (nextMoves) => {
    if (!canEdit) return;
    setMoves(nextMoves);
    await writeAll({ lots, moves: nextMoves, settings, master, mes, runs, downs });
  }, [canEdit, lots, settings, master, mes, runs, downs, writeAll]);

  const persistMaster = useCallback(async (nextMaster, msg) => {
    if (!canEdit) return;
    setMaster(nextMaster);
    await writeAll({ lots, moves, settings, master: nextMaster, mes, runs, downs });
    if (msg) showToast(msg, "success");
  }, [canEdit, lots, moves, settings, mes, runs, downs, writeAll, showToast]);

  const persistMes = useCallback(async (nextMes, msg) => {
    if (!canEdit) return;
    setMes(nextMes);
    await writeAll({ lots, moves, settings, master, mes: nextMes, runs, downs });
    if (msg) showToast(msg, "success");
  }, [canEdit, lots, moves, settings, master, runs, downs, writeAll, showToast]);

  const persistSettings = useCallback(async (nextSettings) => {
    setSettingsState(nextSettings);
    await writeAll({ lots, moves, settings: nextSettings, master, mes, runs, downs });
    showToast("설정을 저장했어요.", "success");
  }, [lots, moves, master, mes, runs, downs, writeAll, showToast]);

  // ---------- CRUD ----------
  const handleSaveForm = async (values) => {
    const qtyKg = Number(values.qtyKg);
    if (!values.code || !values.lotNo || !qtyKg) {
      showToast("품목코드 · 입고 Lot · 수량은 필수예요.", "error");
      return;
    }
    const payload = {
      ...values,
      qtyKg,
      waterKg: values.waterKg === "" ? null : Number(values.waterKg),
      excludeKg: values.excludeKg === "" ? null : Number(values.excludeKg),
    };
    if (formModal.mode === "add") {
      const newLot = { ...payload, id: uid(), lastMove: null };
      await persist([newLot, ...lots]);
      showToast("새 로트를 추가했어요.", "success");
    } else {
      await persist(lots.map((l) => (l.id === payload.id ? { ...l, ...payload } : l)));
      showToast("로트 정보를 수정했어요.", "success");
    }
    setFormModal(null);
  };

  const handleImportLots = async (newLots) => {
    if (!canEdit || newLots.length === 0) return;
    const stamped = newLots.map((l, i) => ({ ...l, id: `lot-${Date.now()}-${i}-${Math.random().toString(36).slice(2, 6)}`, lastMove: null }));
    await persist([...stamped, ...lots]);
    showToast(`${stamped.length}건을 추가했어요.`, "success");
    setImportOpen(false);
  };

  // QR 스캔 · 연번으로 만든 Lot 등록 — 파일 업로드와 같은 경로로 저장돼요.
  const handleScanIn = async (newLots) => {
    if (!canEdit || newLots.length === 0) return;
    const stamped = newLots.map((l, i) => ({ ...l, id: `lot-${Date.now()}-${i}-${Math.random().toString(36).slice(2, 6)}`, lastMove: null }));
    await persist([...stamped, ...lots]);
    const kg = stamped.reduce((a, l) => a + (Number(l.qtyKg) || 0), 0);
    showToast(`${stamped.length}건 · ${kg.toLocaleString("ko-KR")} Kg 입고 등록했어요.`, "success");
    setScanOpen(false);
  };

  const handleDelete = async () => {
    if (deleteTarget === "bulk") {
      await persist(lots.filter((l) => !selected.has(l.id)));
      showToast(`${selected.size}건을 삭제했어요.`, "success");
      setSelected(new Set());
    } else if (deleteTarget) {
      await persist(lots.filter((l) => l.id !== deleteTarget.id));
      showToast("로트를 삭제했어요.", "success");
    }
    setDeleteTarget(null);
  };

  // lots와 moves를 동시에 바꿀 때는 반드시 한 번의 writeAll로 합쳐서 써요 — persist()와 persistMoves()를
  // 따로 연달아 부르면 두 번째 호출이 첫 번째가 바꾼 lots를 못 본 채로 옛 값을 덮어쓸 수 있어요.
  const handleMoveStage = async (lot, targetStage, outputQty) => {
    if (!canEdit) return;
    const today = new Date().toISOString().slice(0, 10);
    const inputQty = lot.qtyKg;
    const diff = outputQty - inputQty;
    const nextLots = lots.map((l) => (l.id === lot.id ? { ...l, stage: targetStage, qtyKg: outputQty, lastMove: today } : l));
    const nextMoves = [
      {
        id: `move-${Date.now()}`, date: today, code: lot.code, name: lot.name, lotNo: lot.lotNo, lotId: lot.id,
        fromStage: lot.stage, toStage: targetStage, inputQty, outputQty,
        lossQty: diff < 0 ? -diff : 0, mixQty: diff > 0 ? diff : 0,
      },
      ...moves,
    ];
    setLots(nextLots);
    setMoves(nextMoves);
    await writeAll({ lots: nextLots, moves: nextMoves, settings, master, mes, runs, downs });
    showToast(`${lot.lotNo} → "${getStage(targetStage).label}"로 이동했어요.`, "success");
    setMoveModal(null);
  };

  // 여러 로트를 한 번에 다음 공정으로 — 로트마다 배출 수량을 따로 넣을 수 있어요.
  // 단건 이동과 똑같이 lots와 moves를 한 번의 writeAll로 합쳐서 써요.
  const handleBulkMove = async (targetStage, qtyByLotId) => {
    if (!canEdit) return;
    const today = new Date().toISOString().slice(0, 10);
    const targets = lots.filter((l) => selected.has(l.id) && l.stage !== targetStage);
    if (targets.length === 0) { setBulkMoveOpen(false); return; }
    const byId = new Map(targets.map((l) => [l.id, l]));
    const nextLots = lots.map((l) => {
      if (!byId.has(l.id)) return l;
      const out = Number(qtyByLotId[l.id]);
      return { ...l, stage: targetStage, qtyKg: Number.isFinite(out) && out > 0 ? out : l.qtyKg, lastMove: today };
    });
    const newMoves = targets.map((l, i) => {
      const inputQty = Number(l.qtyKg) || 0;
      const parsed = Number(qtyByLotId[l.id]);
      const outputQty = Number.isFinite(parsed) && parsed > 0 ? parsed : inputQty;
      const diff = outputQty - inputQty;
      return {
        id: `move-${Date.now()}-${i}`, date: today, code: l.code, name: l.name, lotNo: l.lotNo, lotId: l.id,
        fromStage: l.stage, toStage: targetStage, inputQty, outputQty,
        lossQty: diff < 0 ? -diff : 0, mixQty: diff > 0 ? diff : 0,
      };
    });
    const nextMoves = [...newMoves, ...moves];
    setLots(nextLots);
    setMoves(nextMoves);
    await writeAll({ lots: nextLots, moves: nextMoves, settings, master, mes, runs, downs });
    showToast(`${targets.length}건을 "${getStage(targetStage).label}"로 이동했어요.`, "success");
    setBulkMoveOpen(false);
    setSelected(new Set());
  };

  // ---------- 비가동 기록 ----------
  const handleSaveDown = async (draft) => {
    if (!canEdit) return;
    const rec = { ...draft, id: `dt-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`, min: Number(draft.min) || 0 };
    const nextDowns = [rec, ...downs];
    setDowns(nextDowns);
    await writeAll({ lots, moves, settings, master, mes, runs, downs: nextDowns });
    showToast(`${eqShort(rec.eqId)} · ${rec.major} — ${fmtMin(rec.min)} 정지로 기록했어요.`, "success");
  };
  const handleDeleteDown = async (id) => {
    if (!canEdit) return;
    const nextDowns = downs.filter((d) => d.id !== id);
    setDowns(nextDowns);
    await writeAll({ lots, moves, settings, master, mes, runs, downs: nextDowns });
    showToast("비가동 기록을 지웠어요.", "success");
  };

  // ---------- 출하 처리 ----------
  // 고른 출하대기 Lot을 한 번에 "출하완료"로 넘겨요. 출하일자를 로트에 남겨두기 때문에
  // 나중에 "몇 월에 얼마나 나갔는지"를 이동이력이 아니라 로트만 보고도 셀 수 있어요.
  const handleShip = async (lotIds, shipDate) => {
    if (!canEdit || !lotIds || lotIds.length === 0) return;
    const ids = new Set(lotIds);
    const targets = lots.filter((l) => ids.has(l.id));
    if (targets.length === 0) return;
    const nextLots = lots.map((l) => (ids.has(l.id) ? { ...l, stage: "shipped", shippedDate: shipDate, lastMove: shipDate } : l));
    const newMoves = targets.map((l, i) => ({
      id: `move-${Date.now()}-sh${i}`, date: shipDate, code: l.code, name: l.name, lotNo: l.lotNo, lotId: l.id,
      fromStage: l.stage, toStage: "shipped", inputQty: Number(l.qtyKg) || 0, outputQty: Number(l.qtyKg) || 0,
      lossQty: 0, mixQty: 0,
    }));
    const nextMoves = [...newMoves, ...moves];
    setLots(nextLots);
    setMoves(nextMoves);
    await writeAll({ lots: nextLots, moves: nextMoves, settings, master, mes, runs, downs });
    const kg = targets.reduce((a, l) => a + (Number(l.qtyKg) || 0), 0);
    showToast(`${targets.length}건 · ${kg.toLocaleString("ko-KR", { maximumFractionDigits: 1 })} Kg를 ${shipDate}자로 출하완료 처리했어요.`, "success");
  };

  // ---------- 생산실적 등록 ----------
  // 한 번의 저장으로 네 가지가 동시에 일어나요:
  //  1) 투입한 입고 Lot → "생산투입완료"로 (현재고에서 빠짐, 데이터는 남음)
  //  2) 산출물별로 새 생산 Lot 생성 → "출하대기"
  //  3) 투입↔산출을 서로 기억하게 해서 Lot 추적이 되게
  //  4) 공정이동 이력에도 기록 (생산 탭 통계와 어긋나지 않게)
  const handleSaveRun = async (draft) => {
    if (!canEdit) return;
    const date = draft.date;
    const inputLots = lots.filter((l) => draft.inputIds.includes(l.id));
    if (inputLots.length === 0) { showToast("투입할 입고 Lot을 골라주세요.", "error"); return; }
    const inputKg = inputLots.reduce((a, l) => a + (Number(l.qtyKg) || 0), 0);

    const runId = `run-${Date.now()}`;
    const stamp = date.replace(/-/g, "").slice(2); // YYMMDD
    const usedLotNos = new Set(lots.map((l) => l.lotNo));
    const outputs = [];
    OUTPUT_KINDS.forEach((k) => {
      const qty = Number(draft.outputs[k.key]);
      if (!Number.isFinite(qty) || qty <= 0) return;
      const cat = categoryById[k.categoryId];
      let seq = 1, lotNo = "";
      do { lotNo = `${k.code}-${stamp}-${seq}`; seq += 1; } while (usedLotNos.has(lotNo));
      usedLotNos.add(lotNo);
      outputs.push({
        id: `lot-${Date.now()}-${k.key}-${Math.random().toString(36).slice(2, 6)}`,
        code: k.code, name: cat ? cat.label : k.label, categoryId: k.categoryId,
        vendor: inputLots[0].vendor || "", shipLoc: inputLots[0].shipLoc || "",
        lotNo, receivedDate: date, stage: "usable", qtyKg: qty,
        waterKg: null, excludeKg: null, tolling: false, carriedOver: false,
        lastMove: date,
        origin: "production", // 외부에서 사온 게 아니라 우리가 만든 Lot
        runId, parentLotNos: inputLots.map((l) => l.lotNo), // ← Lot 추적 (역추적)
      });
    });
    if (outputs.length === 0) { showToast("산출량을 하나 이상 입력해주세요.", "error"); return; }

    const inputIdSet = new Set(draft.inputIds);
    const nextLots = [
      ...outputs,
      ...lots.map((l) => (inputIdSet.has(l.id)
        ? { ...l, stage: "consumed", lastMove: date, runId } // ← Lot 추적 (정추적)
        : l)),
    ];
    const nextMoves = [
      ...inputLots.map((l, i) => ({
        id: `move-${Date.now()}-in${i}`, date, code: l.code, name: l.name, lotNo: l.lotNo, lotId: l.id,
        fromStage: l.stage, toStage: "consumed", inputQty: Number(l.qtyKg) || 0, outputQty: Number(l.qtyKg) || 0,
        lossQty: 0, mixQty: 0, runId,
      })),
      ...moves,
    ];
    const run = {
      id: runId, date, shift: draft.shift, crew: draft.crew, workers: Number(draft.workers) || 0,
      note: draft.note || "",
      inputs: inputLots.map((l) => ({ lotId: l.id, lotNo: l.lotNo, code: l.code, name: l.name, qtyKg: Number(l.qtyKg) || 0 })),
      inputKg,
      outputs: outputs.map((o) => {
        const kind = OUTPUT_KINDS.find((k) => k.code === o.code);
        return { kind: kind.key, lotId: o.id, lotNo: o.lotNo, code: o.code, qtyKg: o.qtyKg };
      }),
    };
    const nextRuns = [run, ...runs];
    setLots(nextLots); setMoves(nextMoves); setRuns(nextRuns);
    await writeAll({ lots: nextLots, moves: nextMoves, settings, master, mes, runs: nextRuns, downs });
    showToast(`생산실적을 등록했어요 — 투입 ${inputLots.length}건 → 생산 Lot ${outputs.length}건 생성`, "success");
  };

  // 생산실적 삭제 — 되돌리기. 만들었던 생산 Lot을 지우고, 투입했던 Lot을 원래 공정으로 되돌려요.
  const handleDeleteRun = async (runId) => {
    if (!canEdit) return;
    const run = runs.find((r) => r.id === runId);
    if (!run) return;
    const madeIds = new Set(run.outputs.map((o) => o.lotId));
    const backTo = new Map();
    moves.filter((m) => m.runId === runId && m.toStage === "consumed").forEach((m) => backTo.set(m.lotId, m.fromStage));
    const nextLots = lots
      .filter((l) => !madeIds.has(l.id))
      .map((l) => (backTo.has(l.id)
        ? { ...l, stage: backTo.get(l.id), runId: undefined, lastMove: null }
        : l));
    const nextMoves = moves.filter((m) => m.runId !== runId);
    const nextRuns = runs.filter((r) => r.id !== runId);
    setLots(nextLots); setMoves(nextMoves); setRuns(nextRuns);
    await writeAll({ lots: nextLots, moves: nextMoves, settings, master, mes, runs: nextRuns, downs });
    showToast("생산실적을 취소하고 투입 Lot을 되돌렸어요.", "success");
  };

  // "초기화"는 지금 팀 전체가 실시간으로 보고 있는 데이터 자체를 비우는 거예요 — 되돌릴 수 없어요.
  const handleReset = async () => {
    if (!canEdit) return;
    setLots([]);
    setMoves([]);
    setRuns([]);
    setDowns([]);
    await writeAll({ lots: [], moves: [], settings, master, mes, runs: [], downs: [] });
    setSelected(new Set());
    showToast("전체 데이터를 초기화했어요.", "success");
    setResetConfirm(false);
  };

  // 공정이동 이력만 따로 비우기 — 로트(재고현황) 자체와는 별개의 기록이라, 로트를 지워도 여기 남아있던 옛 이동 기록이
  // "생산" 탭 통계에 계속 잡히는 걸 헷갈려하는 경우가 있어서 이력만 초기화할 수 있게 했어요.
  const handleClearMoves = async () => {
    await persistMoves([]);
    showToast("공정이동 이력을 모두 지웠어요.", "success");
    setClearMovesConfirm(false);
  };

  // 이력 중 고른 것만 삭제 — 로트(재고현황)는 그대로 두고 기록만 지워요.
  // 이미 반영된 로트의 단계·수량은 되돌리지 않아요 (기록만 없어져요).
  const handleDeleteMoves = async (ids) => {
    if (!canEdit || !ids || ids.length === 0) return;
    const drop = new Set(ids);
    await persistMoves(moves.filter((m) => !drop.has(m.id)));
    showToast(`공정이동 이력 ${ids.length}건을 지웠어요.`, "success");
  };

  // ---------- 필터/정렬 ----------
  const years = useMemo(() => {
    const s = new Set(lots.map((l) => l.receivedDate?.slice(0, 4)).filter(Boolean));
    return Array.from(s).sort().reverse();
  }, [lots]);

  const filtered = useMemo(() => {
    const words = filters.search.trim().toLowerCase().split(/\s+/).filter(Boolean);
    let rows = lots.filter((l) => {
      if (words.length) {
        const hay = [l.code, l.name, categoryById[l.categoryId]?.label, l.vendor, l.shipLoc, l.lotNo]
          .join(" ").toLowerCase();
        if (!words.every((w) => hay.includes(w))) return false;
      }
      if (filters.dateFrom && l.receivedDate < filters.dateFrom) return false;
      if (filters.dateTo && l.receivedDate > filters.dateTo) return false;
      if (filters.year !== "all" && l.receivedDate?.slice(0, 4) !== filters.year) return false;
      if (filters.tollingOnly && !l.tolling) return false;
      if (filters.stage !== "all" && l.stage !== filters.stage) return false;
      if (filters.category !== "all" && l.categoryId !== filters.category) return false;
      return true;
    });
    rows.sort((a, b) => {
      const dir = sort.dir === "asc" ? 1 : -1;
      const av = a[sort.key], bv = b[sort.key];
      if (av == null) return 1;
      if (bv == null) return -1;
      return av > bv ? dir : av < bv ? -dir : 0;
    });
    return rows;
  }, [lots, filters, sort]);

  const resetFilters = () =>
    setFilters({ search: "", dateFrom: "", dateTo: "", year: "all", tollingOnly: false, stage: "all", category: "all" });

  const toggleSort = (key) =>
    setSort((s) => (s.key === key ? { key, dir: s.dir === "asc" ? "desc" : "asc" } : { key, dir: "asc" }));

  // ---------- 집계 (항상 전체 데이터 기준 — 표 필터와 무관한 개요) ----------
  // 단계별 수량과 함께 건수도 세요 (파이프라인 카드에 "12건"으로 표시).
  const stageTotals = useMemo(() => {
    const map = Object.fromEntries(STAGES.map((s) => [s.key, { kg: 0, count: 0 }]));
    lots.forEach((l) => {
      const bucket = map[l.stage];
      if (!bucket) return; // 삭제된 옛 단계로 저장된 로트는 파이프라인 집계에서 제외 (데이터는 그대로 남아요)
      bucket.kg += Number(l.qtyKg) || 0;
      bucket.count += 1;
    });
    return map;
  }, [lots]);

  const retiredCount = useMemo(() => lots.filter((l) => !stageByKey[l.stage]).length, [lots]);

  // 파이프라인 카드 아래 막대는 "가장 많은 단계"를 100%로 잡아 상대 비교해요.
  const pipeMax = useMemo(() => Math.max(...STAGES.map((s) => stageTotals[s.key].kg), 0), [stageTotals]);

  const bottleneckKey = useMemo(() => {
    let best = null, bestVal = -1;
    STAGES.forEach((s) => { if (stageTotals[s.key].kg > bestVal) { bestVal = stageTotals[s.key].kg; best = s.key; } });
    return bestVal > 0 ? best : null;
  }, [stageTotals]);

  const totals = useMemo(() => {
    // "총 입고량"은 밖에서 사온 것만 세요. 우리가 만든 생산 Lot까지 더하면 같은 물량을 두 번 세게 돼요.
    const totalIn = lots.filter((l) => l.origin !== "production").reduce((sum, l) => sum + (Number(l.qtyKg) || 0), 0);
    const produced = lots.filter((l) => l.origin === "production").reduce((sum, l) => sum + (Number(l.qtyKg) || 0), 0);
    const inProgress = lots.filter((l) => !FINAL_STAGE_KEYS.includes(l.stage)).reduce((s, l) => s + (Number(l.qtyKg) || 0), 0);
    const done = lots.filter((l) => FINAL_STAGE_KEYS.includes(l.stage)).reduce((s, l) => s + (Number(l.qtyKg) || 0), 0);
    return { totalIn, produced, inProgress, done, count: lots.length };
  }, [lots]);

  // ---------- 전일 대비 증감 ----------
  // 별도의 일별 스냅샷을 저장하지 않고, 공정이동 이력을 거슬러 올라가 "어제 이 시각의 상태"를 재구성해서 비교해요.
  // (그래서 이동 이력이 없는 초기 데이터에서는 증감이 0으로 보일 수 있어요.)
  const dayDelta = useMemo(() => {
    const y = new Date();
    y.setDate(y.getDate() - 1);
    const asOf = y.toISOString().slice(0, 10);
    const movesByLot = new Map();
    moves.forEach((m) => {
      const key = m.lotId || m.lotNo;
      if (!movesByLot.has(key)) movesByLot.set(key, []);
      movesByLot.get(key).push(m);
    });
    let prevTotal = 0, prevInProg = 0, prevCount = 0;
    // 단계별로도 어제 값을 모아둬요 — 공정별 재고현황 카드마다 증감을 보여주려고요.
    const prevByStage = Object.fromEntries(STAGES.map((st) => [st.key, { kg: 0, count: 0 }]));
    lots.forEach((l) => {
      const lotMoves = movesByLot.get(l.id) || movesByLot.get(l.lotNo) || [];
      const st = reconstructLotState(l, lotMoves, asOf);
      if (!st) return; // 어제 시점엔 아직 입고 전
      const kg = Number(st.qtyKg) || 0;
      prevTotal += kg;
      prevCount += 1;
      if (!FINAL_STAGE_KEYS.includes(st.stage)) prevInProg += kg;
      const bucket = prevByStage[st.stage];
      if (bucket) { bucket.kg += kg; bucket.count += 1; }
    });
    const byStage = Object.fromEntries(STAGES.map((st) => {
      const now = stageTotals[st.key] || { kg: 0, count: 0 };
      const was = prevByStage[st.key];
      return [st.key, { kg: now.kg - was.kg, count: now.count - was.count, prevKg: was.kg }];
    }));
    return {
      asOf, byStage,
      totalKg: totals.totalIn - prevTotal,
      inProgKg: totals.inProgress - prevInProg,
      count: lots.length - prevCount,
      prevTotal, prevInProg, prevCount,
    };
  }, [lots, moves, totals, stageTotals]);

  // ---------- 엑셀(.xlsx)로 내보내기 ----------
  const exportCsv = () => {
    const headers = ["품목코드", "품목명", "카테고리", "거래처", "출고지", "입고 Lot", "주차", "현재공정", "수량(Kg)", "물중량(Kg)", "제외무게(Kg)", "입고일", "공정이동", "톨링품", "이월"];
    const rows = filtered.map((l) => [
      l.code, l.name, categoryById[l.categoryId]?.label || "", l.vendor, l.shipLoc, l.lotNo, weekLabel(l.receivedDate),
      getStage(l.stage).label, l.qtyKg, l.waterKg ?? "", l.excludeKg ?? "", l.receivedDate, l.lastMove ?? "",
      l.tolling ? "Y" : "", l.carriedOver ? "Y" : "",
    ]);
    const today = new Date().toISOString().slice(0, 10);
    const widths = [11, 20, 14, 20, 11, 16, 18, 13, 14, 13, 14, 12, 13, 9, 7];
    downloadXlsx(`재고현황_${today}.xlsx`, `재고현황 ${today}`, [headers, ...rows], widths);
    showToast("엑셀 파일로 내보냈어요.", "success");
  };


  // QR 라벨은 "체크한 LOT"을 기준으로 뽑아요. 표 필터를 바꿔도 체크는 유지되니, 여러 단계에서 골라 한 번에 뽑을 수 있어요.
  const selectedLots = useMemo(() => lots.filter((l) => selected.has(l.id)), [lots, selected]);

  const allVisibleSelected = filtered.length > 0 && filtered.every((l) => selected.has(l.id));
  const toggleSelectAll = () => {
    if (allVisibleSelected) setSelected(new Set());
    else setSelected(new Set(filtered.map((l) => l.id)));
  };
  const toggleSelectOne = (id) => {
    const next = new Set(selected);
    next.has(id) ? next.delete(id) : next.add(id);
    setSelected(next);
  };

  // 보기 잠금이 걸려있고 아직 안 풀렸으면, 재고 데이터는 전혀 렌더링하지 않고 PIN 입력 화면만 보여줘요.
  if (viewGateEnabled && !viewUnlocked) {
    return html`<${ViewGate} correctPin=${settings.viewPin} title=${settings.title} theme=${theme} onUnlock=${() => setViewUnlocked(true)} />`;
  }

  return html`
    <div className=${`ivs-root ivs-layout-${LAYOUT}`} data-theme=${theme}>
      ${LAYOUT === "sidebar" ? html`
        <aside className="ivs-side">
          <div className="ivs-side-brand">
            <span className="ivs-side-logo">DRT</span>
            <div>
              <b>${settings.title}</b>
              <span>리사이클링 생산·재고관리</span>
            </div>
          </div>
          <nav className="ivs-side-nav">
            ${MENU_GROUPS.map((g) => html`
              <${Fragment} key=${g.title}>
                <div className="ivs-side-group">${g.title}</div>
                ${g.items.map((m) => html`
                  <button
                    key=${m.key} type="button"
                    className=${`ivs-side-link ${activeTab === m.key ? "on" : ""}`}
                    onClick=${() => setActiveTab(m.key)}
                  >
                    <${Icon} name=${m.icon} size=${15} />${m.label}
                  </button>
                `)}
              <//>
            `)}
          </nav>
          <div className="ivs-side-foot">
            ${liveStatus === "connected" ? "실시간 연결됨" : liveStatus === "connecting" ? "연결 중…" : "재연결 중…"}
          </div>
        </aside>
      ` : null}
      <div className="ivs-shell">
      ${PREVIEW_MODE ? html`
        <div className="ivs-preview-banner ivs-print-hide">
          <${AlertTriangle} size=${14} />
          <span><b>승인용 미리보기</b> — 샘플 데이터로 디자인만 확인하는 화면이에요. 실제 팀 데이터(/v2/)는 전혀 바뀌지 않고, 여기서 무엇을 눌러도 저장되지 않아요.</span>
        </div>
      ` : null}
      <div className="ivs-header">
        <div>
          <div className="ivs-title-row">
            <h1 className="ivs-title">
              ${LAYOUT === "sidebar"
                ? (activeTab === "act" ? `${Number(actYm.slice(5))}월 생산실적` : menuLabel(activeTab))
                : settings.title}
            </h1>
            <button className="ivs-icon-btn ivs-title-edit" onClick=${() => setSettingsModalOpen(true)} title="설정 (이름 변경 · 편집 잠금)">
              <${SettingsIcon} size=${14} />
            </button>
            ${liveStatus === "connected"
              ? html`<span className="ivs-chip ok"><${Check} size=${12} /> 실시간 연결됨</span>`
              : html`<span className="ivs-chip neutral"><${Loader2} size=${12} className="ivs-spin" /> ${liveStatus === "connecting" ? "연결 중…" : "재연결 중…"}</span>`}
            ${settings.editPin ? (canEdit
              ? html`<span className="ivs-chip ok"><${Unlock} size=${12} /> 편집 가능</span>`
              : html`<span className="ivs-chip neutral"><${Lock} size=${12} /> 보기 전용</span>`)
              : null}
            ${saving ? html`<span className="ivs-saving"><${Loader2} size=${12} className="ivs-spin" /> 저장 중</span>` : null}
          </div>
          <p className="ivs-subtitle">${LAYOUT === "sidebar" ? (PAGE_SUB[activeTab] || settings.subtitle) : settings.subtitle}</p>
        </div>
        <div className="ivs-header-actions">
          <button
            className="ivs-btn ivs-btn-icon"
            onClick=${() => setTheme((t) => (t === "dark" ? "light" : "dark"))}
            title=${theme === "dark" ? "화이트 모드로 보기" : "다크 모드로 보기"}
            aria-label=${theme === "dark" ? "화이트 모드로 보기" : "다크 모드로 보기"}
          >
            ${theme === "dark" ? html`<${Sun} size=${14} />` : html`<${Moon} size=${14} />`}
            ${theme === "dark" ? "화이트" : "다크"}
          </button>
          <button className="ivs-btn" onClick=${manualRefresh} title="실시간 구독이 끊긴 것 같을 때 수동으로 최신 데이터를 다시 불러와요">
            <${RefreshCw} size=${14} /> 새로고침
          </button>
          ${canEdit && activeTab === "inventory" ? html`
            <button className="ivs-btn" onClick=${() => setMasterModalOpen("vendors")} title="거래처 · 품목코드 등록">
              <${FileText} size=${14} /> 등록 관리
            </button>
            <button className="ivs-btn" onClick=${() => setResetConfirm(true)} title="전체 데이터 초기화 (모두에게 실시간 반영)">
              <${RotateCcw} size=${14} /> 초기화
            </button>
            <button className="ivs-btn" onClick=${() => setImportOpen(true)} title="엑셀·CSV·QR 라벨기 파일로 여러 건을 한 번에 추가해요">
              <${FileText} size=${14} /> 파일로 한 번에 추가
            </button>
            <button className="ivs-btn" onClick=${() => setScanOpen(true)} title="QR 리더기로 찍으면 바로 입고 등록 · 연번 Lot 일괄 생성">
              <${Icon} name="qr-code" size=${14} /> QR 스캔 입고
            </button>
            <button className="ivs-btn ivs-btn-primary" onClick=${() => setFormModal({ mode: "add", values: newLotForm(master) })}>
              <${Plus} size=${14} /> 새 로트 추가
            </button>
          ` : null}
        </div>
      </div>

      ${LAYOUT === "tabs" ? html`
        <div className="ivs-tabbar">
          ${MENU_GROUPS.map((g) => html`
            <div className="ivs-tabgroup" key=${g.title}>
              <span className="ivs-tabgroup-t">${g.title}</span>
              <div className="ivs-tabs">
                ${g.items.map((m) => html`
                  <button key=${m.key} type="button"
                    className=${`ivs-tab ${activeTab === m.key ? "active" : ""}`}
                    onClick=${() => setActiveTab(m.key)}>${m.label}</button>
                `)}
              </div>
            </div>
          `)}
        </div>
      ` : null}

      ${activeTab === "inventory" ? html`
        <div className="ivs-kpis">
          <${SummaryCard}
            label="총 입고량"
            value=${fmtTon(totals.totalIn)} unit="톤"
            icon=${html`<${Package} size=${13} />`}
            delta=${html`<${Delta} kg=${dayDelta.totalKg} count=${dayDelta.count} />`}
            sub=${`외부 입고분 · 우리가 만든 생산 Lot ${fmtTon(totals.produced)} 톤은 따로예요`}
          />
          <${SummaryCard}
            label="현재고"
            value=${fmtTon(totals.inProgress)} unit="톤" accent=${true}
            icon=${html`<${Layers} size=${13} />`}
            delta=${html`<${Delta} kg=${dayDelta.inProgKg} />`}
            sub=${`출하완료 제외 (열분해대기 포함) · 어제 ${fmtTon(dayDelta.prevInProg)} 톤`}
          />
          <${SummaryCard}
            label="출하대기"
            value=${fmtTon(stageTotals.usable.kg)} unit="톤"
            icon=${html`<${QrCode} size=${13} />`}
            sub=${`${stageTotals.usable.count} lot · 라벨 출력 대상`}
          />
          <${SummaryCard}
            label="출하완료 (누적)"
            value=${fmtTon(stageTotals.shipped.kg)} unit="톤"
            icon=${html`<${Check} size=${13} />`}
            sub=${`${stageTotals.shipped.count} lot 출고 완료`}
          />
        </div>

        <div className="ivs-card">
          <div className="ivs-card-head-row">
            <h2 className="ivs-section-title">공정별 재고현황</h2>
            <span className="ivs-section-hint">카드를 누르면 아래 표가 그 단계만 보여줘요 · 증감은 어제 같은 시각 대비예요${retiredCount > 0 ? ` · 삭제된 옛 단계로 남아있는 로트 ${retiredCount}건은 파이프라인 집계에서 제외돼요` : ""}</span>
          </div>
          <div className="ivs-pipe">
            ${STAGES.map((s, i) => {
              const t = stageTotals[s.key];
              const d = dayDelta.byStage[s.key] || { kg: 0, count: 0 };
              const pct = pipeMax > 0 ? (t.kg / pipeMax) * 100 : 0;
              return html`
                <${Fragment} key=${s.key}>
                  <button
                    type="button"
                    className=${`ivs-pipe-card ${filters.stage === s.key ? "selected" : ""} ${t.kg === 0 ? "empty" : ""}`}
                    style=${{ "--c": s.color }}
                    onClick=${() => setFilters((f) => ({ ...f, stage: f.stage === s.key ? "all" : s.key }))}
                    title=${`${s.label} 단계로 표 필터링`}
                  >
                    <div className="ivs-pipe-name">
                      <span className="ivs-pipe-dot" />${s.label}${bottleneckKey === s.key ? html`<span className="ivs-pipe-flag">병목</span>` : null}
                    </div>
                    <div className="ivs-pipe-val">${fmtTon(t.kg)}<em>톤</em></div>
                    <div className="ivs-pipe-sub">${t.count} lot · ${fmtKg(t.kg)}</div>
                    <${Delta} kg=${d.kg} count=${d.count} label="전일" />
                    <div className="ivs-pipe-bar"><i style=${{ width: `${pct}%` }} /></div>
                  </button>
                  ${i < STAGES.length - 1 ? html`<div className="ivs-pipe-sep">›</div>` : null}
                <//>
              `;
            })}
          </div>
        </div>

        <div className="ivs-filterbar">
          <div className="ivs-search">
            <${Search} size=${15} className="ivs-search-icon" />
            <input
              className="ivs-input ivs-search-input"
              placeholder="검색: 여러 단어 입력 시 모두 포함된 것만"
              value=${filters.search}
              onChange=${(e) => setFilters((f) => ({ ...f, search: e.target.value }))}
            />
          </div>
          <div className="ivs-filter-row">
            <div className="ivs-daterange">
              <input type="date" className="ivs-input" value=${filters.dateFrom}
                onChange=${(e) => setFilters((f) => ({ ...f, dateFrom: e.target.value }))} />
              <span className="ivs-tilde">~</span>
              <input type="date" className="ivs-input" value=${filters.dateTo}
                onChange=${(e) => setFilters((f) => ({ ...f, dateTo: e.target.value }))} />
            </div>
            <select className="ivs-select" value=${filters.year}
              onChange=${(e) => setFilters((f) => ({ ...f, year: e.target.value }))}>
              <option value="all">연도 전체</option>
              ${years.map((y) => html`<option key=${y} value=${y}>${y}년</option>`)}
            </select>
            <label className="ivs-checkbox-label">
              <input type="checkbox" checked=${filters.tollingOnly}
                onChange=${(e) => setFilters((f) => ({ ...f, tollingOnly: e.target.checked }))} />
              톨링품만 보기
            </label>
            <select className="ivs-select" value=${filters.stage}
              onChange=${(e) => setFilters((f) => ({ ...f, stage: e.target.value }))}>
              <option value="all">전체 단계</option>
              ${STAGES.map((s) => html`<option key=${s.key} value=${s.key}>${s.label}</option>`)}
            </select>
            <select className="ivs-select" value=${filters.category}
              onChange=${(e) => setFilters((f) => ({ ...f, category: e.target.value }))}>
              <option value="all">전체 카테고리</option>
              ${CATEGORIES.map((c) => html`<option key=${c.id} value=${c.id}>${c.label}</option>`)}
            </select>
            <button className="ivs-btn" onClick=${resetFilters}><${RotateCcw} size=${13} /> 필터 초기화</button>
            <div className="ivs-spacer" />
            <button className="ivs-btn" onClick=${exportCsv}><${Download} size=${13} /> 엑셀로 내보내기</button>
          </div>
        </div>

        <div className="ivs-qrbar">
          <div className="ivs-qrbar-main">
            <span className="ivs-qrbar-icon"><${QrCode} size=${16} /></span>
            <div>
              <div className="ivs-qrbar-title">QR 라벨 출력</div>
              <div className="ivs-section-hint">
                표 왼쪽 체크박스로 라벨을 뽑을 LOT을 고른 뒤 오른쪽 버튼을 누르면, 고른 LOT의 라벨이 한 번에 나와요.
                ${filters.stage === "usable" ? " (지금 출하대기 단계만 보고 있어요)" : ""}
              </div>
            </div>
          </div>
          <div className="ivs-qrbar-actions">
            <span className=${`ivs-chip ${selectedLots.length ? "accent" : "neutral"}`}>${selectedLots.length}건 선택됨</span>
            <button className="ivs-btn ivs-btn-sm" onClick=${toggleSelectAll} disabled=${filtered.length === 0}>
              ${allVisibleSelected ? "선택 해제" : `표시된 ${filtered.length}건 모두 선택`}
            </button>
            <button className="ivs-btn ivs-btn-primary" onClick=${() => setLabelLots(selectedLots)} disabled=${selectedLots.length === 0}>
              <${QrCode} size=${13} /> 선택한 ${selectedLots.length}건 라벨 출력
            </button>
          </div>
        </div>

        ${canEdit && selected.size > 0 ? html`
          <div className="ivs-bulkbar">
            <span>${selected.size}건 선택됨</span>
            <button className="ivs-btn ivs-btn-primary" onClick=${() => setBulkMoveOpen(true)}>
              <${ArrowRightCircle} size=${13} /> 선택 공정이동
            </button>
            <button className="ivs-btn ivs-btn-danger" onClick=${() => setDeleteTarget("bulk")}>
              <${Trash2} size=${13} /> 선택 삭제
            </button>
            <button className="ivs-btn" onClick=${() => setSelected(new Set())}>선택 해제</button>
          </div>
        ` : null}

        <div className="ivs-table-wrap">
          <table className="ivs-table">
            <thead>
              <tr>
                <th className="ivs-th-check">
                  <input type="checkbox" checked=${allVisibleSelected} onChange=${toggleSelectAll} title="표시된 행 전체 선택" />
                </th>
                <${Th} label="품목코드" sortKey="code" sort=${sort} onSort=${toggleSort} />
                <th>품목명</th>
                <th>카테고리</th>
                <th>거래처</th>
                <th>출고지</th>
                <th>입고 Lot</th>
                <th>주차</th>
                <th>현재공정</th>
                <${Th} label="수량(포함)" sortKey="qtyKg" sort=${sort} onSort=${toggleSort} align="right" />
                <th className="ivs-hide-sm ivs-right">물중량</th>
                <th className="ivs-hide-sm ivs-right">제외무게</th>
                <${Th} label="입고일" sortKey="receivedDate" sort=${sort} onSort=${toggleSort} />
                <th className="ivs-hide-sm">공정이동</th>
                <th className="ivs-th-actions"></th>
              </tr>
            </thead>
            <tbody>
              ${filtered.length === 0 ? html`
                <tr><td colSpan=${15} className="ivs-empty">조건에 맞는 로트가 없어요. 필터를 조정해보세요.</td></tr>
              ` : filtered.map((l) => {
                const cat = categoryById[l.categoryId];
                const stage = getStage(l.stage);
                return html`
                  <tr key=${l.id}>
                    <td><input type="checkbox" checked=${selected.has(l.id)} onChange=${() => toggleSelectOne(l.id)} /></td>
                    <td className="ivs-mono">${l.code}</td>
                    <td>${l.name}</td>
                    <td>${cat ? html`<span className="ivs-badge" style=${{ "--c": cat.color }}>${cat.label}</span>` : null}</td>
                    <td>${l.vendor}</td>
                    <td>${l.shipLoc}</td>
                    <td className="ivs-mono">
                      ${l.lotNo} ${l.carriedOver ? html`<span className="ivs-badge ivs-badge-warn">이월</span>` : null}
                    </td>
                    <td className="ivs-dim">${weekLabel(l.receivedDate)}</td>
                    <td><span className="ivs-badge" style=${{ "--c": stage.color }}>${stage.label}</span></td>
                    <td className="ivs-mono ivs-right">${fmtKg(l.qtyKg)}</td>
                    <td className="ivs-mono ivs-right ivs-hide-sm">${fmtKg(l.waterKg)}</td>
                    <td className="ivs-mono ivs-right ivs-hide-sm">${fmtKg(l.excludeKg)}</td>
                    <td className="ivs-mono">${l.receivedDate}</td>
                    <td className="ivs-dim ivs-hide-sm">${l.lastMove ?? "-"}</td>
                    <td className="ivs-row-menu-cell">
                      ${canEdit ? html`
                        <button className="ivs-icon-btn" onClick=${() => setOpenMenuId(openMenuId === l.id ? null : l.id)}>

                        ${openMenuId === l.id ? html`
                          <div className="ivs-menu" onMouseLeave=${() => setOpenMenuId(null)}>
                            <button onClick=${() => { setFormModal({ mode: "edit", values: { ...l, qtyKg: String(l.qtyKg), waterKg: l.waterKg ?? "", excludeKg: l.excludeKg ?? "" } }); setOpenMenuId(null); }}>
                              <${Pencil} size=${13} /> 수정
                            </button>
                            <button onClick=${() => { setMoveModal(l); setOpenMenuId(null); }}>
                              <${ArrowRightCircle} size=${13} /> 후속공정
                            </button>
                            <button className="ivs-menu-danger" onClick=${() => { setDeleteTarget(l); setOpenMenuId(null); }}>
                              <${Trash2} size=${13} /> 삭제
                            </button>

                `;
              })}
            </tbody>
          </table>
        </div>
        <div className="ivs-tablefoot">${filtered.length}건 표시 중 · 전체 ${lots.length}건</div>
      ` : activeTab === "production" ? html`<${ProductionTab} lots=${lots} moves=${moves} canEdit=${canEdit} onClearMoves=${() => setClearMovesConfirm(true)} onDeleteMoves=${handleDeleteMoves} />`
        : activeTab === "ship" ? html`<${ShipTab} lots=${lots} moves=${moves} canEdit=${canEdit}
            onShip=${handleShip} onLabel=${(sel) => setLabelLots(sel)} />`
        : activeTab === "tolling" ? html`<${TollingTab} lots=${lots} />`
        : activeTab === "dashboard" ? html`<${DashboardTab} lots=${lots} moves=${moves} dayDelta=${dayDelta} />`
        : activeTab === "plan" ? html`<${PlanTab} mes=${mes} canEdit=${canEdit} onSave=${persistMes} />`
        : activeTab === "act" ? html`<${ActualTab} lots=${lots} runs=${runs} mes=${mes} canEdit=${canEdit}
            ym=${actYm} onYm=${setActYm}
            onSave=${handleSaveRun} onDelete=${handleDeleteRun} />`
        : activeTab === "basis" ? html`<${BasisTab} mes=${mes} canEdit=${canEdit} onSave=${persistMes} />`
        : activeTab === "report" ? html`<${ReportTab} mes=${mes} runs=${runs} downs=${downs} lots=${lots} settings=${settings} />`
        : activeTab === "util" ? html`<${UtilTab} mes=${mes} runs=${runs} downs=${downs} />`
        : activeTab === "down" ? html`<${DownTab} mes=${mes} runs=${runs} downs=${downs} canEdit=${canEdit}

      ${formModal ? html`
        <${LotFormModal}

          initial=${formModal.values}

          onCancel=${() => setFormModal(null)}
          onSave=${handleSaveForm}
          onOpenMaster=${(tab) => setMasterModalOpen(tab)}
        />
      ` : null}
      ${masterModalOpen ? html`
        <${MasterModal}
          master=${master}
          lots=${lots}
          onSave=${(next, msg) => persistMaster(next, msg)}
          onClose=${() => setMasterModalOpen(false)}

// 보기 잠금 화면 — 이 PIN을 맞히기 전엔 재고 데이터가 전혀 렌더링되지 않아요 (링크만 있는 사람이 내용을 못 봄).
function ViewGate({ correctPin, title, onUnlock, theme }) {
  const [pin, setPin] = useState("");
  const [error, setError] = useState(false);
  const tryUnlock = () => {
    if (pin === correctPin) onUnlock();
    else setError(true);
  };
  return html`
    <div className="ivs-root ivs-viewgate" data-theme=${theme}>
      <div className="ivs-modal ivs-modal-sm ivs-lock-screen">
        <div className="ivs-lock-icon"><${Lock} size=${22} /></div>
        <h3 className="ivs-lock-title">${title || "재고관리"}</h3>
        <p className="ivs-dim" style=${{ marginBottom: 16 }}>확인하려면 비밀번호를 입력하세요.</p>
        <input
          type="password" className="ivs-input ivs-lock-input"
          value=${pin} onChange=${(e) => { setPin(e.target.value); setError(false); }}
          placeholder="PIN" onKeyDown=${(e) => e.key === "Enter" && tryUnlock()}
          autoFocus
        />
        ${error ? html`<p className="ivs-move-diff loss" style=${{ marginTop: 8 }}>비밀번호가 맞지 않아요.</p>` : null}
        <button className="ivs-btn ivs-btn-primary ivs-lock-submit" onClick=${tryUnlock}>확인</button>
      </div>

  `;
}

function SummaryCard({ label, value, unit, accent, sub, delta, icon }) {

// 전일 대비 증감 배지 — 어제 같은 시점의 상태를 이동이력으로 재구성해서 비교한 값이에요.
function Delta({ kg, count, label = "전일 대비" }) {
  const up = kg > 0.5, down = kg < -0.5;
  const cls = up ? "up" : down ? "down" : "flat";
  const Ico = up ? TrendingUp : down ? TrendingDown : Minus;
  const sign = up ? "+" : down ? "-" : "";
  const lotTxt = count ? ` (${count > 0 ? "+" : "-"}${Math.abs(count)} lot)` : "";
  return html`
    <div className=${`ivs-delta ${cls}`}>
      <${Ico} size=${12} />${sign}${fmtTon(Math.abs(kg))} 톤${lotTxt}<span>${label}</span>
    </div>
  `;
}

function Th({ label, sortKey, sort, onSort, align }) {
  const active = sort.key === sortKey;
  return html`
    <th className=${align === "right" ? "ivs-right" : ""}>
      <button className=${`ivs-th-sort ${active ? "active" : ""}`} onClick=${() => onSort(sortKey)}>
        ${label} <${ArrowUpDown} size=${11} className=${active ? (sort.dir === "asc" ? "ivs-arrow-up" : "") : ""} />
      </button>
    </th>
  `;
}

function Field({ label, children }) {
  return html`<label className="ivs-field"><span>${label}</span>${children}</label>`;
}

function MasterModal({ master, lots, onSave, onClose }) {
  const vendors = master.vendors || [];
  const usedCount = (name) => (lots || []).filter((l) => l.vendor === name).length;
  const [vName, setVName] = useState("");
  const [vLoc, setVLoc] = useState("");
  const [error, setError] = useState("");

  const addVendor = () => {
    const name = vName.trim();
    if (!name) { setError("거래처명을 입력해주세요."); return; }
    if (vendors.some((x) => x.name === name)) { setError("이미 등록된 거래처예요."); return; }
    setError("");
    onSave({ ...master, vendors: [...vendors, { name, loc: vLoc.trim() }] }, `거래처 "${name}"을(를) 등록했어요.`);
    setVName(""); setVLoc("");
  };
  const removeVendor = (name) =>
    onSave({ ...master, vendors: vendors.filter((x) => x.name !== name) }, `거래처 "${name}"을(를) 삭제했어요.`);

  return html`
    <div className="ivs-overlay" onMouseDown=${overlayDown} onClick=${(e) => overlayClick(e, onClose)}>
      <div className="ivs-modal" onClick=${(e) => e.stopPropagation()}>
        <div className="ivs-modal-head">
          <h3>거래처 등록 관리</h3>
          <button className="ivs-icon-btn" onClick=${onClose}><${X} size=${16} /></button>
        </div>
        <div className="ivs-modal-body">
          <div className="ivs-master-form">
            <input className="ivs-input" placeholder="거래처명" value=${vName}
              onChange=${(e) => setVName(e.target.value)} onKeyDown=${(e) => e.key === "Enter" && addVendor()} />
            <input className="ivs-input" placeholder="기본 출고지" value=${vLoc}
              onChange=${(e) => setVLoc(e.target.value)} onKeyDown=${(e) => e.key === "Enter" && addVendor()} />
            <button className="ivs-btn ivs-btn-primary" onClick=${addVendor}><${Plus} size=${13} /> 등록</button>
          </div>
          <p className="ivs-dash-note" style=${{ marginBottom: 10 }}>
            기본 출고지는 로트 추가 시 자동으로 채워지고, 필요하면 그때 바꿀 수 있어요.
          </p>
          <div className="ivs-master-list">
            ${vendors.length === 0 ? html`<div className="ivs-prod-empty">등록된 거래처가 없어요.</div>` : vendors.map((x) => html`
              <div className="ivs-master-row" key=${x.name}>

                </div>

// 여러 로트를 한 번에 다음 공정으로 보낼 때 쓰는 창.
// 단계를 하나 고르면, 고른 로트마다 "이동 후 배출 수량"을 따로 손볼 수 있어요 (기본값은 지금 수량 그대로).
// 파일에서 읽은 표를 우리 로트 형태로 바꾸고, 넣어도 되는지 하나씩 따져봐요.
const IMPORT_HEADERS = ["입고 Lot", "품목코드", "품목명", "카테고리", "거래처", "출고지", "입고일", "현재공정", "수량(Kg)", "물중량(Kg)", "제외무게(Kg)", "톨링품", "이월"];

function buildImportRows(table, existingLots, master) {
  if (!table || table.length === 0) return { rows: [], error: "파일에서 읽을 내용이 없어요." };
  const map = mapHeader(table[0]);
  if (map.lotNo === undefined && map.qtyKg === undefined) {
    return { rows: [], error: "첫 줄에서 열 제목을 찾지 못했어요. 아래 \"양식 내려받기\"로 받은 형식을 써주세요." };
  }
  const body = table.slice(1);
  const pick = (r, f) => (map[f] === undefined ? "" : String(r[map[f]] ?? "").trim());
  const seen = new Set();
  const usedLotNos = new Set(existingLots.map((l) => l.lotNo));
  const vendorNames = (master.vendors || []).map((v) => v.name);
  const stageByLabel = Object.fromEntries(STAGES.map((s) => [s.label, s.key]));
  const catByLabel = Object.fromEntries(CATEGORIES.map((c) => [c.label, c]));
  const catByCode = Object.fromEntries(CATEGORIES.map((c) => [c.code, c]));

  const rows = body.map((r, i) => {
    const errs = [];
    const warns = [];
    const lotNo = pick(r, "lotNo");
    if (!lotNo) errs.push("입고 Lot 없음");
    else if (usedLotNos.has(lotNo)) errs.push("이미 등록된 Lot");
    else if (seen.has(lotNo)) errs.push("파일 내 중복 Lot");
    seen.add(lotNo);

    const qtyRaw = pick(r, "qtyKg").replace(/,/g, "").replace(/kg$/i, "").trim();
    const qtyKg = Number(qtyRaw);
    if (!qtyRaw) errs.push("수량 없음");
    else if (!Number.isFinite(qtyKg) || qtyKg <= 0) errs.push("수량이 숫자가 아님");

    const codeRaw = pick(r, "code");
    const catRaw = pick(r, "categoryId");
    let cat = catByLabel[catRaw] || catByCode[codeRaw] || null;
    if (!cat && catRaw) errs.push(`알 수 없는 카테고리 "${catRaw}"`);
    if (!cat && !catRaw && codeRaw) errs.push(`품목코드 "${codeRaw}" 알 수 없음`);
    if (!cat && !catRaw && !codeRaw) errs.push("품목코드/카테고리 없음");

    const stageRaw = pick(r, "stage");
    let stage = "raw_in";
    if (stageRaw) {
      if (stageByLabel[stageRaw]) stage = stageByLabel[stageRaw];
      else errs.push(`알 수 없는 공정 "${stageRaw}"`);
    }

    const dateRaw = pick(r, "receivedDate");
    const receivedDate = dateRaw ? toDateStr(dateRaw) : new Date().toISOString().slice(0, 10);
    if (dateRaw && !/^\d{4}-\d{2}-\d{2}$/.test(receivedDate)) errs.push(`입고일 형식 확인 "${dateRaw}"`);

    const vendor = pick(r, "vendor");
    if (vendor && vendorNames.length > 0 && !vendorNames.includes(vendor)) warns.push("등록되지 않은 거래처");

    const numOrNull = (t) => {
      const v = t.replace(/,/g, "").trim();
      if (!v) return null;
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    };

    return {
      key: `imp-${i}`,
      line: i + 2, // 파일에서 몇 번째 줄인지 (1줄은 제목)
      errs, warns,
      lot: {
        code: cat ? cat.code : codeRaw,
        name: pick(r, "name") || (cat ? cat.label : ""),
        categoryId: cat ? cat.id : "",
        vendor,
        shipLoc: pick(r, "shipLoc"),
        lotNo,
        receivedDate,
        stage,
        qtyKg: Number.isFinite(qtyKg) ? qtyKg : 0,
        waterKg: numOrNull(pick(r, "waterKg")),
        excludeKg: numOrNull(pick(r, "excludeKg")),
        tolling: truthy(pick(r, "tolling")),
        carriedOver: truthy(pick(r, "carriedOver")),
      },
    };
  });
  return { rows, error: null };
}

// ---------- QR 스캔 입고 ----------
// 바코드/QR 리더기는 대부분 "키보드 웨지" 방식이에요 — 찍으면 사람이 타이핑한 것처럼 글자가 들어오고
// 마지막에 Enter가 눌려요. 그래서 특별한 드라이버 없이, 그냥 입력칸에 커서만 두면 바로 동작해요.
// 읽어들이는 형식 (셋 다 지원):
//   1) DRT|입고Lot|품목코드|중량kg|입고일|생산일   ← 우리 QR 라벨
//   2) 입고Lot,품목코드,중량                       ← 쉼표/탭으로 나뉜 것
//   3) 입고Lot                                     ← Lot 번호만. 나머지는 아래 "공통 정보"를 씁니다
function parseScanOne(raw, dflt) {
  const line = String(raw || "").trim();
  if (!line) return null;
  const num = (t) => {
    const v = Number(String(t == null ? "" : t).replace(/,/g, "").replace(/kg$/i, "").trim());
    return Number.isFinite(v) && v > 0 ? v : null; // null이면 "공통 정보의 Lot당 중량"을 물려받아요
  };
  const m = SCAN_RE.exec(line);
  if (m) {
    const cat = CATEGORIES.find((c) => c.code === m[2]);
    return {
      lotNo: m[1].trim(),
      code: cat ? cat.code : m[2],
      categoryId: cat ? cat.id : dflt.categoryId,
      name: cat ? cat.label : dflt.name,
      qtyKg: num(m[3]),
      receivedDate: /^\d{4}-\d{2}-\d{2}$/.test(m[4]) ? m[4] : dflt.receivedDate,
    };
  }
  const parts = line.split(/[\t,;]/).map((x) => x.trim()).filter(Boolean);
  const cat = parts[1] ? CATEGORIES.find((c) => c.code === parts[1] || c.label === parts[1]) : null;
  return {
    lotNo: (parts[0] || "").trim(),
    code: cat ? cat.code : dflt.code,
    categoryId: cat ? cat.id : dflt.categoryId,
    name: cat ? cat.label : dflt.name,
    qtyKg: num(parts[2]),
    receivedDate: dflt.receivedDate,
  };
}

// 연번 Lot 만들기 — "B260907-" 접두어에 1~50을 붙여서 50건을 한 번에.
function buildRangeLots(prefix, from, to, pad, dflt) {
  const a = Number(from), b = Number(to);
  if (!Number.isFinite(a) || !Number.isFinite(b) || a > b) return [];
  const n = Math.min(b - a + 1, 500); // 한 번에 500건까지 (실수로 1~99999를 넣는 사고 방지)
  const fallback = dflt;
  return Array.from({ length: n }, (_, i) => {
    const num = a + i;
    const suffix = pad > 0 ? String(num).padStart(pad, "0") : String(num);
    return { ...fallback, qtyKg: null, lotNo: `${prefix}${suffix}` };
  });
}

function ScanInModal({ lots, master, onCancel, onConfirm }) {
  const today = new Date().toISOString().slice(0, 10);
  const vendors = master.vendors || [];
  const [mode, setMode] = useState("scan"); // "scan" | "range"

    categoryId: "blackmass",

  const [flash, setFlash] = useState(null); // { ok, text } — 찍은 직후 잠깐 보여주는 확인 표시
  const inputRef = useRef(null);

  const cat = categoryById[common.categoryId] || CATEGORIES[0];
  const commonKg = Number(common.qtyKg) > 0 ? Number(common.qtyKg) : null;
  const dflt = { code: cat.code, categoryId: cat.id, name: cat.label, receivedDate: common.receivedDate };
  // 줄마다 중량을 따로 넣지 않았으면 공통 정보의 "Lot당 중량"을 그대로 씁니다 —
  // 그래서 공통 중량을 나중에 고쳐도 이미 담아둔 Lot들에 한꺼번에 반영돼요.
  const effKg = (r) => (r.qtyKg == null ? commonKg : Number(r.qtyKg));

  useEffect(() => {
    if (mode === "scan") inputRef.current?.focus();
  }, [mode]);

  const existing = useMemo(() => new Set(lots.map((l) => l.lotNo)), [lots]);
  const decorate = (list) => {
    const seen = new Set();
    return list.map((r, i) => {
      const errs = [];
      if (!r.lotNo) errs.push("Lot 번호 없음");
      else if (/[|\t]/.test(r.lotNo)) errs.push("Lot 번호에 이상한 문자가 섞였어요");
      else if (existing.has(r.lotNo)) errs.push("이미 등록된 Lot");
      else if (seen.has(r.lotNo)) errs.push("이번 목록에서 중복");
      seen.add(r.lotNo);
      if (!(effKg(r) > 0)) errs.push("중량 없음");
      return { ...r, key: `s-${i}-${r.lotNo}`, kg: effKg(r), errs };
    });
  };
  const shown = decorate(rows);
  const okRows = shown.filter((r) => r.errs.length === 0);
  const totalKg = okRows.reduce((a, r) => a + r.kg, 0);
  const needKg = shown.filter((r) => r.errs.includes("중량 없음")).length;

  const pushScan = (text) => {
    const parsed = parseScanOne(text, dflt);
    if (!parsed || !parsed.lotNo) { setFlash({ ok: false, text: "읽지 못했어요" }); return; }
    if (existing.has(parsed.lotNo) || rows.some((r) => r.lotNo === parsed.lotNo)) {
      setFlash({ ok: false, text: `${parsed.lotNo} — 이미 있어요` });
      return;
    }
    setRows((prev) => [parsed, ...prev]);
    const kg = parsed.qtyKg == null ? commonKg : parsed.qtyKg;
    setFlash({ ok: true, text: `${parsed.lotNo} · ${kg > 0 ? fmtKg(kg) : "중량을 넣어주세요"}` });
  };

  const onKey = (e) => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    const v = buf.trim();
    setBuf("");
    if (v) pushScan(v);
  };

  const applyRange = () => {
    const list = buildRangeLots(range.prefix.trim(), range.from, range.to, Number(range.pad) || 0, dflt);
    if (list.length === 0) { setFlash({ ok: false, text: "번호 범위를 확인해주세요" }); return; }
    setRows(list);
    setFlash({ ok: true, text: `${list.length}건을 만들었어요` });
  };

  const submit = () => {
    if (okRows.length === 0) return;
    onConfirm(okRows.map((r) => ({
      code: r.code, name: r.name, categoryId: r.categoryId,
      vendor: common.vendor, shipLoc: common.shipLoc,
      lotNo: r.lotNo, receivedDate: r.receivedDate, stage: common.stage,
      qtyKg: r.kg, waterKg: null, excludeKg: null,
      tolling: common.tolling, carriedOver: false,
    })));
  };

    <div className="ivs-overlay" onMouseDown=${overlayDown} onClick=${(e) => overlayClick(e, onCancel)}>

        </div>
        <div className="ivs-modal-body">
          <div className="ivs-seg">
            <button className=${`ivs-seg-btn ${mode === "scan" ? "on" : ""}`} onClick=${() => setMode("scan")}>

            </button>
            <button className=${`ivs-seg-btn ${mode === "range" ? "on" : ""}`} onClick=${() => setMode("range")}>

            </button>
          </div>

          <div className="ivs-scan-common">
            <div className="ivs-scan-common-head">공통 정보 — 이번에 넣는 Lot 전부에 똑같이 붙어요</div>
            <div className="ivs-form-grid">
              <${Field} label="품목">
                <select value=${common.categoryId} onChange=${(e) => setCommon({ ...common, categoryId: e.target.value })}>
                  ${CATEGORIES.map((c) => html`<option key=${c.id} value=${c.id}>${c.code} · ${c.label}</option>`)}
                </select>
              <//>
              <${Field} label="거래처">
                <select value=${common.vendor} onChange=${(e) => {
                  const v = vendors.find((x) => x.name === e.target.value);
                  setCommon({ ...common, vendor: e.target.value, shipLoc: v ? v.loc : common.shipLoc });
                }}>
                  <option value="">(선택 안 함)</option>
                  ${vendors.map((v) => html`<option key=${v.name} value=${v.name}>${v.name}</option>`)}
                </select>
              <//>
              <${Field} label="출고지">
                <input value=${common.shipLoc} onChange=${(e) => setCommon({ ...common, shipLoc: e.target.value })} />
              <//>
              <${Field} label="입고 공정">
                <select value=${common.stage} onChange=${(e) => setCommon({ ...common, stage: e.target.value })}>
                  ${STAGES.filter((st) => !FINAL_STAGE_KEYS.includes(st.key)).map((st) => html`<option key=${st.key} value=${st.key}>${st.label}</option>`)}
                </select>
              <//>
              <${Field} label="입고일">
                <input type="date" value=${common.receivedDate} onChange=${(e) => setCommon({ ...common, receivedDate: e.target.value })} />
              <//>
              <${Field} label=${`Lot당 중량 (Kg)${mode === "scan" ? " — QR에 중량이 없을 때만 씀" : ""}`}>
                <input type="number" value=${common.qtyKg} onChange=${(e) => setCommon({ ...common, qtyKg: e.target.value })} />
              <//>
            </div>
            <label className="ivs-check-row">
              <input type="checkbox" checked=${common.tolling} onChange=${(e) => setCommon({ ...common, tolling: e.target.checked })} />
              <span>톨링품으로 등록</span>
            </label>
          </div>

          ${mode === "scan" ? html`
            <div className="ivs-scanbox">
              <div className="ivs-scanbox-label"><${Icon} name="qr-code" size=${15} /> 아래 칸에 커서를 두고 리더기로 찍으세요 — 한 건씩 바로 쌓입니다</div>
              <input
                ref=${inputRef}
                className="ivs-scaninput"
                value=${buf}
                placeholder="여기를 클릭한 뒤 QR을 찍거나, Lot 번호를 직접 입력하고 Enter"
                onChange=${(e) => setBuf(e.target.value)}
                onKeyDown=${onKey}
                onBlur=${(e) => {
                  // 빈 곳을 클릭해 포커스가 풀린 경우에만 다시 가져와요.
                  // (공통 정보 칸을 누른 건데 커서를 뺏어오면 거기 입력이 스캔칸으로 들어가버려요)
                  if (!e.relatedTarget) setTimeout(() => inputRef.current?.focus(), 0);
                }}
              />
              ${flash ? html`<div className=${`ivs-scanflash ${flash.ok ? "ok" : "bad"}`}>
                <${Icon} name=${flash.ok ? "check" : "alert-triangle"} size=${14} /> ${flash.text}
              </div>` : html`<div className="ivs-scanflash muted">아직 찍은 게 없어요</div>`}
            </div>
          ` : html`
            <div className="ivs-scanbox">
              <div className="ivs-scanbox-label"><${Icon} name="layers" size=${15} /> 접두어와 번호 범위를 넣으면 연번 Lot이 한 번에 만들어져요</div>
              <div className="ivs-form-grid">

              <div className="ivs-range-foot">

              : html`<table className="ivs-table"><thead><tr>

                    <td><button className="ivs-icon-btn" onClick=${() => setRows(rows.filter((_, j) => j !== i))}><${Icon} name="trash-2" size=${14} /></button></td>
                  </tr>`)}
                </tbody></table>`}
          </div>
        </div>
        <div className="ivs-modal-foot">
          <span className="ivs-bulk-sum">등록 가능 <b>${okRows.length}</b>건 · <b>${totalKg.toLocaleString("ko-KR")}</b> Kg</span>
          <span className="ivs-spacer"></span>
          <button className="ivs-btn" onClick=${onCancel}>취소</button>
          <button className="ivs-btn ivs-btn-primary" disabled=${okRows.length === 0} onClick=${submit}>
            ${okRows.length > 0 ? `${okRows.length}건 입고 등록` : "입고 등록"}
          </button>
        </div>
      </div>
    </div>`;
}

function ImportLotsModal({ lots, master, onCancel, onConfirm }) {
  const [rows, setRows] = useState(null);

  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const handleFile = async (file) => {
    if (!file) return;
    setBusy(true); setError(""); setRows(null); setFileName(file.name);
    try {
      const buf = await file.arrayBuffer();
      let table;
      if (/\.xlsx$/i.test(file.name)) {
        table = await readXlsxRows(buf);
      } else {
        const text = decodeText(buf);
        // QR 라벨기로 찍은 파일이면 라벨 문자열을 그대로 읽어요.
        const scans = parseScanLines(text);
        if (scans.length > 0) {
          table = [["입고 Lot", "품목코드", "수량(Kg)", "입고일"],
            ...scans.map((s) => [s.lotNo, s.code, s.qtyKg, s.receivedDate])];
        } else {
          const delim = (text.split("\n")[0] || "").includes("\t") ? "\t" : ",";
          table = parseDelimited(text, delim);
        }
      }
      const built = buildImportRows(table, lots, master);
      if (built.error) setError(built.error);
      setRows(built.rows);
    } catch (e) {
      setError(e && e.message ? e.message : "파일을 읽지 못했어요.");
    } finally {
      setBusy(false);
    }
  };

  const downloadTemplate = () => {
    const cat = CATEGORIES[0];

  return html`

            />
            <button className="ivs-btn" onClick=${downloadTemplate}>
              <${Download} size=${13} /> 양식 내려받기
            </button>
            <span className="ivs-section-hint">

// ---------- 아직 만들지 않은 화면 안내 ----------
// ---------- 가동율 · 비가동 계산 엔진 ----------
// 세 화면(가동율 현황 · 비가동 현황 · 보고서)이 같은 숫자를 쓰도록 계산을 여기 한 곳에 모아뒀어요.
//
// 가동율은 두 갈래로 나눠서 봐요 — 둘을 곱한 게 종합가동율이에요.
//   시간가동율 = 실제 돌린 시간 ÷ 계획 시간            (얼마나 안 섰나)
//   성능가동율 = 실제 투입량 ÷ (capa × 실제 돌린 시간)  (돌 때 얼마나 제 성능을 냈나)
const dateRange = (from, to) => {
  const out = [];
  let d = new Date(`${from}T00:00:00`);
  const end = new Date(`${to}T00:00:00`);
  while (d <= end && out.length < 800) {
    out.push(d.toISOString().slice(0, 10));
    d = new Date(d.getTime() + 86400000);
  }
  return out;
};
const addDaysStr = (dateStr, n) => new Date(new Date(`${dateStr}T00:00:00`).getTime() + n * 86400000).toISOString().slice(0, 10);
// 그 주의 월요일
const mondayOf = (dateStr) => {
  const d = new Date(`${dateStr}T00:00:00`);
  return addDaysStr(dateStr, -((d.getDay() + 6) % 7));
};

function dayRecord(dateStr, mes, runs, downs) {
  const plan = planForDay(mes, dateStr);
  const capa = mesRates(mes, dateStr.slice(0, 7)).capa;
  const rs = runs.filter((r) => r.date === dateStr);
  const ds = downs.filter((r) => r.date === dateStr);
  const sum = (arr, f) => arr.reduce((a, b) => a + (Number(typeof f === "function" ? f(b) : b[f]) || 0), 0);
  const outOf = (arr, kind) => arr.reduce((a, r) => a + sum((r.outputs || []).filter((o) => o.kind === kind), "qtyKg"), 0);

  const rec = {
    date: dateStr, dow: dowOf(dateStr), plan, capa,
    inputKg: sum(rs, "inputKg"),
    inDayKg: sum(rs.filter((r) => r.shift === "day"), "inputKg"),
    inNightKg: sum(rs.filter((r) => r.shift === "night"), "inputKg"),
    workers: sum(rs, "workers"),
    shifts: rs.length,
    out: { bm: outOf(rs, "bm"), cu: outOf(rs, "cu"), al: outOf(rs, "al"), cd: outOf(rs, "cd") },
    planKg: plan.totalKg,
    planMin: Math.round((plan.dayHours + plan.nightHours) * 60),
    dtMin: sum(ds, "min"),
    dtCount: ds.length,
  };
  rec.outKg = rec.out.bm + rec.out.cu + rec.out.al + rec.out.cd;
  rec.runMin = Math.max(0, rec.planMin - rec.dtMin);
  rec.capKg = (capa * rec.runMin) / 60;            // 그 시간 동안 낼 수 있었던 최대 처리량
  rec.utilTime = rec.planMin > 0 ? (rec.runMin / rec.planMin) * 100 : null;
  rec.utilPerf = rec.capKg > 0 ? (rec.inputKg / rec.capKg) * 100 : null;
  rec.utilAll = rec.utilTime != null && rec.utilPerf != null ? (rec.utilTime * rec.utilPerf) / 100 : null;
  rec.achieve = rec.planKg > 0 ? (rec.inputKg / rec.planKg) * 100 : null;
  rec.perCap = rec.workers > 0 ? rec.inputKg / rec.workers : null;
  return rec;
}

// 여러 날을 하나로 합쳐요. capa가 달마다 다를 수 있어서, 성능가동율은
// "낼 수 있었던 최대 처리량(capKg)"을 날짜별로 더한 뒤에 한 번에 나눠요.
function rollupDays(list, label) {
  const a = {
    label: label || "", days: list.length, from: list[0]?.date || "", to: list[list.length - 1]?.date || "",
    inputKg: 0, inDayKg: 0, inNightKg: 0, planKg: 0, planMin: 0, runMin: 0, dtMin: 0, dtCount: 0,
    capKg: 0, workers: 0, shifts: 0, outKg: 0, out: { bm: 0, cu: 0, al: 0, cd: 0 }, opDays: 0, actDays: 0,
  };
  list.forEach((r) => {
    ["inputKg", "inDayKg", "inNightKg", "planKg", "planMin", "runMin", "dtMin", "dtCount", "capKg", "workers", "shifts", "outKg"]
      .forEach((k) => { a[k] += r[k] || 0; });
    ["bm", "cu", "al", "cd"].forEach((k) => { a.out[k] += r.out[k] || 0; });
    if (r.planKg > 0) a.opDays++;
    if (r.inputKg > 0) a.actDays++;
  });
  a.utilTime = a.planMin > 0 ? (a.runMin / a.planMin) * 100 : null;
  a.utilPerf = a.capKg > 0 ? (a.inputKg / a.capKg) * 100 : null;
  a.utilAll = a.utilTime != null && a.utilPerf != null ? (a.utilTime * a.utilPerf) / 100 : null;
  a.achieve = a.planKg > 0 ? (a.inputKg / a.planKg) * 100 : null;
  a.perCap = a.workers > 0 ? a.inputKg / a.workers : null;
  a.rate = { bm: null, cu: null, al: null, cd: null };
  if (a.inputKg > 0) ["bm", "cu", "al", "cd"].forEach((k) => { a.rate[k] = (a.out[k] / a.inputKg) * 100; });
  a.yieldPct = a.inputKg > 0 ? (a.outKg / a.inputKg) * 100 : null;
  return a;
}

const recordsFor = (from, to, mes, runs, downs) => dateRange(from, to).map((d) => dayRecord(d, mes, runs, downs));

// 주 단위로 묶어요 (월요일 시작)
function groupWeeks(recs) {
  const m = new Map();
  recs.forEach((r) => {
    const k = mondayOf(r.date);
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(r);
  });
  return Array.from(m.entries()).map(([k, rows]) => ({
    ...rollupDays(rows, `${k.slice(5).replace("-", "/")} 주`),
    key: k,
  }));
}
// 월 단위로 묶어요
function groupMonths(recs) {
  const m = new Map();
  recs.forEach((r) => {
    const k = r.date.slice(0, 7);
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(r);
  });
  return Array.from(m.entries()).map(([k, rows]) => ({ ...rollupDays(rows, k), key: k }));
}

// 설비별 비가동 시간과 가동율 — 그 설비가 선 시간을 전체 계획시간에서 뺀 비율이에요.
function equipStats(from, to, mes, runs, downs) {
  const tot = rollupDays(recordsFor(from, to, mes, runs, downs));
  const inRange = downs.filter((r) => r.date >= from && r.date <= to);
  return EQUIPMENT.map((e) => {
    const rows = inRange.filter((r) => r.eqId === e.id);
    const min = rows.reduce((a, b) => a + (Number(b.min) || 0), 0);
    return {
      ...e, min, count: rows.length,
      util: tot.planMin > 0 ? Math.max(0, ((tot.planMin - min) / tot.planMin) * 100) : null,
      mttr: rows.length > 0 ? min / rows.length : null, // 건당 평균 정지시간
    };
  });
}

// 비가동을 어떤 기준으로든 묶어서 큰 순서로 정렬 (파레토용)
function groupDowns(rows, keyFn) {
  const m = new Map();
  rows.forEach((r) => {
    const k = keyFn(r) || "미지정";
    if (!m.has(k)) m.set(k, { key: k, min: 0, count: 0 });
    const o = m.get(k);
    o.min += Number(r.min) || 0;
    o.count += 1;
  });
  return Array.from(m.values()).sort((a, b) => b.min - a.min);
}

// 분 → "3시간 20분" 처럼 읽기 쉽게
function fmtMin(min) {
  const v = Math.round(Number(min) || 0);
  if (v === 0) return "0분";
  const h = Math.floor(v / 60), m = v % 60;
  return h > 0 ? (m > 0 ? `${h}시간 ${m}분` : `${h}시간`) : `${m}분`;
}
const fmtPct = (v, d = 1) => (v == null ? "-" : `${v.toFixed(d)}%`);

// 기간 고르기 — 일/주/월 공통 (세 화면이 같은 방식으로 기간을 고르게)
function usePeriod(initial = "month") {
  const today = new Date().toISOString().slice(0, 10);
  const [gran, setGran] = useState(initial); // "day" | "week" | "month"
  const [anchor, setAnchor] = useState(today);
  const from = gran === "day" ? anchor : gran === "week" ? mondayOf(anchor) : `${anchor.slice(0, 7)}-01`;
  const to = gran === "day" ? anchor
    : gran === "week" ? addDaysStr(mondayOf(anchor), 6)
    : monthDateList(anchor.slice(0, 7)).slice(-1)[0];
  const label = gran === "day" ? `${anchor} (${dowOf(anchor)})`
    : gran === "week" ? `${from} ~ ${to}`
    : anchor.slice(0, 7);
  return { gran, setGran, anchor, setAnchor, from, to, label, today };
}

function PeriodBar({ p, right }) {
  return html`
    <div className="ivs-periodbar">
      <div className="ivs-seg">
        ${[["day", "일별"], ["week", "주간"], ["month", "월간"]].map(([k, t]) => html`
          <button key=${k} className=${`ivs-seg-btn ${p.gran === k ? "on" : ""}`} onClick=${() => p.setGran(k)}>${t}</button>
        `)}
      </div>
      <input className="ivs-input" type=${p.gran === "month" ? "month" : "date"}
        value=${p.gran === "month" ? p.anchor.slice(0, 7) : p.anchor}
        onChange=${(e) => p.setAnchor(p.gran === "month" ? `${e.target.value}-01` : e.target.value)} />
      <span className="ivs-section-hint">${p.label}</span>
      <span className="ivs-spacer"></span>
      ${right || null}
    </div>`;
}

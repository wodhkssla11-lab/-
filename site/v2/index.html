function SummaryCard({ label, value, unit, accent, sub }) {
  return html`
    <div className=${`ivs-summary-card ${accent ? "accent" : ""}`}>
      <div className="ivs-summary-label">${label}</div>
      <div className="ivs-summary-value">${value} <span className="ivs-summary-unit">${unit}</span></div>
      ${sub ? html`<div className="ivs-summary-sub">${sub}</div>` : null}
    </div>
  `;
}

function Th({ label, sortKey, sort, onSort, align }) {
  const active = sort.key === sortKey;
  return html`
    <th className=${align === "right" ? "ivs-right" : ""}>
      <button className=${`ivs-th-sort ${active ? "active" : ""}`} onClick=${() => onSort(sortKey)}>
        ${label} <${ArrowUpDown} size=${11} className=${active ? (sort.dir === "asc" ? "ivs-arrow-up" : "") : ""} />
      </button>
    </th>
  `;
}

function Field({ label, children }) {
  return html`<label className="ivs-field"><span>${label}</span>${children}</label>`;
}

function LotFormModal({ mode, initial, master, onCancel, onSave, onOpenMaster }) {
  const [v, setV] = useState(initial);
  const vendors = master.vendors || [];
  const set = (k) => (e) => {
    const val = e && e.target ? (e.target.type === "checkbox" ? e.target.checked : e.target.value) : e;
    setV((prev) => ({ ...prev, [k]: val }));
  };
  const onVendorChange = (e) => {
    if (e.target.value === "__manage__") { onOpenMaster("vendors"); return; }
    const vendor = vendors.find((x) => x.name === e.target.value);
    if (vendor) setV((prev) => ({ ...prev, vendor: vendor.name, shipLoc: vendor.loc || prev.shipLoc }));
  };
  // 카테고리를 고르면 품목코드가 그에 맞춰 자동으로 정해져요.
  const onCategoryChange = (e) => {
    const cat = categoryById[e.target.value];
    setV((prev) => ({ ...prev, categoryId: cat.id, code: cat.code }));
  };
  return html`
    <div className="ivs-overlay" onClick=${onCancel}>
      <div className="ivs-modal" onClick=${(e) => e.stopPropagation()}>
        <div className="ivs-modal-head">
          <h3>${mode === "add" ? "새 로트 추가" : "로트 수정"}</h3>
          <button className="ivs-icon-btn" onClick=${onCancel}><${X} size=${16} /></button>
        </div>
        <div className="ivs-modal-body ivs-form-grid">
          <${Field} label="카테고리 *">
            <select className="ivs-select ivs-select-full" value=${v.categoryId} onChange=${onCategoryChange}>
              ${CATEGORIES.map((c) => html`<option key=${c.id} value=${c.id}>${c.label}</option>`)}
            </select>
          <//>
          <${Field} label="품목코드 (카테고리에 따라 자동)">
            <input className="ivs-input ivs-input-auto ivs-mono" value=${v.code} readOnly tabIndex=${-1} />
          <//>
          <${Field} label="품목명"><input className="ivs-input" value=${v.name} onChange=${set("name")} /><//>
          <${Field} label="거래처">
            <select className="ivs-select ivs-select-full" value=${v.vendor} onChange=${onVendorChange}>
              ${!vendors.some((x) => x.name === v.vendor) && v.vendor ? html`<option value=${v.vendor}>${v.vendor}</option>` : null}
              ${vendors.map((x) => html`<option key=${x.name} value=${x.name}>${x.name}</option>`)}
              <option value="__manage__">+ 거래처 등록·관리…</option>
            </select>
          <//>
          <${Field} label="출고지"><input className="ivs-input" value=${v.shipLoc} onChange=${set("shipLoc")} /><//>
          <${Field} label="로트번호 *"><input className="ivs-input" value=${v.lotNo} onChange=${set("lotNo")} /><//>
          <${Field} label="현재단계">
            <select className="ivs-select ivs-select-full" value=${v.stage} onChange=${set("stage")}>
              ${STAGES.map((s) => html`<option key=${s.key} value=${s.key}>${s.label}</option>`)}
            </select>
          <//>
          <${Field} label="입고일"><input type="date" className="ivs-input" value=${v.receivedDate} onChange=${set("receivedDate")} /><//>
          <${Field} label="수량(Kg) *"><input type="number" className="ivs-input" value=${v.qtyKg} onChange=${set("qtyKg")} /><//>
          <${Field} label="물중량(Kg)"><input type="number" className="ivs-input" value=${v.waterKg} onChange=${set("waterKg")} /><//>
          <${Field} label="제외무게(Kg)"><input type="number" className="ivs-input" value=${v.excludeKg} onChange=${set("excludeKg")} /><//>
          <div className="ivs-form-checks">
            <label className="ivs-checkbox-label"><input type="checkbox" checked=${v.tolling} onChange=${set("tolling")} /> 톨링품</label>
            <label className="ivs-checkbox-label"><input type="checkbox" checked=${v.carriedOver} onChange=${set("carriedOver")} /> 이월</label>
          </div>
        </div>
        <div className="ivs-modal-foot">
          <button className="ivs-btn" onClick=${onCancel}>취소</button>
          <button className="ivs-btn ivs-btn-primary" onClick=${() => onSave(v)}>${mode === "add" ? "추가" : "저장"}</button>
        </div>
      </div>
    </div>
  `;
}

// 거래처 · 품목코드를 등록/삭제하는 화면. 여기서 등록한 항목이 "새 로트 추가" 폼의 선택지가 돼요.
function MasterModal({ master, onSave, onClose }) {
  const vendors = master.vendors || [];
  const [vName, setVName] = useState("");
  const [vLoc, setVLoc] = useState("");
  const [error, setError] = useState("");

  const addVendor = () => {
    const name = vName.trim();
    if (!name) { setError("거래처명을 입력해주세요."); return; }
    if (vendors.some((x) => x.name === name)) { setError("이미 등록된 거래처예요."); return; }
    setError("");
    onSave({ ...master, vendors: [...vendors, { name, loc: vLoc.trim() }] }, `거래처 "${name}"을(를) 등록했어요.`);
    setVName(""); setVLoc("");
  };
  const removeVendor = (name) =>
    onSave({ ...master, vendors: vendors.filter((x) => x.name !== name) }, `거래처 "${name}"을(를) 삭제했어요.`);

  return html`
    <div className="ivs-overlay" onClick=${onClose}>
      <div className="ivs-modal" onClick=${(e) => e.stopPropagation()}>
        <div className="ivs-modal-head">
          <h3>거래처 등록 관리</h3>
          <button className="ivs-icon-btn" onClick=${onClose}><${X} size=${16} /></button>
        </div>
        <div className="ivs-modal-body">
          <div className="ivs-master-form">
            <input className="ivs-input" placeholder="거래처명 (예: 삼성에스디아이(주))" value=${vName}
              onChange=${(e) => setVName(e.target.value)} onKeyDown=${(e) => e.key === "Enter" && addVendor()} />
            <input className="ivs-input" placeholder="기본 출고지 (예: 천안SDI)" value=${vLoc}
              onChange=${(e) => setVLoc(e.target.value)} onKeyDown=${(e) => e.key === "Enter" && addVendor()} />
            <button className="ivs-btn ivs-btn-primary" onClick=${addVendor}><${Plus} size=${13} /> 등록</button>
          </div>
          <p className="ivs-dash-note" style=${{ marginBottom: 10 }}>
            기본 출고지는 로트 추가 시 자동으로 채워지고, 필요하면 그때 바꿀 수 있어요.
          </p>
          <div className="ivs-master-list">
            ${vendors.length === 0 ? html`<div className="ivs-prod-empty">등록된 거래처가 없어요.</div>` : vendors.map((x) => html`
              <div className="ivs-master-row" key=${x.name}>
                <div><strong>${x.name}</strong>${x.loc ? html`<span className="ivs-dim"> · ${x.loc}</span>` : null}</div>
                <button className="ivs-icon-btn ivs-menu-danger" onClick=${() => removeVendor(x.name)} title="삭제"><${Trash2} size=${13} /></button>
              </div>
            `)}
          </div>
          ${error ? html`<p className="ivs-move-diff loss" style=${{ marginTop: 10 }}>${error}</p>` : null}

          <div className="ivs-settings-divider" style=${{ margin: "16px 0 12px" }} />
          <div className="ivs-card-label" style=${{ marginBottom: 10 }}>카테고리 · 품목코드 (고정)</div>
          <div className="ivs-master-list">
            ${CATEGORIES.map((c) => html`
              <div className="ivs-master-row" key=${c.id}>
                <div><span className="ivs-badge" style=${{ "--c": c.color }}>${c.label}</span></div>
                <strong className="ivs-mono">${c.code}</strong>
              </div>
            `)}
          </div>
          <p className="ivs-dash-note" style=${{ marginTop: 10, marginBottom: 0 }}>
            품목코드는 카테고리마다 하나로 고정돼요. 로트를 추가할 때 카테고리를 고르면 자동으로 입력됩니다.
            거래처를 삭제해도 이미 등록된 로트 데이터는 그대로 남고, 앞으로 선택지에서만 빠져요.
          </p>
        </div>
        <div className="ivs-modal-foot">
          <button className="ivs-btn ivs-btn-primary" onClick=${onClose}>닫기</button>
        </div>
      </div>
    </div>
  `;
}

function MoveStageModal({ lot, onCancel, onConfirm }) {
  const [target, setTarget] = useState(lot.stage);
  const [outputQty, setOutputQty] = useState(String(lot.qtyKg));
  const outNum = Number(outputQty) || 0;
  const diff = outNum - lot.qtyKg;
  return html`
    <div className="ivs-overlay" onClick=${onCancel}>
      <div className="ivs-modal ivs-modal-sm" onClick=${(e) => e.stopPropagation()}>
        <div className="ivs-modal-head">
          <h3>단계 이동 · ${lot.lotNo}</h3>
          <button className="ivs-icon-btn" onClick=${onCancel}><${X} size=${16} /></button>
        </div>
        <div className="ivs-modal-body">
          <p className="ivs-dim" style=${{ marginBottom: 10 }}>
            현재 단계: <span className="ivs-badge" style=${{ "--c": stageByKey[lot.stage].color }}>${stageByKey[lot.stage].label}</span>
          </p>
          <div className="ivs-stage-picker">
            ${STAGES.map((s) => html`
              <button
                key=${s.key}
                className=${`ivs-stage-pick ${target === s.key ? "active" : ""}`}
                style=${{ "--stage-color": s.color }}
                onClick=${() => setTarget(s.key)}
              >
                ${s.label}
              </button>
            `)}
          </div>
          <label className="ivs-field" style=${{ marginTop: 14 }}>
            <span>이동 후 배출 수량 (Kg) — 투입 ${lot.qtyKg.toLocaleString("ko-KR")}Kg</span>
            <input type="number" className="ivs-input" value=${outputQty} onChange=${(e) => setOutputQty(e.target.value)} />
          </label>
          ${diff !== 0 ? html`
            <p className=${`ivs-move-diff ${diff < 0 ? "loss" : "mix"}`}>
              ${diff < 0 ? `공정손실 ${Math.abs(diff).toLocaleString("ko-KR")}Kg` : `혼합증가 +${diff.toLocaleString("ko-KR")}Kg`}
            </p>
          ` : null}
        </div>
        <div className="ivs-modal-foot">
          <button className="ivs-btn" onClick=${onCancel}>취소</button>
          <button className="ivs-btn ivs-btn-primary" onClick=${() => onConfirm(lot, target, outNum)} disabled=${target === lot.stage || outNum <= 0}>
            이동
          </button>
        </div>
      </div>
    </div>
  `;
}

function SettingsModal({ settings, unlocked, onUnlock, onSave, onClose }) {
  const hasPin = !!settings.editPin;
  const canEditNow = !hasPin || unlocked;
  const [pinInput, setPinInput] = useState("");
  const [pinError, setPinError] = useState(false);
  const [titleDraft, setTitleDraft] = useState(settings.title);
  const [subtitleDraft, setSubtitleDraft] = useState(settings.subtitle);
  const [newPin, setNewPin] = useState("");
  const [removePinChecked, setRemovePinChecked] = useState(false);
  const hasViewPin = !!settings.viewPin;
  const [newViewPin, setNewViewPin] = useState("");
  const [removeViewPinChecked, setRemoveViewPinChecked] = useState(false);

  const tryUnlock = () => {
    if (pinInput === settings.editPin) { onUnlock(); setPinError(false); }
    else setPinError(true);
  };

  if (!canEditNow) {
    return html`
      <div className="ivs-overlay" onClick=${onClose}>
        <div className="ivs-modal ivs-modal-sm ivs-lock-screen" onClick=${(e) => e.stopPropagation()}>
          <button className="ivs-icon-btn ivs-lock-close" onClick=${onClose}><${X} size=${16} /></button>
          <div className="ivs-lock-icon"><${Lock} size=${22} /></div>
          <h3 className="ivs-lock-title">잠겨 있습니다</h3>
          <p className="ivs-dim" style=${{ marginBottom: 16 }}>편집하려면 등록한 비밀번호를 입력해주세요.</p>
          <input
            type="password" className="ivs-input ivs-lock-input"
            value=${pinInput} onChange=${(e) => { setPinInput(e.target.value); setPinError(false); }}
            placeholder="PIN" onKeyDown=${(e) => e.key === "Enter" && tryUnlock()}
            autoFocus
          />
          ${pinError ? html`<p className="ivs-move-diff loss" style=${{ marginTop: 8 }}>비밀번호가 맞지 않아요.</p>` : null}
          <button className="ivs-btn ivs-btn-primary ivs-lock-submit" onClick=${tryUnlock}>확인</button>
        </div>
      </div>
    `;
  }

  return html`
    <div className="ivs-overlay" onClick=${onClose}>
      <div className="ivs-modal" onClick=${(e) => e.stopPropagation()}>
        <div className="ivs-modal-head">
          <h3>설정</h3>
          <button className="ivs-icon-btn" onClick=${onClose}><${X} size=${16} /></button>
        </div>
        <div className="ivs-modal-body" style=${{ display: "flex", flexDirection: "column", gap: 14 }}>
          <${Field} label="팀 / 타이틀 이름"><input className="ivs-input" value=${titleDraft} onChange=${(e) => setTitleDraft(e.target.value)} /><//>
          <${Field} label="부제목"><input className="ivs-input" value=${subtitleDraft} onChange=${(e) => setSubtitleDraft(e.target.value)} /><//>
          <div className="ivs-settings-divider" />
          <${Field} label=${hasViewPin ? "보기 비밀번호 변경 (팀원에게 알려주는 것, 비워두면 그대로 유지)" : "보기 비밀번호 설정 (선택 — 켜두면 이 PIN 없이는 아무것도 안 보여요)"}>
            <input
              type="password" className="ivs-input" value=${newViewPin}
              onChange=${(e) => setNewViewPin(e.target.value)}
              placeholder=${hasViewPin ? "새 보기 비밀번호" : "예: 팀에 공유할 짧은 숫자"}
            />
          <//>
          ${hasViewPin ? html`
            <label className="ivs-checkbox-label">
              <input type="checkbox" checked=${removeViewPinChecked} onChange=${(e) => setRemoveViewPinChecked(e.target.checked)} />
              보기 잠금을 완전히 해제하기 (이후 링크만 있으면 누구나 바로 보여요)
            </label>
          ` : null}
          <div className="ivs-settings-divider" />
          <${Field} label=${hasPin ? "편집 비밀번호 변경 (관리자만 아는 것, 비워두면 그대로 유지)" : "편집 비밀번호 설정 (선택)"}>
            <input
              type="password" className="ivs-input" value=${newPin}
              onChange=${(e) => setNewPin(e.target.value)}
              placeholder=${hasPin ? "새 편집 비밀번호" : "예: 나만 아는 짧은 문구"}
            />
          <//>
          ${hasPin ? html`
            <label className="ivs-checkbox-label">
              <input type="checkbox" checked=${removePinChecked} onChange=${(e) => setRemovePinChecked(e.target.checked)} />
              편집 잠금을 완전히 해제하기 (이후 누구나 편집 가능해져요)
            </label>
          ` : null}
          <p className="ivs-dash-note" style=${{ margin: 0 }}>
            ⚠ 두 비밀번호는 서로 달라야 안전해요 — <b>보기 비밀번호</b>는 팀원에게 알려줘서 "링크 열면 아무것도 안 보이고 이걸 넣어야
            재고가 보이는" 용도이고, <b>편집 비밀번호</b>는 관리자(나)만 알아서 입력/수정 권한을 여는 용도예요. 이 페이지는 실시간
            연동이라, 편집 잠금을 풀고 입력·수정하면 저장하는 즉시(1초 이내) 팀원 화면에도 그대로 반영돼요 — 따로 내보내서
            전달할 필요가 없어요. 보안을 위해 두 잠금 모두 해제 상태를 저장하지 않아서, 새로고침할 때마다 다시 입력해야 해요 (본인 포함).
          </p>
        </div>
        <div className="ivs-modal-foot">
          <button className="ivs-btn" onClick=${onClose}>취소</button>
          <button
            className="ivs-btn ivs-btn-primary"
            onClick=${() => onSave({
              title: titleDraft.trim() || settings.title,
              subtitle: subtitleDraft.trim() || settings.subtitle,
              editPin: removePinChecked ? "" : (newPin ? newPin : settings.editPin),
              viewPin: removeViewPinChecked ? "" : (newViewPin ? newViewPin : settings.viewPin),
            })}
          >
            저장
          </button>
        </div>
      </div>
    </div>
  `;
}

function ProductionTab({ lots, moves, canEdit, onClearMoves }) {
  const todayStr = new Date().toISOString().slice(0, 10);
  const [selectedDate, setSelectedDate] = useState(todayStr);

  const availableYears = useMemo(() => {
    const s = new Set(
      [...lots.map((l) => l.receivedDate?.slice(0, 4)), ...moves.map((m) => m.date?.slice(0, 4)), String(new Date().getFullYear())]
        .filter(Boolean)
    );
    return Array.from(s).sort().reverse();
  }, [lots, moves]);

  const [year, setYear] = useState(availableYears[0] || String(new Date().getFullYear()));
  const [month, setMonth] = useState("all"); // 'all' | '1'..'12'
  const [day, setDay] = useState("all"); // 'all' | '1'..'31'

  const dayOptions = useMemo(() => {
    if (month === "all") return [];
    const n = new Date(Number(year), Number(month), 0).getDate();
    return Array.from({ length: n }, (_, i) => String(i + 1));
  }, [year, month]);

  const inPeriod = useCallback((dateStr) => {
    if (!dateStr) return false;
    const [y, m, d] = dateStr.split("-");
    if (y !== year) return false;
    if (month !== "all" && Number(m) !== Number(month)) return false;
    if (month !== "all" && day !== "all" && Number(d) !== Number(day)) return false;
    return true;
  }, [year, month, day]);

  const dayReceipts = useMemo(
    () => lots.filter((l) => l.receivedDate === selectedDate).sort((a, b) => (a.lotNo > b.lotNo ? 1 : -1)),
    [lots, selectedDate]
  );
  const dayMoves = useMemo(() => moves.filter((m) => m.date === selectedDate), [moves, selectedDate]);
  const dayReceiptQty = sumBy(dayReceipts, "qtyKg");
  const dayDischargeQty = sumBy(dayMoves, "outputQty");
  const dayLossQty = sumBy(dayMoves, "lossQty");
  const dayMixQty = sumBy(dayMoves, "mixQty");

  const periodLots = useMemo(() => lots.filter((l) => inPeriod(l.receivedDate)), [lots, inPeriod]);
  const periodMoves = useMemo(() => moves.filter((m) => inPeriod(m.date)), [moves, inPeriod]);
  const totalIn = sumBy(periodLots, "qtyKg");
  const totalOut = sumBy(periodMoves, "outputQty");
  const totalLoss = sumBy(periodMoves, "lossQty");
  const totalMix = sumBy(periodMoves, "mixQty");
  const recoveryRate = totalIn > 0 ? (totalOut / totalIn) * 100 : 0;

  const stageYield = useMemo(() => {
    const map = new Map();
    periodMoves.forEach((m) => {
      const key = `${m.fromStage}__${m.toStage}`;
      if (!map.has(key)) map.set(key, { fromStage: m.fromStage, toStage: m.toStage, input: 0, output: 0 });
      const row = map.get(key);
      row.input += m.inputQty;
      row.output += m.outputQty;
    });
    return Array.from(map.values());
  }, [periodMoves]);

  return html`
    <div className="ivs-prod">
      <div className="ivs-prod-report-head" style=${{ marginBottom: 16 }}>
        <p className="ivs-prod-desc" style=${{ margin: 0 }}>
          공정이동 이력을 생산 관점에서 모아 보여줍니다. 재고현황과 같은 이력 데이터를 그대로 사용해요 —
          여기서 뭔가 등록하는 게 아니라, "재고현황"에서 등록한 공정이동을 분석용으로 다시 보여주는 화면입니다.
          이 이력은 로트와는 별개로 남기 때문에, 재고현황에서 로트를 지워도 여기 통계에는 과거 이동 기록이 그대로 반영돼요.
        </p>
        ${canEdit ? html`
          <button className="ivs-btn" onClick=${onClearMoves} title="공정이동 이력만 모두 지워요 (로트 데이터는 남아요)" style=${{ flexShrink: 0 }}>
            <${Trash2} size=${13} /> 이력 전체 삭제
          </button>
        ` : null}
      </div>

      <div className="ivs-card">
        <div className="ivs-prod-report-head">
          <div className="ivs-card-label" style=${{ marginBottom: 0 }}><${FileText} size=${13} style=${{ verticalAlign: -2, marginRight: 4 }} />일일 작업일보</div>
          <div className="ivs-prod-report-actions">
            <input type="date" className="ivs-input" value=${selectedDate} onChange=${(e) => setSelectedDate(e.target.value)} />
            <button className="ivs-btn" onClick=${() => window.print()}><${Printer} size=${13} /> 인쇄</button>
          </div>
        </div>
        <div className="ivs-summary-row ivs-summary-row-4">
          <${SummaryCard} label="신규 입고" value=${fmtTon(dayReceiptQty)} unit="톤" />
          <${SummaryCard} label="공정이동 배출" value=${fmtTon(dayDischargeQty)} unit="톤" />
          <${SummaryCard} label="공정손실" value=${fmtTon(dayLossQty)} unit="톤" />
          <${SummaryCard} label="혼합증가" value=${fmtTon(dayMixQty)} unit="톤" />
        </div>

        <div className="ivs-prod-listlabel">신규 입고 (${dayReceipts.length}건)</div>
        <div className="ivs-prod-list">
          ${dayReceipts.length === 0 ? html`
            <div className="ivs-prod-empty">이 날 등록된 신규 입고가 없습니다.</div>
          ` : dayReceipts.map((l) => html`
            <div className="ivs-prod-row" key=${l.id}>
              ${l.code} · ${l.name} · ${l.lotNo} · ${Number(l.qtyKg).toLocaleString("ko-KR")}Kg${l.carriedOver ? " (이월재고)" : ""}
            </div>
          `)}
        </div>

        <div className="ivs-prod-listlabel">공정이동 (${dayMoves.length}건)</div>
        <div className="ivs-prod-list">
          ${dayMoves.length === 0 ? html`
            <div className="ivs-prod-empty">이 날 등록된 공정이동이 없습니다.</div>
          ` : dayMoves.map((m) => html`
            <div className="ivs-prod-row" key=${m.id}>
              ${m.code} · ${m.lotNo} · ${stageByKey[m.fromStage]?.label} → ${stageByKey[m.toStage]?.label} ·
              투입 ${Number(m.inputQty).toLocaleString("ko-KR")}Kg → 배출 ${Number(m.outputQty).toLocaleString("ko-KR")}Kg
              ${m.lossQty > 0 ? html`<span className="ivs-prod-tag loss">손실 ${m.lossQty.toLocaleString("ko-KR")}Kg</span>` : null}
              ${m.mixQty > 0 ? html`<span className="ivs-prod-tag mix">혼합증가 ${m.mixQty.toLocaleString("ko-KR")}Kg</span>` : null}
            </div>
          `)}
        </div>
      </div>

      <div className="ivs-prod-periodbar">
        <span className="ivs-dim">기간</span>
        <select className="ivs-select" value=${year} onChange=${(e) => setYear(e.target.value)}>
          ${availableYears.map((y) => html`<option key=${y} value=${y}>${y}년</option>`)}
        </select>
        <select className="ivs-select" value=${month} onChange=${(e) => { setMonth(e.target.value); setDay("all"); }}>
          <option value="all">연간 전체</option>
          ${Array.from({ length: 12 }, (_, i) => i + 1).map((m) => html`<option key=${m} value=${String(m)}>${m}월</option>`)}
        </select>
        <select className="ivs-select" value=${day} onChange=${(e) => setDay(e.target.value)} disabled=${month === "all"}>
          <option value="all">일자 전체</option>
          ${dayOptions.map((d) => html`<option key=${d} value=${d}>${d}일</option>`)}
        </select>
      </div>

      <div className="ivs-summary-row ivs-summary-row-5">
        <${SummaryCard} label="총 입고량 (선택 기간)" value=${fmtTon(totalIn)} unit="톤" />
        <${SummaryCard} label="총 배출량/생산량 (선택 기간)" value=${fmtTon(totalOut)} unit="톤" />
        <${SummaryCard} label="총 공정손실 (선택 기간)" value=${fmtTon(totalLoss)} unit="톤" />
        <${SummaryCard} label="총 혼합증가 (선택 기간)" value=${fmtTon(totalMix)} unit="톤" />
        <${SummaryCard} label="입고대비 회수율 (선택 기간)" value=${recoveryRate.toFixed(1)} unit="%" accent=${true} />
      </div>

      <div className="ivs-card">
        <div className="ivs-card-label">단계 구간별 수율 (투입 → 배출, 선택 기간)</div>
        ${stageYield.length === 0 ? html`
          <div className="ivs-prod-empty center">해당 기간에 등록된 공정이동이 없습니다.</div>
        ` : html`
          <table className="ivs-table ivs-yield-table">
            <thead>
              <tr><th>구간</th><th className="ivs-right">투입</th><th className="ivs-right">배출</th><th className="ivs-right">수율</th></tr>
            </thead>
            <tbody>
              ${stageYield.map((r) => html`
                <tr key=${`${r.fromStage}__${r.toStage}`}>
                  <td>
                    <span className="ivs-badge" style=${{ "--c": stageByKey[r.fromStage]?.color }}>${stageByKey[r.fromStage]?.label}</span>${" → "}<span className="ivs-badge" style=${{ "--c": stageByKey[r.toStage]?.color }}>${stageByKey[r.toStage]?.label}</span>
                  </td>
                  <td className="ivs-mono ivs-right">${fmtTon(r.input)} 톤</td>
                  <td className="ivs-mono ivs-right">${fmtTon(r.output)} 톤</td>
                  <td className="ivs-mono ivs-right">${r.input > 0 ? ((r.output / r.input) * 100).toFixed(1) : "0.0"}%</td>
                </tr>
              `)}
            </tbody>
          </table>
        `}
      </div>
    </div>
  `;
}

function TollingTab({ lots }) {
  const tollingLots = useMemo(() => lots.filter((l) => l.tolling), [lots]);
  const [selectedLoc, setSelectedLoc] = useState("");

  const totals = useMemo(() => {
    const totalIn = sumBy(tollingLots, "qtyKg");
    const inProgress = tollingLots.filter((l) => !FINAL_STAGE_KEYS.includes(l.stage)).reduce((s, l) => s + l.qtyKg, 0);
    const done = tollingLots.filter((l) => FINAL_STAGE_KEYS.includes(l.stage)).reduce((s, l) => s + l.qtyKg, 0);
    return { totalIn, inProgress, done };
  }, [tollingLots]);

  const groupBy = (keyFn, extra) => {
    const map = new Map();
    tollingLots.forEach((l) => {
      const key = keyFn(l);
      if (!map.has(key)) map.set(key, { key, in: 0, prog: 0, ...extra(l) });
      const row = map.get(key);
      row.in += l.qtyKg;
      if (!FINAL_STAGE_KEYS.includes(l.stage)) row.prog += l.qtyKg;
    });
    return Array.from(map.values()).sort((a, b) => b.in - a.in);
  };

  const byLoc = useMemo(() => groupBy((l) => l.shipLoc, (l) => ({ label: l.shipLoc })), [tollingLots]);
  const byItemVendor = useMemo(
    () => groupBy((l) => `${l.code}__${l.vendor}`, (l) => ({ label: `${l.code}·${l.name} · ${l.vendor}` })),
    [tollingLots]
  );
  const byItem = useMemo(() => groupBy((l) => l.code, (l) => ({ label: `${l.code} · ${l.name}` })), [tollingLots]);

  const byLocDrill = useMemo(() => {
    if (!selectedLoc) return [];
    const map = new Map();
    tollingLots.filter((l) => l.shipLoc === selectedLoc).forEach((l) => {
      const catLabel = categoryById[l.categoryId]?.label || "기타";
      const wk = weekLabel(l.receivedDate);
      const key = `${catLabel}__${wk}`;
      if (!map.has(key)) map.set(key, { key, label: `${catLabel} · ${wk}`, in: 0, prog: 0 });
      const row = map.get(key);
      row.in += l.qtyKg;
      if (!FINAL_STAGE_KEYS.includes(l.stage)) row.prog += l.qtyKg;
    });
    return Array.from(map.values()).sort((a, b) => b.in - a.in);
  }, [tollingLots, selectedLoc]);

  const locOptions = useMemo(() => Array.from(new Set(tollingLots.map((l) => l.shipLoc))).sort(), [tollingLots]);

  const AggList = ({ rows, emptyMsg }) =>
    rows.length === 0 ? html`<div className="ivs-prod-empty center">${emptyMsg}</div>` : html`
      <div className="ivs-agg-list">
        ${rows.map((r) => html`
          <div className="ivs-agg-row" key=${r.key}>
            <div className="ivs-agg-name">${r.label}</div>
            <div className="ivs-agg-pair">
              <div className="ivs-agg-stat"><span>${fmtTon(r.in)} 톤</span><small>입고량</small></div>
              <div className="ivs-agg-stat"><span>${fmtTon(r.prog)} 톤</span><small>재공 현재고</small></div>
            </div>
          </div>
        `)}
      </div>
    `;

  return html`
    <div className="ivs-tolling">
      <p className="ivs-prod-desc">
        여기서는 "재고현황"에 등록할 때 톨링품으로 체크한 로트만 모아서 출고지·품목·주차별로 집계해서 보여줍니다.
        개별 로트를 편집하려면 재고현황 탭에서 "톨링품만 보기"를 켜세요.
      </p>

      <div className="ivs-summary-row">
        <${SummaryCard} label="톨링 총 입고량" value=${fmtTon(totals.totalIn)} unit="톤" />
        <${SummaryCard} label="톨링 현재고 (재공)" value=${fmtTon(totals.inProgress)} unit="톤" accent=${true} />
        <${SummaryCard} label="톨링 완료(출고) 합계" value=${fmtTon(totals.done)} unit="톤" />
      </div>

      <div className="ivs-card">
        <div className="ivs-card-label">출고지별 입고량 / 재공 현재고 (톤)</div>
        <${AggList} rows=${byLoc} emptyMsg="등록된 톨링품이 없습니다." />
      </div>

      <div className="ivs-card">
        <div className="ivs-card-head-row">
          <div className="ivs-card-label" style=${{ marginBottom: 0 }}>출고지 선택 → 품목 × 주차/월차별 입고량 / 재공 현재고 (톤)</div>
          <select className="ivs-select" value=${selectedLoc} onChange=${(e) => setSelectedLoc(e.target.value)}>
            <option value="">출고지를 선택하세요</option>
            ${locOptions.map((loc) => html`<option key=${loc} value=${loc}>${loc}</option>`)}
          </select>
        </div>
        ${!selectedLoc ? html`
          <div className="ivs-prod-empty center">
            위에서 출고지를 선택하면 해당 출고지의 품목·주차/월차별 입고량과 재공현재고가 표시됩니다.
            (예: 천안SDI 선택 시 "양극스크랩 · 8월 1주차"처럼 나뉘어 보여요)
          </div>
        ` : html`<${AggList} rows=${byLocDrill} emptyMsg=${`${selectedLoc}의 톨링품 데이터가 없습니다.`} />`}
      </div>

      <div className="ivs-card">
        <div className="ivs-card-label">품목 × 거래처별 입고량 / 재공 현재고 (톤)</div>
        <${AggList} rows=${byItemVendor} emptyMsg="등록된 톨링품이 없습니다." />
      </div>

      <div className="ivs-card">
        <div className="ivs-card-label">품목별 입고량 / 재공 현재고 (톤)</div>
        <${AggList} rows=${byItem} emptyMsg="등록된 톨링품이 없습니다." />
      </div>
    </div>
  `;
}

function CollapsibleCard({ title, children }) {
  const [open, setOpen] = useState(true);
  return html`
    <div className="ivs-card">
      <button className="ivs-collapse-head" onClick=${() => setOpen((o) => !o)}>
        <span className="ivs-card-label" style=${{ marginBottom: 0 }}>${title}</span>
        <${ChevronDown} size=${14} className=${`ivs-collapse-chevron ${open ? "" : "closed"}`} />
      </button>
      ${open ? html`<div className="ivs-collapse-body">${children}</div>` : null}
    </div>
  `;
}

function RankedBarList({ rows }) {
  if (!rows || rows.length === 0) return html`<div className="ivs-prod-empty">데이터가 없습니다.</div>`;
  const max = Math.max(...rows.map((r) => r.kg), 1);
  return html`
    <div className="ivs-rank-list">
      ${rows.map((r) => html`
        <div className="ivs-rank-row" key=${r.key}>
          <div className="ivs-rank-left">
            ${r.color ? html`<span className="ivs-rank-dot" style=${{ background: r.color }} />` : null}
            <span className="ivs-rank-label">${r.label}</span>
            <span className="ivs-rank-count">· ${r.count}건</span>
          </div>
          <div className="ivs-rank-right">
            <div className="ivs-rank-value">
              ${fmtTon(r.kg)} 톤
              ${r.netKg != null ? html`<span className="ivs-rank-net">제외 ${fmtTon(r.netKg)} 톤</span>` : null}
            </div>
            <div className="ivs-rank-bar-track">
              <div className="ivs-rank-bar-fill" style=${{ width: `${Math.max(4, (r.kg / max) * 100)}%`, background: r.color || "var(--accent-2)" }} />
            </div>
          </div>
        </div>
      `)}
    </div>
  `;
}

const RANK_PALETTE = ["#4C8DFF", "#B98CF2", "#45D6B8", "#E3993D", "#6EC6FF", "#F2C46D", "#F0645C", "#9AA5B8"];

function DashboardTab({ lots, moves }) {
  const availableYears = useMemo(() => {
    const s = new Set(
      [...lots.map((l) => l.receivedDate?.slice(0, 4)), ...moves.map((m) => m.date?.slice(0, 4)), String(new Date().getFullYear())]
        .filter(Boolean)
    );
    return Array.from(s).sort().reverse();
  }, [lots, moves]);

  const [year, setYear] = useState(availableYears[0] || String(new Date().getFullYear()));
  const [month, setMonth] = useState("all");
  const [day, setDay] = useState("all");

  const dayOptions = useMemo(() => {
    if (month === "all") return [];
    const n = new Date(Number(year), Number(month), 0).getDate();
    return Array.from({ length: n }, (_, i) => String(i + 1));
  }, [year, month]);

  const inPeriod = useCallback((dateStr) => {
    if (!dateStr) return false;
    const [y, m, d] = dateStr.split("-");
    if (y !== year) return false;
    if (month !== "all" && Number(m) !== Number(month)) return false;
    if (month !== "all" && day !== "all" && Number(d) !== Number(day)) return false;
    return true;
  }, [year, month, day]);

  const periodLots = useMemo(() => lots.filter((l) => inPeriod(l.receivedDate)), [lots, inPeriod]);

  // ---------- 선택 기간 요약 ----------
  const totalInKg = sumBy(periodLots, "qtyKg");
  const totalNetKg = periodLots.reduce((s, l) => s + (l.qtyKg - (l.waterKg || 0)), 0);
  const usableKg = periodLots.filter((l) => l.stage === "usable").reduce((s, l) => s + l.qtyKg, 0);
  const calcineKg = periodLots.filter((l) => l.stage === "calcine_needed").reduce((s, l) => s + l.qtyKg, 0);

  // ---------- 실시간 현재고 (기간 무관) ----------
  const liveTotalKg = sumBy(lots, "qtyKg");
  const liveNetKg = lots.reduce((s, l) => s + (l.qtyKg - (l.waterKg || 0)), 0);

  // ---------- 월마감(기준일) 스냅샷 ----------
  const asOfDate = useMemo(() => computeAsOfDate(year, month, day), [year, month, day]);
  const movesByLot = useMemo(() => {
    const map = new Map();
    moves.forEach((m) => {
      const key = m.lotId || m.lotNo;
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(m);
    });
    return map;
  }, [moves]);

  const snapshot = useMemo(() => {
    const stageTotals = Object.fromEntries(STAGES.map((s) => [s.key, 0]));
    lots.forEach((l) => {
      const lotMoves = movesByLot.get(l.id) || movesByLot.get(l.lotNo) || [];
      const state = reconstructLotState(l, lotMoves, asOfDate);
      if (state) stageTotals[state.stage] = (stageTotals[state.stage] || 0) + state.qtyKg;
    });
    const inProgress = STAGES.filter((s) => !FINAL_STAGE_KEYS.includes(s.key)).reduce((s, st) => s + stageTotals[st.key], 0);
    const done = FINAL_STAGE_KEYS.reduce((s, k) => s + stageTotals[k], 0);
    return { stageTotals, inProgress, done };
  }, [lots, movesByLot, asOfDate]);

  // ---------- 카테고리별 현재고 (실시간, 재공 중) ----------
  const categoryLive = useMemo(() => {
    const map = new Map();
    lots.filter((l) => !FINAL_STAGE_KEYS.includes(l.stage)).forEach((l) => {
      const cat = categoryById[l.categoryId];
      const key = cat ? cat.id : "__none";
      if (!map.has(key)) map.set(key, { key, label: cat ? cat.label : "(미분류)", color: cat ? cat.color : "#94A3B8", count: 0, kg: 0 });
      const row = map.get(key);
      row.count += 1; row.kg += l.qtyKg;
    });
    return Array.from(map.values()).sort((a, b) => b.kg - a.kg);
  }, [lots]);

  // ---------- 품목별 입고 순위 (선택 기간) ----------
  const itemRank = useMemo(() => {
    const map = new Map();
    periodLots.forEach((l) => {
      const key = l.code;
      if (!map.has(key)) map.set(key, { key, label: `${l.code} · ${l.name}`, count: 0, kg: 0, netKg: 0 });
      const row = map.get(key);
      row.count += 1; row.kg += l.qtyKg; row.netKg += (l.qtyKg - (l.waterKg || 0));
    });
    return Array.from(map.values()).sort((a, b) => b.kg - a.kg).map((r, i) => ({ ...r, color: RANK_PALETTE[i % RANK_PALETTE.length] }));
  }, [periodLots]);

  // ---------- 카테고리별 입고 순위 (선택 기간) ----------
  const categoryRank = useMemo(() => {
    const map = new Map();
    periodLots.forEach((l) => {
      const cat = categoryById[l.categoryId];
      const key = cat ? cat.id : "__none";
      if (!map.has(key)) map.set(key, { key, label: cat ? cat.label : "(미분류)", color: cat ? cat.color : "#94A3B8", count: 0, kg: 0 });
      const row = map.get(key);
      row.count += 1; row.kg += l.qtyKg;
    });
    return Array.from(map.values()).sort((a, b) => b.kg - a.kg);
  }, [periodLots]);

  // ---------- 거래처별 입고 순위 (선택 기간) ----------
  const vendorRank = useMemo(() => {
    const map = new Map();
    periodLots.forEach((l) => {
      const key = l.vendor;
      if (!map.has(key)) map.set(key, { key, label: l.vendor, count: 0, kg: 0 });
      const row = map.get(key);
      row.count += 1; row.kg += l.qtyKg;
    });
    return Array.from(map.values()).sort((a, b) => b.kg - a.kg).map((r, i) => ({ ...r, color: RANK_PALETTE[i % RANK_PALETTE.length] }));
  }, [periodLots]);

  return html`
    <div className="ivs-dash">
      <div className="ivs-prod-periodbar">
        <span className="ivs-dim">기간</span>
        <select className="ivs-select" value=${year} onChange=${(e) => setYear(e.target.value)}>
          ${availableYears.map((y) => html`<option key=${y} value=${y}>${y}년</option>`)}
        </select>
        <select className="ivs-select" value=${month} onChange=${(e) => { setMonth(e.target.value); setDay("all"); }}>
          <option value="all">연간 전체</option>
          ${Array.from({ length: 12 }, (_, i) => i + 1).map((m) => html`<option key=${m} value=${String(m)}>${m}월</option>`)}
        </select>
        <select className="ivs-select" value=${day} onChange=${(e) => setDay(e.target.value)} disabled=${month === "all"}>
          <option value="all">일자 전체</option>
          ${dayOptions.map((d) => html`<option key=${d} value=${d}>${d}일</option>`)}
        </select>
      </div>

      <div className="ivs-summary-row ivs-summary-row-4">
        <${SummaryCard} label="총 입고량 (선택 기간)" value=${fmtTon(totalInKg)} unit="톤" sub=${`물중량 제외 ${fmtTon(totalNetKg)} 톤`} />
        <${SummaryCard} label="사용가능 (선택 기간)" value=${fmtTon(usableKg)} unit="톤" />
        <${SummaryCard} label="소성필요 (선택 기간)" value=${fmtTon(calcineKg)} unit="톤" />
        <${SummaryCard} label="현재고 (실시간)" value=${fmtTon(liveTotalKg)} unit="톤" sub=${`물중량 제외 ${fmtTon(liveNetKg)} 톤`} accent=${true} />
      </div>

      <p className="ivs-dash-note">
        ※ "총 입고량"과 최종단계 카드(예: 사용가능·소성필요)는 선택한 기간 기준이고, "현재고"는 기간과 무관하게 지금 이 순간의 실시간 수량입니다.
      </p>

      <div className="ivs-card">
        <div className="ivs-card-label"><${Calendar} size=${13} style=${{ verticalAlign: -2, marginRight: 4 }} />월마감(기준일) 재고 스냅샷</div>
        <p className="ivs-dash-note">
          위에서 "일"까지 선택하면 그 날짜 기준, "일"을 비워두면 선택한 달의 말일 기준 재고를 보여줍니다 (연간 전체면 그 해 12/31 기준).
          실시간 현재고와 달리, 그 시점에 실제로 얼마나 있었는지를 이동이력 기반으로 재구성한 값이에요.
        </p>
        <div className="ivs-summary-row">
          <${SummaryCard} label="기준일" value=${asOfDate} unit="" />
          <${SummaryCard} label="재공재고 (기준일)" value=${fmtTon(snapshot.inProgress)} unit="톤" accent=${true} />
          <${SummaryCard} label="완료(출고) 합계 (기준일)" value=${fmtTon(snapshot.done)} unit="톤" />
        </div>
        <div className="ivs-stage-breakdown">
          ${STAGES.map((s) => html`
            <div className="ivs-stage-breakdown-row" key=${s.key}>
              <div>${s.label}${FINAL_STAGE_KEYS.includes(s.key) ? html`<span className="ivs-final-badge">최종</span>` : null}</div>
              <div className="ivs-stage-breakdown-val"><span style=${{ color: s.color }}>${fmtTon(snapshot.stageTotals[s.key])} 톤</span><small>재고</small></div>
            </div>
          `)}
        </div>
      </div>

      <${CollapsibleCard} title="카테고리별 현재고 (실시간, 재공 중)">
        <${RankedBarList} rows=${categoryLive} />
      <//>

      <${CollapsibleCard} title="품목별 입고 순위 (선택 기간)">
        <${RankedBarList} rows=${itemRank.slice(0, 12)} />
      <//>

      <${CollapsibleCard} title="카테고리별 입고 순위 (선택 기간)">
        <${RankedBarList} rows=${categoryRank} />
      <//>

      <${CollapsibleCard} title="거래처별 입고 순위 (선택 기간)">
        <${RankedBarList} rows=${vendorRank} />
      <//>
    </div>
  `;
}

function ConfirmModal({ icon, title, body, confirmLabel, danger, onCancel, onConfirm }) {
  return html`
    <div className="ivs-overlay" onClick=${onCancel}>
      <div className="ivs-modal ivs-modal-sm" onClick=${(e) => e.stopPropagation()}>
        <div className="ivs-modal-body ivs-confirm-body">
          <div className=${`ivs-confirm-icon ${danger ? "danger" : ""}`}>${icon}</div>
          <div>
            <h3 className="ivs-confirm-title">${title}</h3>
            <p className="ivs-dim">${body}</p>
          </div>
        </div>
        <div className="ivs-modal-foot">
          <button className="ivs-btn" onClick=${onCancel}>취소</button>
          <button className=${`ivs-btn ${danger ? "ivs-btn-danger" : "ivs-btn-primary"}`} onClick=${onConfirm}>${confirmLabel}</button>
        </div>
      </div>
    </div>
  `;
}

// ---------- 마운트 ----------
// 렌더 전에 Firebase에서 한 번 읽어와 LIVE_DATA를 채워요. 그래야 InventorySystem이 처음
// 렌더될 때부터 올바른 초기값(잠금 여부 포함)을 가지고 시작하고, 그 다음부터는 실시간 구독이 이어받아요.
(async function bootstrap() {
  const rootEl = document.getElementById("ivs-app-root");
  LIVE_DATA = (await fetchLive()) || FALLBACK_DATA;
  ReactDOM.createRoot(rootEl).render(html`<${InventorySystem} />`);
})();
</script>
</body>
</html>
